D.ko={title:"이용약관", eff:"시행일:      년    월    일", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"제1조 (목적)", b:["본 약관은 주식회사 부만(이하 '회사')이 제공하는 외국인 관광 안내 앱 'Money Puzzle Tour for Korea'(https://navi.moneypuzzle.co.kr, 이하 '서비스')의 이용 조건을 정하는 것을 목적으로 합니다."]},
 {h:"제2조 (서비스의 내용)", b:[
   "서비스는 다음을 제공합니다.",
   ["관광지·맛집·숙소·편의시설 등 여행 정보 제공",
    "현재 위치 기반의 주변 추천 및 길 안내",
    "가이드 동행 투어·체험·입장권 등 여행상품의 판매 (판매 당사자: 회사)",
    "외부 여행 예약 플랫폼으로의 연결"],
   "여행상품 대금은 회사가 계약한 전자지급결제대행사(토스페이먼츠)의 결제창을 통해 회사에 지급됩니다."]},
 {h:"제3조 (여행상품의 판매와 가이드)", b:[
   "서비스에서 판매하는 투어·체험 상품의 판매 당사자는 회사입니다. 이용자는 회사와 계약하고 대금을 회사에 지급하며, 상품의 이행·변경·취소·환불에 대한 책임은 회사가 집니다.",
   "최소 출발 인원이 있는 상품은 출발 24시간 전까지 인원이 차지 않으면 회사가 계약을 취소하고 받은 금액 전액을 환불합니다.",
   "투어에 동행하는 가이드는 회사가 업무를 맡긴 가이드(프리랜서 포함)이며, 가이드의 수당은 회사가 지급합니다. 이용자는 가이드에게 요금을 따로 지급하지 않습니다.",
   "외부 플랫폼을 통한 예약·결제·취소·환불 등은 해당 업체의 약관과 책임에 따릅니다."]},
 {h:"제3조의2 (노래방 곡 이용권)", b:[
   "회사는 서비스 안 노래방에서 쓰는 선불 「곡 이용권」을 판매합니다(1곡 1,000원, 묶음으로 사면 서비스 곡 증정). 묶음 구성과 가격은 판매 화면에 표시된 대로입니다.",
   "곡 이용권은 정식 반주 곡을 부를 때 사용되며, 노래 1곡을 부를 때마다 이용권 1곡이 차감됩니다.",
   "곡 이용권은 로그인한 계정에 쌓이며 구매일로부터 1년간 보관됩니다.",
   "환불: 구매일로부터 7일 이내에는 결제 금액에서 사용한 곡을 1곡 1,000원으로 계산해 뺀 금액을, 7일이 지난 뒤(보관 기간 1년 안)에는 그 금액에서 환불 수수료 10%를 뺀 금액을 환불합니다. 서비스로 받은 곡은 환불 대상이 아니며, 계산 결과가 0원 이하면 환불 금액은 없습니다(10원 미만 버림). 자세한 내용은 환불 규정을 따릅니다."]},
 {h:"제3조의3 (노래방 포인트)", b:["회사는 서비스 안 노래방에서 사용하는 선불 「포인트」를 판매합니다. 1포인트(P)는 1원에 해당하며, 충전 단위와 가격은 각 구매 화면에 표시된 대로입니다.","포인트는 로그인한 계정의 지갑 하나에 기록되며, 웹과 전용 앱에서 같은 포인트를 충전하고 사용합니다.","포인트는 유료 포인트(이용자가 결제로 충전한 포인트)와 무료 포인트(충전 혜택·이벤트 등으로 회사가 무상으로 지급한 포인트)로 나누어 기록합니다.","포인트를 사용할 때는 유료 포인트를 먼저(먼저 충전한 것부터) 사용하고, 그다음 무료 포인트를 사용합니다. 포인트를 사용하기 전에는 사용할 포인트와 사용 후 잔여 포인트를 화면에 표시하고 이용자의 확인을 받습니다.",["유효기간: 포인트는 충전(지급)일로부터 1년간 사용할 수 있으며, 유효기간이 지난 포인트는 사용할 수 없습니다.","유효기간 연장: 유효기간 안에 이용자가 요청하면 유료 포인트의 유효기간을 3개월씩 연장합니다(「내 지갑 → 기간 연장」). 다만 연장된 유효기간은 충전일로부터 5년을 넘을 수 없습니다.","만료 알림: 회사는 유효기간 만료 30일 전을 포함하여 3회 이상 만료일, 연장 가능 여부와 방법, 만료 후에도 잔여 유료 포인트를 환불받을 수 있다는 사실을 이메일 또는 서비스 화면으로 알립니다."],["환불(구매일로부터 7일 이내): 사용하지 않은 유료 포인트는 일부를 사용했더라도 수수료 없이 전부 환불합니다.","환불(구매일로부터 7일이 지난 뒤, 유효기간 안): 잔여 유료 포인트에서 10% 이내의 환불 수수료를 공제하고 환불합니다. 적용 수수료율은 환불 요청 화면에 표시합니다. 다만 잔여 유료 포인트가 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다.","환불(유효기간이 지난 뒤): 충전일로부터 5년까지 잔여 유료 포인트의 90%를 환불합니다.","무료 포인트는 환불 대상이 아니며, 환불을 처리할 때 함께 소멸합니다. 10원 미만은 환불하지 않습니다."],"환불은 「내 지갑 → 환불 요청」 또는 고객센터로 요청할 수 있으며, 회사가 확인한 뒤 결제한 수단으로 환불합니다. 환불 요청 중인 포인트는 처리가 끝날 때까지 사용할 수 없습니다.","구글 플레이·앱스토어 등 앱 마켓에서 구매한 포인트의 환불은 해당 앱 마켓의 환불 규정을 따릅니다. 앱 마켓에서 결제가 취소·환불되면 그 결제로 충전된 포인트(함께 지급된 무료 포인트 포함)를 지갑에서 차감하며, 이미 사용한 경우에는 다른 포인트 또는 이후 충전되는 포인트에서 차감합니다."]},
 {h:"제4조 (외부 링크 면책)", b:[
   "서비스는 이용자의 편의를 위해 외부 사이트·앱으로 연결되는 링크를 제공할 수 있습니다. 회사는 외부 서비스의 내용·거래·정확성에 대해 책임지지 않습니다."]},

    "타인의 권리를 침해하는 행위"]]},
 {h:"제6조 (책임의 한계)", b:[

 {h:"제7조 (준거법 및 관할)", b:[

D.en={title:"Terms of Service", eff:"Effective date: ____-__-__", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"Article 1 (Purpose)", b:["These Terms govern your use of the tourist guide app \"Money Puzzle Tour for Korea\" (https://navi.moneypuzzle.co.kr, \"the Service\") provided by Booman Inc. (\"the Company\")."]},
 {h:"Article 2 (The Service)", b:[
   "The Service provides:",
   ["Travel information such as attractions, restaurants, stays and amenities",
    "Nearby recommendations and directions based on your current location",
    "Sale of travel products such as guided tours, experiences and admission tickets (seller: the Company)",
    "Links out to external travel booking platforms"],
   "Payment for travel products is made to the Company through the payment window of its contracted payment gateway (Toss Payments)."]},
 {h:"Article 3 (Sale of travel products and guides)", b:[
   "The Company is the seller of the tour and experience products sold through the Service. You contract with and pay the Company, and the Company is responsible for delivering, changing, cancelling and refunding the products.",
   "For products with a minimum number of participants, if that number is not reached 24 hours before departure, the Company will cancel the contract and refund the full amount paid.",
   "Guides who accompany tours are engaged by the Company (including freelancers), and the Company pays their fees. You do not pay guides separately.",
   "Booking, payment, cancellation and refunds through external platforms are governed by those providers' terms and responsibility."]},
 {h:"Article 3-2 (Karaoke song pass)", b:[
   "The Company sells a prepaid “song pass” for the karaoke in the Service (₩1,000 per song; bundles include bonus songs). Bundles and prices are as shown on the sales screen.",
   "The song pass is deducted by one song each time you sing a licensed accompaniment song.",
   "Song passes are saved to your signed-in account and kept for 1 year from purchase.",
   "Refunds: within 7 days of purchase, we refund the amount paid minus the songs used at ₩1,000 per song; after 7 days (within the 1-year storage period), that amount minus a 10% refund fee. Bonus songs are not refundable, and if the result is ₩0 or less there is no refund (rounded down to ₩10). Details follow the Refund Policy."]},
 {h:"Article 3-3 (Karaoke points)", b:["The Company sells prepaid “points” used in the karaoke of the Service. 1 point (P) equals ₩1. Top-up amounts and prices are as shown on each purchase screen.","Points are recorded in a single wallet for your signed-in account, and the same points can be topped up and used on the web and in the dedicated app.","Points are recorded separately as paid points (topped up by your payment) and free points (given by the Company at no charge, e.g. as a top-up bonus or in events).","When points are used, paid points are used first (earliest top-up first), then free points. Before any use, the screen shows the points to be used and the balance afterwards, and asks you to confirm.",["Validity: points can be used for 1 year from the date they were topped up (or given). Expired points cannot be used.","Extension: if you request it within the validity period, the validity of your paid points is extended by 3 months at a time (“My wallet > Extend”). The extended validity cannot go beyond 5 years from the top-up date.","Expiry notices: the Company notifies you at least 3 times, including at least 30 days before expiry, by email or on the Service screen, of the expiry date, whether and how it can be extended, and that remaining paid points can still be refunded after expiry."],["Refund (within 7 days of purchase): unused paid points are refunded in full with no fee, even if you used part of them.","Refund (after 7 days, within the validity period): remaining paid points are refunded minus a refund fee of up to 10%. The rate applied is shown on the refund request screen. However, if the remaining paid points are 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund.","Refund (after expiry): 90% of the remaining paid points is refunded until 5 years from the top-up date.","Free points are not refundable and expire when a refund is processed. Amounts under ₩10 are not refunded."],"You can request a refund via “My wallet > Request refund” or Support. After review, the Company refunds to the payment method used. Points under a refund request cannot be used until the request is processed.","Refunds for points bought in an app marketplace such as Google Play or the App Store follow that marketplace's refund policy. If the marketplace cancels or refunds the payment, the points from that payment (including any free points given with it) are deducted from your wallet; if already used, they are deducted from other points or from later top-ups."]},
 {h:"Article 4 (External links)", b:[
   "The Service may provide links to external sites or apps for your convenience. The Company is not responsible for the content, transactions or accuracy of those external services."]},
 {h:"Article 5 (User obligations and prohibited acts)", b:[
   "You must not:",
   ["register false information (especially regarding guide credentials) or misuse another person's information",
    "act in violation of law or public order and morals",
    "interfere with the normal operation of the Service or collect data without authorization",
    "infringe the rights of others"]]},
 {h:"Article 6 (Limitation of liability)", b:[
   "Maps, transit and business information provided by the Service are for travel reference and may differ from reality. Please verify schedules, fares and opening status on site and through official sources.",
   "The Company is not liable for damage arising from causes beyond its reasonable control, such as force majeure or failures of external APIs or communications."]},
 {h:"Article 7 (Governing law and jurisdiction)", b:[
   "These Terms are construed under the laws of the Republic of Korea, and disputes relating to the Service are handled by the court of competent jurisdiction under applicable law."]},
 {h:"Article 8 (Contact)", b:[
   "For questions about the Service, contact Support (+82-10-4221-7066) or email (admin@moneypuzzle.co.kr)."]}
 ]};

D.ja={title:"利用規約", eff:"施行日：    年  月  日", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"第1条（目的）", b:["本規約は、株式会社 부만（Booman Inc.、以下「当社」）が提供する外国人観光案内アプリ「Money Puzzle Tour for Korea」（https://navi.moneypuzzle.co.kr、以下「本サービス」）の利用条件を定めることを目的とします。"]},
 {h:"第2条（サービスの内容）", b:[
   "本サービスは次を提供します。",
   ["観光地・グルメ・宿泊・施設などの旅行情報の提供",
    "現在地に基づく周辺のおすすめおよび道案内",
    "ガイド同行ツアー・体験・入場券などの旅行商品の販売（販売者：当社）",
    "外部の旅行予約プラットフォームへの誘導"],
   "旅行商品の代金は、当社が契約する決済代行会社（トスペイメンツ）の決済画面を通じて当社にお支払いいただきます。"]},
 {h:"第3条（旅行商品の販売とガイド）", b:[
   "本サービスで販売するツアー・体験商品の販売者は当社です。利用者は当社と契約して代金を当社に支払い、商品の履行・変更・キャンセル・返金の責任は当社が負います。",
   "最少催行人員が定められた商品は、出発の24時間前までに人数に達しない場合、当社が契約を取り消し、受け取った代金の全額を返金します。",
   "ツアーに同行するガイドは当社が業務を委託したガイド（フリーランスを含む）であり、ガイドの報酬は当社が支払います。利用者がガイドに別途料金を支払うことはありません。",
   "外部プラットフォームを通じた予約・決済・キャンセル・返金等は、当該事業者の規約と責任に従います。"]},
 {h:"第3条の2（カラオケ曲チケット）", b:[
   "当社は、サービス内カラオケで使う前払いの「曲チケット」を販売します（1曲1,000ウォン、まとめ買いでサービス曲付き）。パック内容と価格は販売画面の表示どおりです。",
   "曲チケットは正式な伴奏曲を歌うたびに、曲チケットが1曲分差し引かれます。",
   "曲チケットはログインしたアカウントに保存され、購入日から1年間保管されます。",
   "返金：購入日から7日以内は支払額から使った曲を1曲1,000ウォンとして差し引いた金額を、7日を過ぎた後（保管期間1年以内）はその金額から返金手数料10%を差し引いた金額を返金します。サービス曲は返金対象外で、計算結果が0ウォン以下の場合は返金額はありません（10ウォン未満切り捨て）。詳細は返金規定に従います。"]},
 {h:"第3条の3（カラオケポイント）", b:["当社は、サービス内カラオケで使う前払いの「ポイント」を販売します。1ポイント（P）は1ウォンに相当し、チャージ単位と価格は各購入画面の表示どおりです。","ポイントはログインしたアカウントのウォレット1つに記録され、ウェブと専用アプリで同じポイントをチャージ・使用します。","ポイントは、有料ポイント（利用者が決済でチャージしたポイント）と無料ポイント（チャージ特典・イベントなどで当社が無償で付与したポイント）に分けて記録します。","ポイントを使うときは、有料ポイントから（先にチャージしたものから）使い、その後に無料ポイントを使います。使用前に、使うポイントと使用後の残りポイントを画面に表示し、利用者の確認を受けます。",["有効期限：ポイントはチャージ（付与）日から1年間使用でき、有効期限を過ぎたポイントは使用できません。","有効期限の延長：有効期限内に利用者が申請すると、有料ポイントの有効期限を3か月ずつ延長します（「マイウォレット → 期間延長」）。ただし、延長後の有効期限はチャージ日から5年を超えることはできません。","期限通知：当社は、有効期限の30日前を含めて3回以上、有効期限・延長の可否と方法・期限後も残りの有料ポイントを返金できることを、メールまたはサービス画面でお知らせします。"],["返金（購入日から7日以内）：未使用の有料ポイントは、一部を使っていても手数料なしで全額返金します。","返金（購入日から7日経過後・有効期限内）：残りの有料ポイントから10%以内の返金手数料を差し引いて返金します。適用する手数料率は返金申請画面に表示します。ただし、残りの有料ポイントが10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。","返金（有効期限経過後）：チャージ日から5年まで、残りの有料ポイントの90%を返金します。","無料ポイントは返金の対象外で、返金処理時にあわせて消滅します。10ウォン未満は返金しません。"],"返金は「マイウォレット → 返金申請」またはカスタマーセンターで申請でき、当社が確認した後、決済した手段で返金します。返金申請中のポイントは処理が終わるまで使用できません。","Google Play・App Storeなどのアプリマーケットで購入したポイントの返金は、そのアプリマーケットの返金規定に従います。アプリマーケットで決済が取消・返金された場合、その決済でチャージされたポイント（一緒に付与された無料ポイントを含む）をウォレットから差し引き、すでに使用している場合はほかのポイントまたは以後チャージされるポイントから差し引きます。"]},
 {h:"第4条（外部リンクの免責）", b:[
   "本サービスは利便のため外部サイト・アプリへのリンクを提供する場合があります。当社は外部サービスの内容・取引・正確性について責任を負いません。"]},
 {h:"第5条（利用者の義務および禁止行為）", b:[
   "利用者は次の行為をしてはなりません。",
   ["虚偽情報の登録（特にガイド資格に関するもの）または他人の情報の盗用",
    "法令または公序良俗に反する行為",
    "本サービスの正常な運営を妨げ、または無断でデータを収集する行為",
    "他人の権利を侵害する行為"]]},
 {h:"第6条（責任の限界）", b:[
   "本サービスが提供する地図・交通・営業情報等は旅行の参考用であり、実際と異なる場合があります。運行時間・料金・営業の有無等は、現場および公式案内でご確認ください。",
   "当社は、天災や外部 API・通信の障害など、当社の合理的な支配を超える事由による損害について責任を負いません。"]},
 {h:"第7条（準拠法および管轄）", b:[
   "本規約は大韓民国の法律に従って解釈され、本サービスの利用に関する紛争は関連法令に基づく管轄裁判所で取り扱われます。"]},
 {h:"第8条（お問い合わせ）", b:[
   "本サービスの利用に関するお問い合わせは、カスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）までご連絡ください。"]}
 ]};

D.zhs={title:"使用条款", eff:"施行日期：    年  月  日", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"第1条（目的）", b:["本条款旨在规定 Booman Inc.（株式会社 부만，以下称\"本公司\"）提供的面向外国游客的旅游向导应用\"Money Puzzle Tour for Korea\"（https://navi.moneypuzzle.co.kr，以下称\"本服务\"）的使用条件。"]},
 {h:"第2条（服务内容）", b:[
   "本服务提供以下内容：",
   ["景点·美食·住宿·便利设施等旅行信息",
    "基于当前位置的周边推荐及路线指引",
    "销售向导陪同游览·体验·门票等旅游商品（销售方：本公司）",
    "引导至外部旅行预订平台"],
   "旅游商品的费用通过本公司签约的支付代理机构（Toss Payments）的支付窗口支付给本公司。"]},
 {h:"第3条（旅游商品的销售与向导）", b:[
   "通过本服务销售的游览·体验商品的销售方为本公司。用户与本公司签约并向本公司付款，商品的履行·变更·取消·退款由本公司负责。",
   "设有最少成团人数的商品，如在出发前24小时仍未达到该人数，本公司将取消合同并全额退还已收款项。",
   "陪同游览的向导由本公司委托（包括自由职业者），向导报酬由本公司支付。用户无需另向向导付费。",
   "通过外部平台进行的预订·支付·取消·退款等，依照该经营者的条款及责任办理。"]},
 {h:"第3条之二（卡拉OK点歌券）", b:[
   "本公司销售在服务内卡拉OK使用的预付“点歌券”（每首₩1,000，购买套餐赠送歌曲）。套餐内容和价格以销售页面显示为准。",
   "点歌券在演唱正式伴奏歌曲时，每唱一首扣除一首点歌券。",
   "点歌券保存在已登录的账户中，自购买日起保留1年。",
   "退款：购买后7天内退还支付金额减去已用歌曲（每首₩1,000）后的金额；超过7天后（1年保存期内）再扣除10%退款手续费后退还。赠送歌曲不在退款范围内，计算结果为₩0或以下时不予退款（不足₩10舍去）。详情依退款规定。"]},
 {h:"第3条之三（卡拉OK积分）", b:["本公司销售在服务内卡拉OK使用的预付“积分”。1积分（P）相当于1韩元，充值单位和价格以各购买页面显示为准。","积分记录在已登录账户的一个钱包中，网页和专用应用使用同一积分进行充值和使用。","积分分为付费积分（用户通过付款充值的积分）和免费积分（本公司通过充值优惠、活动等无偿赠送的积分）分别记录。","使用积分时，先使用付费积分（按充值先后），再使用免费积分。使用前，页面会显示将使用的积分和使用后的剩余积分，并经用户确认。",["有效期：积分自充值（赠送）之日起1年内可用，过期积分不能使用。","延长有效期：在有效期内用户提出申请的，付费积分的有效期每次延长3个月（“我的钱包 → 延长有效期”）。但延长后的有效期不得超过自充值之日起5年。","到期通知：本公司在有效期届满前30日（含）起至少通知3次，通过电子邮件或服务页面告知到期日、可否延长及方法，以及到期后仍可申请退还剩余付费积分。"],["退款（购买之日起7日内）：未使用的付费积分，即使已使用部分，也免手续费全额退还。","退款（购买满7日后、有效期内）：从剩余付费积分中扣除不超过10%的退款手续费后退还。适用的费率显示在退款申请页面。但剩余付费积分在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。","退款（有效期届满后）：自充值之日起5年内，退还剩余付费积分的90%。","免费积分不予退款，并在退款处理时一并失效。不足10韩元的部分不予退还。"],"可通过“我的钱包 → 申请退款”或客服申请退款，经本公司确认后退回原支付方式。申请退款中的积分在处理完成前不能使用。","在 Google Play、App Store 等应用市场购买的积分，退款按该应用市场的退款规定办理。应用市场取消或退还付款时，将从钱包中扣除该笔付款充值的积分（含同时赠送的免费积分）；如已使用，则从其他积分或之后充值的积分中扣除。"]},
 {h:"第4条（外部链接免责）", b:[
   "为方便用户，本服务可能提供指向外部网站·应用的链接。本公司对外部服务的内容·交易·准确性不承担责任。"]},
 {h:"第5条（用户义务及禁止行为）", b:[
   "用户不得有下列行为：",
   ["登记虚假信息（尤其是涉及向导资格的信息）或盗用他人信息",
    "违反法律或公序良俗的行为",
    "妨碍本服务正常运营或擅自收集数据的行为",
    "侵害他人权利的行为"]]},
 {h:"第6条（责任限制）", b:[
   "本服务提供的地图·交通·营业信息等仅供旅行参考，可能与实际不符。运行时间·费用·是否营业等请在现场及官方指南确认。",
   "对于天灾、外部 API·通信故障等超出本公司合理控制范围的事由所致损害，本公司不承担责任。"]},
 {h:"第7条（准据法及管辖）", b:[
   "本条款依大韩民国法律解释，与本服务使用相关的纠纷由依相关法律确定的管辖法院处理。"]},
 {h:"第8条（咨询）", b:[
   "有关本服务使用的咨询，请联系客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）。"]}
 ]};

D.zht={title:"使用條款", eff:"施行日期：    年  月  日", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"第1條（目的）", b:["本條款旨在規定 Booman Inc.（株式會社 부만，以下稱「本公司」）提供的面向外國旅客的旅遊嚮導應用程式「Money Puzzle Tour for Korea」（https://navi.moneypuzzle.co.kr，以下稱「本服務」）的使用條件。"]},
 {h:"第2條（服務內容）", b:[
   "本服務提供以下內容：",
   ["景點·美食·住宿·便利設施等旅遊資訊",
    "基於目前位置的周邊推薦及路線指引",
    "銷售嚮導陪同遊覽·體驗·門票等旅遊商品（銷售方：本公司）",
    "引導至外部旅遊預訂平台"],
   "旅遊商品的費用透過本公司簽約的支付代理機構（Toss Payments）的付款視窗支付給本公司。"]},
 {h:"第3條（旅遊商品的銷售與嚮導）", b:[
   "透過本服務銷售的遊覽·體驗商品的銷售方為本公司。使用者與本公司簽約並向本公司付款，商品的履行·變更·取消·退款由本公司負責。",
   "設有最少成團人數的商品，如在出發前24小時仍未達到該人數，本公司將取消合約並全額退還已收款項。",
   "陪同遊覽的嚮導由本公司委託（包括自由工作者），嚮導報酬由本公司支付。使用者無需另向嚮導付費。",
   "透過外部平台進行的預訂·付款·取消·退款等，依照該經營者的條款及責任辦理。"]},
 {h:"第3條之二（卡拉OK點歌券）", b:[
   "本公司銷售在服務內卡拉OK使用的預付「點歌券」（每首₩1,000，購買套餐贈送歌曲）。套餐內容和價格以銷售頁面顯示為準。",
   "點歌券在演唱正式伴奏歌曲時，每唱一首扣除一首點歌券。",
   "點歌券保存在已登入的帳戶中，自購買日起保留1年。",
   "退款：購買後7天內退還付款金額減去已用歌曲（每首₩1,000）後的金額；超過7天後（1年保存期內）再扣除10%退款手續費後退還。贈送歌曲不在退款範圍內，計算結果為₩0或以下時不予退款（不足₩10捨去）。詳情依退款規定。"]},
 {h:"第3條之三（卡拉OK點數）", b:["本公司銷售在服務內卡拉OK使用的預付「點數」。1點（P）相當於1韓元，儲值單位與價格以各購買頁面顯示為準。","點數記錄在已登入帳戶的一個錢包中，網頁與專用應用程式使用同一點數儲值與使用。","點數分為付費點數（使用者付款儲值的點數）與免費點數（本公司透過儲值優惠、活動等無償贈送的點數）分別記錄。","使用點數時，先使用付費點數（依儲值先後），再使用免費點數。使用前，頁面會顯示將使用的點數與使用後的剩餘點數，並經使用者確認。",["有效期：點數自儲值（贈送）之日起1年內可用，過期點數不能使用。","延長有效期：在有效期內使用者提出申請者，付費點數的有效期每次延長3個月（「我的錢包 → 延長有效期」）。但延長後的有效期不得超過自儲值之日起5年。","到期通知：本公司於有效期屆滿前30日（含）起至少通知3次，透過電子郵件或服務頁面告知到期日、可否延長及方法，以及到期後仍可申請退還剩餘付費點數。"],["退款（購買之日起7日內）：未使用的付費點數，即使已使用部分，也免手續費全額退還。","退款（購買滿7日後、有效期內）：從剩餘付費點數中扣除不超過10%的退款手續費後退還。適用的費率顯示在退款申請頁面。但剩餘付費點數在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。","退款（有效期屆滿後）：自儲值之日起5年內，退還剩餘付費點數的90%。","免費點數不予退款，並於退款處理時一併失效。未滿10韓元的部分不予退還。"],"可透過「我的錢包 → 申請退款」或客服申請退款，經本公司確認後退回原付款方式。申請退款中的點數在處理完成前不能使用。","在 Google Play、App Store 等應用程式市集購買的點數，退款依該市集的退款規定辦理。市集取消或退還付款時，將從錢包中扣除該筆付款儲值的點數（含同時贈送的免費點數）；如已使用，則從其他點數或之後儲值的點數中扣除。"]},
 {h:"第4條（外部連結免責）", b:[
   "為方便使用者，本服務可能提供指向外部網站·應用程式的連結。本公司對外部服務的內容·交易·準確性不承擔責任。"]},
 {h:"第5條（使用者義務及禁止行為）", b:[
   "使用者不得有下列行為：",

D.es={title:"Términos de Servicio", eff:"Fecha de entrada en vigor: ____-__-__", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"Artículo 1 (Objeto)", b:["Estos Términos regulan el uso de la app de guía turística \"Money Puzzle Tour for Korea\" (https://navi.moneypuzzle.co.kr, \"el Servicio\"), prestada por Booman Inc. (\"la Empresa\")."]},
 {h:"Artículo 2 (El Servicio)", b:[
   "El Servicio ofrece:",
   ["información de viaje como atracciones, restaurantes, alojamientos y servicios",
    "recomendaciones cercanas e indicaciones según su ubicación actual",
    "venta de productos de viaje como tours guiados, experiencias y entradas (vendedor: la Empresa)",
    "enlaces a plataformas externas de reservas de viaje"],
   "El pago de los productos de viaje se realiza a la Empresa a través de la ventana de pago de su pasarela contratada (Toss Payments)."]},
 {h:"Artículo 3 (Venta de productos de viaje y guías)", b:[
   "La Empresa es la vendedora de los tours y experiencias que se venden a través del Servicio. Usted contrata con la Empresa y le paga a ella, y la Empresa es responsable de la prestación, los cambios, las cancelaciones y los reembolsos.",
   "En los productos con un número mínimo de participantes, si no se alcanza 24 horas antes de la salida, la Empresa cancelará el contrato y reembolsará el importe íntegro pagado.",
   "Los guías que acompañan los tours son contratados por la Empresa (incluidos autónomos), y la Empresa les paga sus honorarios. Usted no paga a los guías por separado.",
   "Las reservas, pagos, cancelaciones y reembolsos a través de plataformas externas se rigen por los términos y la responsabilidad de esos proveedores."]},
 {h:"Artículo 3-2 (Bono de canciones de karaoke)", b:[
   "La Empresa vende un «bono de canciones» prepago para el karaoke del Servicio (₩1,000 por canción; los packs incluyen canciones de regalo). Los packs y precios son los que se muestran en la pantalla de venta.",
   "Se descuenta una canción del bono por cada canción con acompañamiento con licencia que se cante.",
   "Los bonos se guardan en tu cuenta y se conservan 1 año desde la compra.",
   "Reembolsos: en los 7 días siguientes a la compra, el importe pagado menos las canciones usadas a ₩1,000 cada una; pasados 7 días (dentro del año de conservación), ese importe menos una comisión de reembolso del 10%. Las canciones de regalo no son reembolsables y, si el resultado es ₩0 o menos, no hay reembolso (redondeo a la baja a ₩10). Los detalles siguen la Política de reembolso."]},
 {h:"Artículo 3-3 (Puntos de karaoke)", b:["La Empresa vende «puntos» prepagados para el karaoke del Servicio. 1 punto (P) equivale a ₩1. Los importes de recarga y precios son los que se muestran en cada pantalla de compra.","Los puntos se registran en un único monedero de tu cuenta con sesión iniciada, y los mismos puntos se recargan y usan en la web y en la app propia.","Los puntos se registran por separado como puntos de pago (recargados con tu pago) y puntos gratis (que la Empresa da sin coste, por ejemplo como bonificación de recarga o en eventos).","Al usar puntos, primero se usan los de pago (los recargados antes primero) y después los gratis. Antes de cualquier uso, la pantalla muestra los puntos que se usarán y el saldo restante, y pide tu confirmación.",["Validez: los puntos pueden usarse durante 1 año desde la fecha de recarga (o entrega). Los puntos caducados no pueden usarse.","Ampliación: si lo solicitas dentro del período de validez, la validez de tus puntos de pago se amplía de 3 en 3 meses («Mi monedero > Ampliar»). La validez ampliada no puede superar 5 años desde la fecha de recarga.","Avisos de caducidad: la Empresa te avisa al menos 3 veces, una de ellas con al menos 30 días de antelación, por correo electrónico o en la pantalla del Servicio, de la fecha de caducidad, si se puede ampliar y cómo, y de que los puntos de pago restantes pueden reembolsarse incluso después de caducar."],["Reembolso (en los 7 días siguientes a la compra): los puntos de pago no usados se reembolsan íntegros sin comisión, aunque hayas usado una parte.","Reembolso (pasados 7 días, dentro del período de validez): se reembolsan los puntos de pago restantes menos una comisión de hasta el 10%. La tasa aplicada se muestra en la pantalla de solicitud de reembolso. No obstante, si los puntos de pago restantes son 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso.","Reembolso (después de caducar): se reembolsa el 90% de los puntos de pago restantes hasta 5 años desde la fecha de recarga.","Los puntos gratis no son reembolsables y caducan al procesar un reembolso. No se reembolsan importes inferiores a ₩10."],"Puedes solicitar el reembolso en «Mi monedero > Solicitar reembolso» o a través de Atención al cliente. Tras revisarlo, la Empresa reembolsa al medio de pago utilizado. Los puntos con una solicitud de reembolso en curso no pueden usarse hasta que se procese.","Los reembolsos de puntos comprados en una tienda de apps como Google Play o App Store siguen la política de reembolso de esa tienda. Si la tienda cancela o reembolsa el pago, los puntos de ese pago (incluidos los puntos gratis entregados con él) se descuentan de tu monedero; si ya se usaron, se descuentan de otros puntos o de recargas posteriores."]},
 {h:"Artículo 4 (Enlaces externos)", b:[
   "El Servicio puede ofrecer enlaces a sitios o apps externos para su comodidad. La Empresa no se responsabiliza del contenido, las transacciones ni la exactitud de esos servicios externos."]},
 {h:"Artículo 5 (Obligaciones del usuario y actos prohibidos)", b:[
   "El usuario no debe:",
   ["registrar información falsa (en especial sobre credenciales de guía) ni usar indebidamente la información de otra persona",
    "actuar en contra de la ley o del orden público y las buenas costumbres",
    "interferir en el funcionamiento normal del Servicio o recopilar datos sin autorización",
    "vulnerar los derechos de terceros"]]},
 {h:"Artículo 6 (Limitación de responsabilidad)", b:[
   "Los mapas y la información de transporte y de negocios del Servicio son de referencia para el viaje y pueden diferir de la realidad. Verifique horarios, tarifas y apertura en el lugar y en fuentes oficiales.",
   "La Empresa no responde por daños derivados de causas ajenas a su control razonable, como fuerza mayor o fallos de API externas o de las comunicaciones."]},
 {h:"Artículo 7 (Ley aplicable y jurisdicción)", b:[
   "Estos Términos se interpretan conforme a las leyes de la República de Corea, y los conflictos relativos al Servicio se resuelven ante el tribunal competente según la ley aplicable."]},
 {h:"Artículo 8 (Contacto)", b:[
   "Para consultas sobre el Servicio, contacte con Atención (+82-10-4221-7066) o por correo (admin@moneypuzzle.co.kr)."]}
 ]};

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://navi.moneypuzzle.co.kr/?lang="+lang;
  document.title=d.title+" · Money Puzzle Tour for Korea";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
</body>
</html>
