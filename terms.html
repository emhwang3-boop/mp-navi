D.ko={title:"이용약관", eff:"시행일: 2027년 1월 1일", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"제1조 (목적)", b:["본 약관은 주식회사 부만(이하 '회사')이 제공하는 외국인 관광 안내 앱 'Money Puzzle Tour for Korea'(https://navi.moneypuzzle.co.kr, 이하 '서비스')의 이용 조건을 정하는 것을 목적으로 합니다."]},
 {h:"제2조 (서비스의 내용)", b:[
   "서비스는 다음을 제공합니다.",
   ["관광지·맛집·숙소·편의시설 등 여행 정보 제공",
    "현재 위치 기반의 주변 추천 및 길 안내",
    "가이드 동행 투어·체험·입장권 등 여행상품의 판매 (판매 당사자: 회사)",
    "외부 여행 예약 플랫폼으로의 연결"],
   "여행상품 대금은 회사가 계약한 전자지급결제대행사(토스페이먼츠)의 결제창을 통해 회사에 지급됩니다."]},
 {h:"제3조 (여행상품의 판매와 가이드)", b:[
   "서비스에서 판매하는 투어·체험 상품의 판매 당사자는 회사입니다. 이용자는 회사와 계약하고 대금을 회사에 지급하며, 상품의 이행·변경·취소·환불에 대한 책임은 회사가 집니다.",
   "최소 출발 인원이 있는 상품은 출발 24시간 전까지 인원이 차지 않으면 회사가 계약을 취소하고 받은 금액 전액을 환불합니다.",
   "투어에 동행하는 가이드는 회사가 업무를 맡긴 가이드(프리랜서 포함)이며, 가이드의 수당은 회사가 지급합니다. 이용자는 가이드에게 요금을 따로 지급하지 않습니다.",
   "외부 플랫폼을 통한 예약·결제·취소·환불 등은 해당 업체의 약관과 책임에 따릅니다."]},
 {h:"제3조의2 (노래방 이용권)", b:["회사는 서비스 안 노래방에서 쓰는 기간제 「이용권」을 판매합니다. 이용권은 포인트로 구매하며, 기간과 가격은 구매 화면에 표시된 대로입니다(예: 1개월 10,000P).","이용권 기간에는 노래를 무제한으로 부를 수 있습니다. 이용권은 자동으로 연장(갱신)되지 않으며, 기간이 끝나도 따로 결제되지 않습니다.","이용권은 로그인한 계정에 적용됩니다. 이용 중에 다시 구매하면 지금 이용 중인 이용권이 끝나는 날부터 새 기간이 이어집니다.",["환불(구매일로부터 7일 이내이고 노래를 부르지 않은 경우): 전액을 환불합니다.","환불(그 밖의 경우): 남은 일수에 해당하는 금액에서 그 금액의 10%를 공제하고 환불합니다(콘텐츠이용자보호지침, 소비자분쟁해결기준의 계속거래 기준). 10P 미만은 환불하지 않습니다.","이용권 환불은 이용권 구매에 사용한 유료 포인트 몫만 결제한 수단으로 환불하며(1P = 1원), 무료 포인트로 산 몫은 환불하지 않습니다. 이 금액에서 포인트 환불 수수료를 다시 공제하지 않습니다. 앱 마켓에서 충전한 포인트로 산 몫은 해당 앱 마켓의 환불 규정을 따릅니다. 환불을 요청하면 이용권은 바로 끝납니다."],"자세한 내용은 환불 규정을 따릅니다."]},
 {h:"제3조의3 (노래방 포인트)", b:["회사는 서비스 안 노래방에서 사용하는 선불 「포인트」를 판매합니다. 포인트 사용과 환불에서는 1P를 1원으로 계산합니다. 충전 가격은 결제 수단별 구매 화면에 표시된 대로입니다.","포인트는 로그인한 계정의 지갑 하나에 기록되며, 웹과 전용 앱에서 같은 포인트를 충전하고 사용합니다.","포인트는 유료 포인트(이용자가 결제로 충전한 포인트)와 무료 포인트(충전 혜택·이벤트·순위 상금·LIVE 선물 적립·보상 등 결제 없이 받은 포인트)로 나누어 기록합니다.","포인트를 사용할 때는 유료 포인트를 먼저(먼저 충전한 것부터) 사용하고, 그다음 무료 포인트를 사용합니다. 포인트를 사용하기 전에는 사용할 포인트와 사용 후 잔여 포인트를 화면에 표시하고 이용자의 확인을 받습니다.",["유료 포인트: 유효기간이 없습니다.","무료 포인트: 지급일로부터 1년간 사용할 수 있으며, 유효기간이 지난 무료 포인트는 사용할 수 없습니다."],["환불(구매일로부터 7일 이내): 사용하지 않은 유료 포인트는 일부를 사용했더라도 수수료 없이 전부 환불합니다.","환불(구매일로부터 7일이 지난 뒤): 잔여 유료 포인트에서 10% 이내의 환불 수수료를 공제하고 환불합니다. 적용 수수료율은 환불 요청 화면에 표시합니다. 다만 잔여 유료 포인트가 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다.","무료 포인트는 환불 대상이 아니며, 환불을 처리할 때 함께 소멸합니다. 10원 미만은 환불하지 않습니다."],"환불은 「내 지갑 → 환불 요청」 또는 고객센터로 요청할 수 있으며, 회사가 확인한 뒤 결제한 수단으로 환불합니다. 환불 요청 중인 포인트는 처리가 끝날 때까지 사용할 수 없습니다.","유료 포인트 환불은 탈퇴(계정 삭제) 전에 요청해야 하며, 탈퇴하면 남은 포인트는 소멸합니다.","구글 플레이·앱스토어 등 앱 마켓에서 구매한 포인트의 환불은 해당 앱 마켓의 환불 규정을 따릅니다. 앱 마켓에서 결제가 취소·환불되면 그 결제로 충전된 포인트(함께 지급된 무료 포인트 포함)를 지갑에서 차감하며, 이미 사용한 경우에는 다른 포인트 또는 이후 충전되는 포인트에서 차감합니다."]},
 {h:"제3조의4 (노래방 LIVE 방송)", b:["이 조항은 노래방 「LIVE」 기능에 적용됩니다.",["LIVE 방송은 본인인증한 성인만 시작할 수 있습니다. 관람·댓글·반응은 서비스를 이용할 수 있는 이용자가 할 수 있으며, 관람에는 포인트가 사용되지 않습니다.","방송인은 방송 중 관람객 1명이 1시간 시청할 때 100P를 1분 단위로 부담합니다. 회사는 방송을 시작할 때 이를 화면에 알리고, 잔여 포인트가 0P가 되면 방송을 자동으로 종료합니다.","곡이 끝나도 방송은 이어집니다. 방송인은 3분 안에 다음 곡을 골라 이어 부를 수 있으며, 고르지 않으면 안내 후 30초 뒤 방송이 종료됩니다.","방송인은 「관객」 판에서 관람객의 별명과 공개 프로필 사진을 볼 수 있습니다.","관람객은 방송인에게 포인트로 선물을 보낼 수 있습니다. 선물의 종류·가격과 한도(1인 하루 500,000P)는 화면에 표시된 대로이며, 청소년(만 15세 이상 만 19세 미만)은 선물을 보낼 수 없습니다. 보낸 선물은 취소·환불되지 않습니다. 다만 관련 법령에 따라 취소할 수 있는 경우는 예외로 합니다.","방송인은 받은 선물 금액의 60%를 무료 포인트로 적립받습니다. 적립된 포인트의 유효기간은 적립일로부터 1년이며, 서비스 안에서만 사용할 수 있고 현금으로 바꾸거나 환불할 수 없습니다.","선물에 사용한 결제가 취소·환불되거나 부정 결제로 확인되면, 회사는 그 선물로 방송인에게 적립한 포인트를 회수할 수 있습니다. 이미 사용한 경우에는 이후 적립분에서 공제하거나 반환을 청구할 수 있습니다.","방송에도 음란·폭력·혐오 표현, 욕설, 다른 사람의 권리 침해, 광고는 금지됩니다. 회사는 신고가 들어오거나 이를 위반한 방송을 예고 없이 종료할 수 있고, 되풀이하면 방송을 제한할 수 있습니다. 방송인은 관람객을 내보낼 수 있습니다.","회사는 신고 처리와 분쟁 대응을 위해 방송 영상을 비공개로 30일간 보관한 뒤 삭제하며, 보관 영상은 관리자만 열람합니다."]]},
 {h:"제3조의5 (노래방 순위 시상)", b:[["회사는 전체 공개 노래 영상을 대상으로 주간·월간·연말(왕중왕) 순위를 발표하고 1위에게 상금을 포인트로 지급합니다. 기준과 상금은 서비스 화면에 표시된 대로입니다.", "매월 마지막 일요일의 주간 상금은 그달 월간 상금으로 대체하고, 12월 월간 상금은 연말 왕중왕 상금으로 대체합니다.","상금은 무료 포인트로 자동 지급되며, 유효기간은 지급일로부터 1년입니다. 환불하거나 현금으로 바꿀 수 없습니다.","수상자에게는 프로필 별이 표시됩니다. 주간·월간 별은 해가 바뀌면 사라지고 왕중왕 별은 유지됩니다.","부정한 방법으로 순위에 영향을 준 영상은 순위에서 제외할 수 있습니다."]]},
 {h:"제3조의6 (자동 감시)", b:["StageSong에는 음성과 화면을 살피는 자동 감시 시스템이 설치되어 있습니다.","LIVE 방송: 폰 안 판별과 함께 저해상도 화면과 음성 조각을 서버에서 판별합니다. 판별에 쓴 화면과 음성은 저장하지 않으며, 댓글의 욕설은 가려서 표시합니다.","도란도란: 화면만 내 폰 안에서 5초마다 판별하고, 영상과 소리는 서버로 보내지 않습니다. 소리는 판별하지 않으며 욕설은 방 사람의 신고로 처리합니다. 우리끼리 노래: 방에 올리는 영상은 게시 영상과 같이 판별합니다. 앱에 처음 들어올 때 이용약관과 함께 동의합니다.","게시 영상: 올릴 때 화면 표본을 판별하고 제목·설명·댓글의 욕설을 확인합니다. 문제가 있으면 「나만 보기」로 올라갑니다.","처음에는 화면을 몇 초 가리고 안내합니다. 높은 확신의 감지가 연속되고 반복될 때만 강퇴와 24시간 이용 제한이 적용되며, 음성·욕설 자동 판정은 안내까지만 합니다. 다만 청소년 계정은 첫 회부터, 미성년자가 관련될 수 있는 장면은 즉시 방송 종료와 이용 제한을 적용합니다. 위반이 되풀이되면 이용을 영구히 제한할 수 있습니다.","제한 안내의 「이의 신청」을 누르면 회사가 확인하며, 오판이면 제한을 해제하고 이용권 기간과 사용한 포인트를 복구합니다. 이용권은 제한된 기간만큼 늘려 드리고, 끊긴 LIVE 방송에서 사용한 포인트는 무료 포인트(유효기간 1년)로 돌려 드립니다.","자동 판정에는 오판이 있을 수 있어 회사는 임계값을 보수적으로 운영합니다. 판별용 사본은 저장하지 않습니다. 방송 영상은 제3조의4에 따라 따로 보관합니다. 미성년자가 관련될 수 있는 장면이 감지되면 방송을 즉시 끝내고 해당 녹화를 삭제합니다."]},
 {h:"제3조의7 (노래방 꾸미기 아이템)", b:["꾸미기 상점의 아이템은 구매 시각부터 1일(24시간), 7일 또는 30일 동안 보유하고 이용할 수 있습니다.","기간이 끝나면 보관함에서 사라지며 계속 쓰려면 다시 구매해야 합니다.","사용 중인 얼굴 마스크는 앱을 끄고 나갈 때까지, 도란도란 방에 놓은 아이템은 그 방이 끝날 때까지 이용할 수 있습니다.","소모품은 구매 시각부터 24시간 안에 사용하지 않으면 사라집니다.","얼굴 마스크는 꾸미기 아이템에 포함됩니다. 전면 카메라에서 얼굴을 찾지 못하면 화면이 흐려지며, 마스크와 흐림은 녹화와 방송에 그대로 담깁니다."]},
 {h:"제3조의8 (노래방 약관의 적용)", b:["노래방 이용에는 노래방 이용약관을 함께 적용합니다."]},
 {h:"제4조 (외부 링크 면책)", b:[
   "서비스는 이용자의 편의를 위해 외부 사이트·앱으로 연결되는 링크를 제공할 수 있습니다. 회사는 외부 서비스의 내용·거래·정확성에 대해 책임지지 않습니다."]},
 {h:"제5조 (이용자의 의무 및 금지 행위)", b:[
   "이용자는 다음 행위를 하여서는 안 됩니다.",
   ["허위 정보 등록(특히 가이드 자격 관련) 또는 타인의 정보 도용",
    "법령 또는 공서양속에 반하는 행위",
    "서비스의 정상적인 운영을 방해하거나 무단으로 데이터를 수집하는 행위",
    "타인의 권리를 침해하는 행위"]]},
 {h:"제6조 (책임의 한계)", b:[
   "서비스가 제공하는 지도·교통·영업 정보 등은 여행 참고용이며, 실제와 다를 수 있습니다. 운행 시간·요금·영업 여부 등은 현장과 공식 안내로 확인하시기 바랍니다.",
   "회사는 천재지변, 외부 API·통신의 장애 등 회사의 합리적 통제를 벗어난 사유로 인한 손해에 대해 책임을 지지 않습니다."]},
 {h:"제7조 (준거법 및 관할)", b:[
   "회사와 이용자 간에 제기된 소송은 대한민국 법을 준거법으로 합니다.","회사와 이용자 간 발생한 분쟁에 관한 소송은 민사소송법상의 관할법원에 제기합니다.","이용자가 외국 거주자인 경우, 회사와 이용자 간에 발생한 분쟁에 관한 소송은 전항에도 불구하고 대한민국 서울중앙지방법원을 전속 관할 법원으로 합니다."]},
 {h:"제8조 (문의)", b:[
   "서비스 이용에 관한 문의는 고객센터(010-4221-7066) 또는 이메일(admin@moneypuzzle.co.kr)로 연락하실 수 있습니다."]}
 ]};

D.en={title:"Terms of Service", eff:"Effective date: January 1, 2027", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"Article 1 (Purpose)", b:["These Terms govern your use of the tourist guide app \"Money Puzzle Tour for Korea\" (https://navi.moneypuzzle.co.kr, \"the Service\") provided by Booman Inc. (\"the Company\")."]},
 {h:"Article 2 (The Service)", b:[
   "The Service provides:",
   ["Travel information such as attractions, restaurants, stays and amenities",
    "Nearby recommendations and directions based on your current location",
    "Sale of travel products such as guided tours, experiences and admission tickets (seller: the Company)",
    "Links out to external travel booking platforms"],
   "Payment for travel products is made to the Company through the payment window of its contracted payment gateway (Toss Payments)."]},
 {h:"Article 3 (Sale of travel products and guides)", b:[
   "The Company is the seller of the tour and experience products sold through the Service. You contract with and pay the Company, and the Company is responsible for delivering, changing, cancelling and refunding the products.",
   "For products with a minimum number of participants, if that number is not reached 24 hours before departure, the Company will cancel the contract and refund the full amount paid.",
   "Guides who accompany tours are engaged by the Company (including freelancers), and the Company pays their fees. You do not pay guides separately.",
   "Booking, payment, cancellation and refunds through external platforms are governed by those providers' terms and responsibility."]},
 {h:"Article 3-2 (Karaoke pass)", b:["The Company sells a time-based “pass” for the karaoke in the Service. Passes are bought with points, and periods and prices are as shown on the purchase screen (e.g. 1 month 10,000P).","During the pass you can sing without limit. A pass does not renew automatically, and nothing is charged when it ends.","The pass applies to the account you are signed in with. If you buy again while a pass is active, the new period starts from the end date of the current pass.",["Refund (within 7 days of purchase and you have not sung): the full amount is refunded.","Refund (all other cases): the amount for the remaining days, minus 10% of that amount, is refunded (Content User Protection Guidelines; Consumer Dispute Resolution Standards for continuous transactions). Amounts under 10P are not refunded.","Pass refunds are paid to your original payment method for the paid-point share only (1P = ₩1); the share bought with free points is not refunded. No points refund fee is deducted again. The share bought with points topped up in an app market follows that market's refund policy. The pass ends as soon as you request the refund."],"Details follow the Refund Policy."]},
 {h:"Article 3-3 (Karaoke points)", b:["The Company sells prepaid “points” used in the karaoke of the Service. For using and refunding points, 1P counts as ₩1. Top-up prices are as shown on the purchase screen for each payment method.","Points are recorded in a single wallet for your signed-in account, and the same points can be topped up and used on the web and in the dedicated app.","Points are recorded separately as paid points (topped up by your payment) and free points (received without payment, such as top-up bonuses, events, ranking prizes, LIVE gift credits and compensation).","When points are used, paid points are used first (earliest top-up first), then free points. Before any use, the screen shows the points to be used and the balance afterwards, and asks you to confirm.",["Paid points: no expiry date.","Free points: can be used for 1 year from the date given. Expired free points cannot be used."],["Refund (within 7 days of purchase): unused paid points are refunded in full with no fee, even if you used part of them.","Refund (after 7 days): remaining paid points are refunded minus a refund fee of up to 10%. The rate applied is shown on the refund request screen. However, if the remaining paid points are 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund.","Free points are not refundable and expire when a refund is processed. Amounts under ₩10 are not refunded."],"You can request a refund via “My wallet > Request refund” or Support. After review, the Company refunds to the payment method used. Points under a refund request cannot be used until the request is processed.","Refunds of paid points must be requested before you leave (delete your account). When you leave, any remaining points expire.","Refunds for points bought in an app marketplace such as Google Play or the App Store follow that marketplace's refund policy. If the marketplace cancels or refunds the payment, the points from that payment (including any free points given with it) are deducted from your wallet; if already used, they are deducted from other points or from later top-ups."]},
 {h:"Article 3-4 (Karaoke LIVE broadcasts)", b:["This article applies to the karaoke LIVE feature.",["Only verified adults can start a LIVE broadcast. Anyone able to use the Service can watch, comment and react, and watching uses no points.","The broadcaster pays 100P per viewer per hour, calculated every minute. The Company shows this before the broadcast starts and ends the broadcast automatically when remaining points reach 0P.","The broadcast continues when a song ends. The broadcaster can pick the next song within 3 minutes and keep singing; otherwise a notice appears and the broadcast ends 30 seconds later.","The broadcaster can see viewers' nicknames and public profile photos in the “Audience” panel.","Viewers can send gifts to the broadcaster with points. Gift types, prices and the limit (500,000P per person per day) are as shown on screen. Minors aged 15 to under 19 can't send gifts. Sent gifts can't be cancelled or refunded, except where the law allows cancellation.","The broadcaster receives 60% of the gift amount as free points. These points are valid for 1 year from the date credited, can only be used within the Service, and can't be exchanged for cash or refunded.","If a payment used for a gift is cancelled or refunded, or is found to be fraudulent, the Company may reclaim the points credited to the broadcaster for that gift. If they have already been used, the Company may deduct the amount from later credits or demand its return.","Obscene, violent or hateful content, abuse, infringement of others' rights and advertising are prohibited in broadcasts. The Company may end a reported or violating broadcast without notice and may restrict repeat offenders. Broadcasters can remove viewers.","The Company keeps broadcast videos privately for 30 days to handle reports and disputes, then deletes them. Only administrators can view them."]]},
 {h:"Article 3-5 (Karaoke rankings and awards)", b:[["The Company announces weekly, monthly and year-end (Champion) rankings of public song videos and pays first place a prize in points. Criteria and prizes are as shown on screen.", "The weekly prize for the last Sunday of each month is replaced by that month's monthly prize, and December's monthly prize is replaced by the year-end Champion prize.","Prizes are paid automatically as free points, valid for 1 year from payment. They can't be refunded or exchanged for cash.","Winners get a profile star. Weekly and monthly stars disappear when the year changes; Champion stars stay.","Videos that affect rankings by improper means may be excluded."]]},
 {h:"Article 3-6 (Automatic monitoring)", b:["StageSong has an automatic monitoring system for sound and picture.","LIVE: along with checks on your phone, low-resolution frames and audio clips are checked on the server. They are not stored afterwards, and abusive words in comments are hidden.","Doran-doran: only the picture is checked, on your phone every 5 seconds, and no video or sound goes to the server. Sound is not checked; abusive language is handled through reports from people in the room. Just Us Karaoke: videos posted to a room are checked the same way as posted videos. You agree together with the Terms the first time you enter the app.","Posted videos: sample frames are checked when you post, along with title, description and comments. If there's a problem, the video is saved as “Only me”.","At first your picture is covered for a few seconds with a notice. Removal and a 24-hour limit apply only when high-confidence detections continue and repeat. Automatic checks of sound and language only give a notice. However, for minor accounts these apply from the first time, and scenes that may involve a minor mean the broadcast ends immediately and use is limited. Repeated violations can lead to a permanent limit.","Tap “Appeal” in the notice and the Company will review it. If it was a mistake, the limit is lifted and your pass period and the points you used are restored. Your pass is extended by the time you were limited, and points used in the interrupted LIVE broadcast come back as free points (valid for 1 year).","Automatic checks can make mistakes, so the Company sets thresholds conservatively. Copies used for checking are not stored. Broadcast videos are kept separately under Article 3-4. If a scene that may involve a minor is detected, the broadcast ends immediately and that recording is deleted."]},
 {h:"Article 3-7 (Karaoke decoration items)", b:["Items in the decoration shop can be held and used for 1 day (24 hours), 7 days or 30 days from the time of purchase.","When the period ends they disappear from My items, and you must purchase them again to keep using them.","A face mask in use can be used until you close and leave the app, and items placed in a Doran-doran room can be used until that room ends.","Consumables disappear if they are not used within 24 hours of purchase.","Face masks are decoration items. If the front camera can't find your face, the picture is blurred. Masks and blur appear as they are in recordings and broadcasts."]},
 {h:"Article 3-8 (Karaoke terms)", b:["The karaoke Terms of Service also apply to your use of the karaoke."]},
 {h:"Article 4 (External links)", b:[
   "The Service may provide links to external sites or apps for your convenience. The Company is not responsible for the content, transactions or accuracy of those external services."]},
 {h:"Article 5 (User obligations and prohibited acts)", b:[
   "You must not:",
   ["register false information (especially regarding guide credentials) or misuse another person's information",
    "act in violation of law or public order and morals",
    "interfere with the normal operation of the Service or collect data without authorization",
    "infringe the rights of others"]]},
 {h:"Article 6 (Limitation of liability)", b:[
   "Maps, transit and business information provided by the Service are for travel reference and may differ from reality. Please verify schedules, fares and opening status on site and through official sources.",
   "The Company is not liable for damage arising from causes beyond its reasonable control, such as force majeure or failures of external APIs or communications."]},
 {h:"Article 7 (Governing law and jurisdiction)", b:[
   "Any lawsuit between the Company and a user is governed by the laws of the Republic of Korea.","Any lawsuit concerning a dispute between the Company and a user shall be filed with the court having jurisdiction under the Civil Procedure Act of the Republic of Korea.","Despite the preceding paragraph, if the user resides outside the Republic of Korea, the Seoul Central District Court of the Republic of Korea has exclusive jurisdiction over any lawsuit concerning a dispute between the Company and the user."]},
 {h:"Article 8 (Contact)", b:[
   "For questions about the Service, contact Support (+82-10-4221-7066) or email (admin@moneypuzzle.co.kr)."]}
 ]};

D.ja={title:"利用規約", eff:"施行日：2027年1月1日", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"第1条（目的）", b:["本規約は、株式会社 부만（Booman Inc.、以下「当社」）が提供する外国人観光案内アプリ「Money Puzzle Tour for Korea」（https://navi.moneypuzzle.co.kr、以下「本サービス」）の利用条件を定めることを目的とします。"]},
 {h:"第2条（サービスの内容）", b:[
   "本サービスは次を提供します。",
   ["観光地・グルメ・宿泊・施設などの旅行情報の提供",
    "現在地に基づく周辺のおすすめおよび道案内",
    "ガイド同行ツアー・体験・入場券などの旅行商品の販売（販売者：当社）",
    "外部の旅行予約プラットフォームへの誘導"],
   "旅行商品の代金は、当社が契約する決済代行会社（トスペイメンツ）の決済画面を通じて当社にお支払いいただきます。"]},
 {h:"第3条（旅行商品の販売とガイド）", b:[
   "本サービスで販売するツアー・体験商品の販売者は当社です。利用者は当社と契約して代金を当社に支払い、商品の履行・変更・キャンセル・返金の責任は当社が負います。",
   "最少催行人員が定められた商品は、出発の24時間前までに人数に達しない場合、当社が契約を取り消し、受け取った代金の全額を返金します。",
   "ツアーに同行するガイドは当社が業務を委託したガイド（フリーランスを含む）であり、ガイドの報酬は当社が支払います。利用者がガイドに別途料金を支払うことはありません。",
   "外部プラットフォームを通じた予約・決済・キャンセル・返金等は、当該事業者の規約と責任に従います。"]},
 {h:"第3条の2（カラオケ利用券）", b:["当社は本サービス内のカラオケで使う期間制の「利用券」を販売します。利用券はポイントで購入し、期間と価格は購入画面に表示されたとおりです（例：1か月10,000P）。","利用券の期間中は歌い放題です。利用券は自動で延長（更新）されず、期間が終わっても別途請求はありません。","利用券はログインしたアカウントに適用されます。利用中にもう一度購入すると、今の利用券の終了日から新しい期間が続きます。",["返金（購入日から7日以内で、まだ歌っていない場合）：全額を返金します。","返金（それ以外の場合）：残り日数分の金額からその10%を差し引いて返金します（コンテンツ利用者保護指針、消費者紛争解決基準の継続取引基準）。10P未満は返金しません。","利用券の返金は、購入に使った有料ポイント分のみを決済した手段で返金し（1P＝1ウォン）、無料ポイントで購入した分は返金しません。ポイントの返金手数料を再び差し引くことはありません。アプリマーケットでチャージしたポイントで購入した分は、そのマーケットの返金規定に従います。返金を申請すると利用券はすぐに終了します。"],"詳しくは返金規定に従います。"]},
 {h:"第3条の3（カラオケポイント）", b:["当社は、サービス内カラオケで使う前払いの「ポイント」を販売します。ポイントの使用と返金では1Pを1ウォンとして計算します。チャージ価格は決済手段ごとの購入画面に表示されたとおりです。","ポイントはログインしたアカウントのウォレット1つに記録され、ウェブと専用アプリで同じポイントをチャージ・使用します。","ポイントは、有料ポイント（利用者が決済でチャージしたポイント）と無料ポイント（チャージ特典・イベント・ランキング賞金・LIVEギフトの積立・補償など、決済なしで受け取ったポイント）に分けて記録します。","ポイントを使うときは、有料ポイントから（先にチャージしたものから）使い、その後に無料ポイントを使います。使用前に、使うポイントと使用後の残りポイントを画面に表示し、利用者の確認を受けます。",["有料ポイント：有効期限はありません。","無料ポイント：付与日から1年間使用でき、有効期限を過ぎた無料ポイントは使用できません。"],["返金（購入日から7日以内）：未使用の有料ポイントは、一部を使っていても手数料なしで全額返金します。","返金（購入日から7日経過後）：残りの有料ポイントから10%以内の返金手数料を差し引いて返金します。適用する手数料率は返金申請画面に表示します。ただし、残りの有料ポイントが10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。","無料ポイントは返金の対象外で、返金処理時にあわせて消滅します。10ウォン未満は返金しません。"],"返金は「マイウォレット → 返金申請」またはカスタマーセンターで申請でき、当社が確認した後、決済した手段で返金します。返金申請中のポイントは処理が終わるまで使用できません。","有料ポイントの返金は退会（アカウント削除）前に申請する必要があり、退会すると残りのポイントは消滅します。","Google Play・App Storeなどのアプリマーケットで購入したポイントの返金は、そのアプリマーケットの返金規定に従います。アプリマーケットで決済が取消・返金された場合、その決済でチャージされたポイント（一緒に付与された無料ポイントを含む）をウォレットから差し引き、すでに使用している場合はほかのポイントまたは以後チャージされるポイントから差し引きます。"]},
 {h:"第3条の4（カラオケLIVE配信）", b:["この条項はカラオケの「LIVE」機能に適用されます。",["LIVE配信を始められるのは本人認証した成人だけです。視聴・コメント・リアクションはサービスを利用できる利用者が行え、視聴にポイントは使われません。","配信者は配信中、視聴者1人が1時間視聴するごとに100Pを1分単位で負担します。当社は配信開始時にこれを画面で知らせ、残りポイントが0Pになると配信を自動で終了します。","曲が終わっても配信は続きます。配信者は3分以内に次の曲を選んで歌い続けることができ、選ばないと案内の30秒後に配信が終了します。","配信者は「観客」パネルで視聴者のニックネームと公開プロフィール写真を見ることができます。","視聴者は配信者にポイントでギフトを贈ることができます。ギフトの種類・価格と上限（1人1日500,000P）は画面の表示どおりで、青少年（満15歳以上満19歳未満）はギフトを贈れません。贈ったギフトは取消・返金できません。ただし関連法令により取り消せる場合を除きます。","配信者は受け取ったギフト金額の60%を無料ポイントとして受け取ります。積み立てたポイントの有効期間は積立日から1年で、サービス内でのみ使用でき、現金化や返金はできません。","ギフトに使った決済が取消・返金された場合、または不正決済と確認された場合、当社はそのギフトで配信者に積み立てたポイントを回収できます。すでに使用した場合は、以後の積立分から差し引くか、返還を請求することがあります。","配信でも、わいせつ・暴力・嫌悪表現、暴言、他人の権利侵害、広告は禁止します。当社は通報があった配信や違反した配信を予告なく終了でき、繰り返す場合は配信を制限できます。配信者は視聴者を退出させることができます。","当社は通報処理と紛争対応のため配信動画を非公開で30日間保管した後に削除し、保管動画は管理者のみが閲覧します。"]]},
 {h:"第3条の5（カラオケのランキング表彰）", b:[["当社は全体公開の歌の動画を対象に週間・月間・年末（王中王）の順位を発表し、1位に賞金をポイントで支給します。基準と賞金はサービス画面の表示どおりです。", "毎月最後の日曜日の週間賞金はその月の月間賞金に代え、12月の月間賞金は年末の王中王賞金に代えます。","賞金は無料ポイントとして自動で支給され、有効期間は支給日から1年です。返金や現金化はできません。","受賞者にはプロフィールの星が表示されます。週間・月間の星は年が変わると消え、王中王の星は残ります。","不正な方法で順位に影響を与えた動画は順位から除外することがあります。"]]},
 {h:"第3条の6（自動監視）", b:["StageSongには音声と画面を確認する自動監視システムを設置しています。","LIVE配信：スマホ内の判定に加え、低解像度の画面と音声の断片をサーバーで判定します。判定に使った画面と音声は保存せず、コメントの暴言は伏せて表示します。","ドランドラン：画面のみをスマホの中で5秒ごとに判定し、映像と音声はサーバーへ送りません。音声は判定せず、暴言はルームの人の通報で対応します。仲間だけカラオケ：ルームに投稿する動画は投稿動画と同じように判定します。アプリに初めて入るときに利用規約とあわせて同意します。","投稿動画：投稿時に画面の標本を判定し、タイトル・説明・コメントの暴言を確認します。問題があれば「自分のみ」で保存されます。","最初は画面を数秒隠してご案内します。確信度の高い検知が連続して繰り返された場合のみ、退室と24時間の利用制限を行います。音声・暴言の自動判定はご案内までです。ただし青少年アカウントは初回から、未成年者が関わる可能性のある場面は直ちに配信終了と利用制限を適用します。違反が繰り返される場合は、利用を永久に制限することがあります。","制限の案内にある「異議申し立て」を押すと当社が確認し、誤判定であれば制限を解除して利用券の期間と使ったポイントを復旧します。利用券は制限された期間だけ延長し、途切れたLIVE配信で使ったポイントは無料ポイント（有効期間1年）としてお返しします。","自動判定には誤りがあり得るため、当社はしきい値を慎重に運用します。判定用の複製は保存しません。配信動画は第3条の4に従って別途保管します。未成年者が関わる可能性のある場面を検知すると、配信を直ちに終了し、その録画を削除します。"]},
 {h:"第3条の7（カラオケのデコレーションアイテム）", b:["デコレーションショップのアイテムは、購入時刻から1日（24時間）、7日または30日間、保有・利用できます。","期間が終わるとアイテム箱から消え、引き続き使うには再度購入が必要です。","使用中のフェイスマスクはアプリを閉じて退出するまで、ドランドランの部屋に置いたアイテムはその部屋が終わるまで利用できます。","消耗品は購入時刻から24時間以内に使用しないと消えます。","フェイスマスクはデコレーションアイテムに含まれます。前面カメラで顔を見つけられないと画面がぼやけ、マスクとぼかしは録画と配信にそのまま残ります。"]},
 {h:"第3条の8（カラオケ規約の適用）", b:["カラオケの利用には、カラオケ利用規約もあわせて適用します。"]},
 {h:"第4条（外部リンクの免責）", b:[
   "本サービスは利便のため外部サイト・アプリへのリンクを提供する場合があります。当社は外部サービスの内容・取引・正確性について責任を負いません。"]},
 {h:"第5条（利用者の義務および禁止行為）", b:[
   "利用者は次の行為をしてはなりません。",
   ["虚偽情報の登録（特にガイド資格に関するもの）または他人の情報の盗用",
    "法令または公序良俗に反する行為",
    "本サービスの正常な運営を妨げ、または無断でデータを収集する行為",
    "他人の権利を侵害する行為"]]},
 {h:"第6条（責任の限界）", b:[
   "本サービスが提供する地図・交通・営業情報等は旅行の参考用であり、実際と異なる場合があります。運行時間・料金・営業の有無等は、現場および公式案内でご確認ください。",
   "当社は、天災や外部 API・通信の障害など、当社の合理的な支配を超える事由による損害について責任を負いません。"]},
 {h:"第7条（準拠法および管轄）", b:[
   "当社と利用者の間で提起された訴訟には、大韓民国法を準拠法とします。","当社と利用者の間で生じた紛争に関する訴訟は、民事訴訟法上の管轄裁判所に提起します。","利用者が外国居住者である場合、当社と利用者の間で生じた紛争に関する訴訟は、前項にかかわらず大韓民国ソウル中央地方法院を専属管轄裁判所とします。"]},
 {h:"第8条（お問い合わせ）", b:[
   "本サービスの利用に関するお問い合わせは、カスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）までご連絡ください。"]}
 ]};

D.zhs={title:"使用条款", eff:"施行日期：2027年1月1日", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"第1条（目的）", b:["本条款旨在规定 Booman Inc.（株式会社 부만，以下称\"本公司\"）提供的面向外国游客的旅游向导应用\"Money Puzzle Tour for Korea\"（https://navi.moneypuzzle.co.kr，以下称\"本服务\"）的使用条件。"]},
 {h:"第2条（服务内容）", b:[
   "本服务提供以下内容：",
   ["景点·美食·住宿·便利设施等旅行信息",
    "基于当前位置的周边推荐及路线指引",
    "销售向导陪同游览·体验·门票等旅游商品（销售方：本公司）",
    "引导至外部旅行预订平台"],
   "旅游商品的费用通过本公司签约的支付代理机构（Toss Payments）的支付窗口支付给本公司。"]},
 {h:"第3条（旅游商品的销售与向导）", b:[
   "通过本服务销售的游览·体验商品的销售方为本公司。用户与本公司签约并向本公司付款，商品的履行·变更·取消·退款由本公司负责。",
   "设有最少成团人数的商品，如在出发前24小时仍未达到该人数，本公司将取消合同并全额退还已收款项。",
   "陪同游览的向导由本公司委托（包括自由职业者），向导报酬由本公司支付。用户无需另向向导付费。",
   "通过外部平台进行的预订·支付·取消·退款等，依照该经营者的条款及责任办理。"]},
 {h:"第3条之2（卡拉OK畅唱券）", b:["本公司销售在本服务卡拉OK中使用的期限制「畅唱券」。畅唱券用积分购买，期限与价格以购买页面显示为准（例：1个月10,000P）。","畅唱券有效期内可无限唱歌。畅唱券不会自动续期（续费），到期后也不会另行扣款。","畅唱券适用于登录的账户。使用中再次购买的，新期间从当前畅唱券到期日起接续。",["退款（购买之日起7天内且未唱歌）：全额退款。","退款（其他情况）：退还剩余天数对应金额扣除该金额10%后的金额（依据《内容用户保护指南》及《消费者纠纷解决标准》的持续交易标准）。不足10P的不予退还。","畅唱券退款仅将购买时使用的付费积分部分退回原支付方式（1P = 1韩元），用免费积分购买的部分不予退款。不会再次扣除积分退款手续费。用应用商店充值的积分购买的部分按该商店的退款规定办理。申请退款后畅唱券立即结束。"],"详情以退款规定为准。"]},
 {h:"第3条之3（卡拉OK积分）", b:["本公司销售在服务内卡拉OK使用的预付“积分”。积分的使用和退款按1P等于1韩元计算。充值价格以各支付方式的购买页面显示为准。","积分记录在已登录账户的一个钱包中，网页和专用应用使用同一积分进行充值和使用。","积分分为付费积分（用户通过付款充值的积分）和免费积分（充值优惠、活动、排名奖金、LIVE礼物累积、补偿等未经付款获得的积分）分别记录。","使用积分时，先使用付费积分（按充值先后），再使用免费积分。使用前，页面会显示将使用的积分和使用后的剩余积分，并经用户确认。",["付费积分：没有有效期。","免费积分：自赠送之日起1年内可用，过期的免费积分不能使用。"],["退款（购买之日起7日内）：未使用的付费积分，即使已使用部分，也免手续费全额退还。","退款（购买满7日后）：从剩余付费积分中扣除不超过10%的退款手续费后退还。适用的费率显示在退款申请页面。但剩余付费积分在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。","免费积分不予退款，并在退款处理时一并失效。不足10韩元的部分不予退还。"],"可通过“我的钱包 → 申请退款”或客服申请退款，经本公司确认后退回原支付方式。申请退款中的积分在处理完成前不能使用。","付费积分的退款须在退出（删除账户）前申请，退出后剩余积分失效。","在 Google Play、App Store 等应用市场购买的积分，退款按该应用市场的退款规定办理。应用市场取消或退还付款时，将从钱包中扣除该笔付款充值的积分（含同时赠送的免费积分）；如已使用，则从其他积分或之后充值的积分中扣除。"]},
 {h:"第3条之4（卡拉OK LIVE直播）", b:["本条适用于卡拉OK的「LIVE」功能。",["只有完成实名认证的成年人才能开始LIVE直播。可使用服务的用户均可观看、评论和发表情，观看不使用积分。","主播在直播中按每位观众每小时100P、以分钟计算承担费用。本公司在开播时于画面告知，剩余积分为0P时自动结束直播。","歌曲结束后直播继续。主播可在3分钟内选择下一首歌接着唱；未选择时，提示后30秒结束直播。","主播可在「观众」面板查看观众的昵称和公开头像。","观众可用积分向主播赠送礼物。礼物种类、价格和限额（每人每天500,000P）以画面显示为准，青少年（年满15周岁未满19周岁）不能赠送礼物。已送出的礼物不可取消或退款，但依相关法令可取消的情形除外。","主播获得礼物金额60%的免费积分。这些积分的有效期为自累积之日起1年，只能在服务内使用，不能兑换现金或退款。","用于礼物的付款被取消、退款或被确认为欺诈付款时，本公司可以收回因该礼物计入主播的积分。如已使用，本公司可从之后累积的积分中扣除，或要求返还。","直播中同样禁止淫秽、暴力、仇恨内容、辱骂、侵害他人权利和广告。本公司可不经预告结束被举报或违规的直播，屡犯者可限制直播。主播可以请观众离开。","本公司为处理举报和应对纠纷，不公开保存直播视频30天后删除，保存的视频仅管理员可查看。"]]},
 {h:"第3条之5（卡拉OK排名奖励）", b:[["本公司以公开歌曲视频为对象公布周榜、月榜和年终（总冠军）排名，并以积分向第一名发放奖金。标准和奖金以服务画面显示为准。", "每月最后一个星期日的周榜奖金由当月月榜奖金代替，12月月榜奖金由年终总冠军奖金代替。","奖金以免费积分自动发放，有效期自发放日起1年，不可退款或兑换现金。","获奖者显示头像星星。周榜、月榜星星在换年时消失，总冠军星星保留。","以不正当方式影响排名的视频可从排名中排除。"]]},
 {h:"第3条之6（自动监测）", b:["StageSong 设有声音和画面自动监测系统。","LIVE 直播：除手机内判定外，低分辨率画面和音频片段在服务器上判定。判定所用内容不保存，评论中的辱骂词会被遮挡。","Doran-doran：仅在手机内每5秒判定一次画面，视频和声音不会发送到服务器。声音不判定，辱骂内容由房间成员举报处理。小圈子K歌：上传到房间的视频按发布视频的方式判定。首次进入应用时与使用条款一并同意。","发布的视频：发布时抽取画面判定，并检查标题、说明和评论中的辱骂词。如有问题，视频将设为「仅自己可见」。","最初只会遮挡画面几秒并提示。只有高置信度的检测连续且反复出现时，才会移出房间并限制使用24小时。声音和辱骂的自动判定只做提示。但青少年账号从第一次起适用，可能涉及未成年人的画面将立即结束直播并限制使用。屡次违规的，可永久限制使用。","点限制提示中的「提出申诉」后由本公司核实；确认误判的，将解除限制并恢复畅唱券期限和所用积分。畅唱券按被限制的时间延长，中断的LIVE直播所用积分以免费积分（有效期1年）退还。","自动判定可能出错，因此本公司以保守方式设置阈值。判定用副本不保存。直播视频依第3条之4另行保存。检测到可能涉及未成年人的画面时，立即结束直播并删除相应录像。"]},
 {h:"第3条之7（卡拉OK装饰道具）", b:["装饰商店的道具自购买时起可持有和使用1天（24小时）、7天或30天。","期限届满后，道具将从道具箱中消失，如需继续使用须重新购买。","正在使用的面具可使用至关闭并退出应用为止，放在 Doran-doran 房间的道具可使用至该房间结束。","消耗品自购买时起24小时内未使用的将消失。","面具属于装饰道具。前置摄像头找不到面部时画面会变模糊，面具和模糊效果会原样保留在录像和直播中。"]},
 {h:"第3条之8（卡拉OK条款的适用）", b:["使用卡拉OK时，同时适用卡拉OK使用条款。"]},
 {h:"第4条（外部链接免责）", b:[
   "为方便用户，本服务可能提供指向外部网站·应用的链接。本公司对外部服务的内容·交易·准确性不承担责任。"]},
 {h:"第5条（用户义务及禁止行为）", b:[
   "用户不得有下列行为：",
   ["登记虚假信息（尤其是涉及向导资格的信息）或盗用他人信息",
    "违反法律或公序良俗的行为",
    "妨碍本服务正常运营或擅自收集数据的行为",

 {h:"第6条（责任限制）", b:[
   "本服务提供的地图·交通·营业信息等仅供旅行参考，可能与实际不符。运行时间·费用·是否营业等请在现场及官方指南确认。",
   "对于天灾、外部 API·通信故障等超出本公司合理控制范围的事由所致损害，本公司不承担责任。"]},
 {h:"第7条（准据法及管辖）", b:[
   "公司与用户之间提起的诉讼以大韩民国法律为准据法。","公司与用户之间发生争议的诉讼，向《民事诉讼法》规定的管辖法院提起。","用户为外国居住者时，尽管有前款规定，公司与用户之间发生争议的诉讼以大韩民国首尔中央地方法院为专属管辖法院。"]},
 {h:"第8条（咨询）", b:[
   "有关本服务使用的咨询，请联系客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）。"]}

D.zht={title:"使用條款", eff:"施行日期：2027年1月1日", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"第1條（目的）", b:["本條款旨在規定 Booman Inc.（株式會社 부만，以下稱「本公司」）提供的面向外國旅客的旅遊嚮導應用程式「Money Puzzle Tour for Korea」（https://navi.moneypuzzle.co.kr，以下稱「本服務」）的使用條件。"]},
 {h:"第2條（服務內容）", b:[
   "本服務提供以下內容：",
   ["景點·美食·住宿·便利設施等旅遊資訊",
    "基於目前位置的周邊推薦及路線指引",
    "銷售嚮導陪同遊覽·體驗·門票等旅遊商品（銷售方：本公司）",
    "引導至外部旅遊預訂平台"],
   "旅遊商品的費用透過本公司簽約的支付代理機構（Toss Payments）的付款視窗支付給本公司。"]},
 {h:"第3條（旅遊商品的銷售與嚮導）", b:[
   "透過本服務銷售的遊覽·體驗商品的銷售方為本公司。使用者與本公司簽約並向本公司付款，商品的履行·變更·取消·退款由本公司負責。",
   "設有最少成團人數的商品，如在出發前24小時仍未達到該人數，本公司將取消合約並全額退還已收款項。",
   "陪同遊覽的嚮導由本公司委託（包括自由工作者），嚮導報酬由本公司支付。使用者無需另向嚮導付費。",
   "透過外部平台進行的預訂·付款·取消·退款等，依照該經營者的條款及責任辦理。"]},
 {h:"第3條之2（卡拉OK暢唱券）", b:["本公司銷售於本服務卡拉OK中使用的期限制「暢唱券」。暢唱券以點數購買，期限與價格以購買頁面顯示為準（例：1個月10,000P）。","暢唱券有效期內可無限唱歌。暢唱券不會自動續期（續費），到期後亦不會另行扣款。","暢唱券適用於登入的帳戶。使用中再次購買者，新期間自目前暢唱券到期日起接續。",["退款（購買之日起7天內且未唱歌）：全額退款。","退款（其他情況）：退還剩餘天數對應金額扣除該金額10%後的金額（依據《內容使用者保護指南》及《消費者紛爭解決標準》之持續交易標準）。不足10P者不予退還。","暢唱券退款僅將購買時使用的付費點數部分退回原付款方式（1P = 1韓元），以免費點數購買的部分不予退款。不會再次扣除點數退款手續費。以應用商店儲值的點數購買的部分依該商店的退款規定辦理。申請退款後暢唱券立即結束。"],"詳情以退款規定為準。"]},
 {h:"第3條之3（卡拉OK點數）", b:["本公司銷售在服務內卡拉OK使用的預付「點數」。點數的使用與退款按1P等於1韓元計算。儲值價格以各付款方式的購買頁面顯示為準。","點數記錄在已登入帳戶的一個錢包中，網頁與專用應用程式使用同一點數儲值與使用。","點數分為付費點數（使用者付款儲值的點數）與免費點數（儲值優惠、活動、排名獎金、LIVE禮物累積、補償等未經付款取得的點數）分別記錄。","使用點數時，先使用付費點數（依儲值先後），再使用免費點數。使用前，頁面會顯示將使用的點數與使用後的剩餘點數，並經使用者確認。",["付費點數：沒有有效期。","免費點數：自贈送之日起1年內可用，過期的免費點數不能使用。"],["退款（購買之日起7日內）：未使用的付費點數，即使已使用部分，也免手續費全額退還。","退款（購買滿7日後）：從剩餘付費點數中扣除不超過10%的退款手續費後退還。適用的費率顯示在退款申請頁面。但剩餘付費點數在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。","免費點數不予退款，並於退款處理時一併失效。未滿10韓元的部分不予退還。"],"可透過「我的錢包 → 申請退款」或客服申請退款，經本公司確認後退回原付款方式。申請退款中的點數在處理完成前不能使用。","付費點數的退款須於退出（刪除帳戶）前申請，退出後剩餘點數失效。","在 Google Play、App Store 等應用程式市集購買的點數，退款依該市集的退款規定辦理。市集取消或退還付款時，將從錢包中扣除該筆付款儲值的點數（含同時贈送的免費點數）；如已使用，則從其他點數或之後儲值的點數中扣除。"]},
 {h:"第3條之4（卡拉OK LIVE直播）", b:["本條適用於卡拉OK的「LIVE」功能。",["只有完成實名認證的成年人才能開始LIVE直播。可使用服務的使用者均可觀看、留言和發表情，觀看不使用點數。","主播在直播中按每位觀眾每小時100P、以分鐘計算負擔費用。本公司在開播時於畫面告知，剩餘點數為0P時自動結束直播。","歌曲結束後直播繼續。主播可於3分鐘內選擇下一首歌接著唱；未選擇時，提示後30秒結束直播。","主播可在「觀眾」面板查看觀眾的暱稱和公開頭像。","觀眾可用點數向主播贈送禮物。禮物種類、價格和限額（每人每天500,000P）以畫面顯示為準，青少年（年滿15歲未滿19歲）不能贈送禮物。已送出的禮物不可取消或退款，但依相關法令可取消的情形除外。","主播獲得禮物金額60%的免費點數。這些點數的有效期為自累積之日起1年，只能在服務內使用，不能兌換現金或退款。","用於禮物的付款被取消、退款或被確認為詐欺付款時，本公司得收回因該禮物計入主播的點數。如已使用，本公司可從之後累積的點數中扣除，或要求返還。","直播中同樣禁止猥褻、暴力、仇恨內容、辱罵、侵害他人權利和廣告。本公司可不經預告結束被檢舉或違規的直播，屢犯者可限制直播。主播可以請觀眾離開。","本公司為處理檢舉和應對糾紛，不公開保存直播影片30天後刪除，保存的影片僅管理員可查看。"]]},
 {h:"第3條之5（卡拉OK排名獎勵）", b:[["本公司以公開歌曲影片為對象公布週榜、月榜和年終（總冠軍）排名，並以點數向第一名發放獎金。標準和獎金以服務畫面顯示為準。", "每月最後一個星期日的週榜獎金由當月月榜獎金代替，12月月榜獎金由年終總冠軍獎金代替。","獎金以免費點數自動發放，有效期自發放日起1年，不可退款或兌換現金。","得獎者顯示頭像星星。週榜、月榜星星在換年時消失，總冠軍星星保留。","以不正當方式影響排名的影片可從排名中排除。"]]},
 {h:"第3條之6（自動監測）", b:["StageSong 設有聲音和畫面自動監測系統。","LIVE 直播：除手機內判定外，低解析度畫面和音訊片段在伺服器上判定。判定所用內容不儲存，留言中的辱罵詞會被遮擋。","Doran-doran：僅在手機內每5秒判定一次畫面，影像和聲音不會傳送到伺服器。聲音不判定，辱罵內容由房間成員檢舉處理。小圈子K歌：上傳到房間的影片按發布影片的方式判定。首次進入應用程式時與使用條款一併同意。","發布的影片：發布時抽取畫面判定，並檢查標題、說明和留言中的辱罵詞。如有問題，影片將設為「僅自己可見」。","最初只會遮擋畫面幾秒並提示。只有高信賴度的偵測連續且反覆出現時，才會移出房間並限制使用24小時。聲音和辱罵的自動判定只做提示。但青少年帳號從第一次起適用，可能涉及未成年人的畫面將立即結束直播並限制使用。屢次違規者，得永久限制使用。","點限制提示中的「提出申訴」後由本公司確認；確認誤判者，將解除限制並恢復暢唱券期限和所用點數。暢唱券按被限制的時間延長，中斷的LIVE直播所用點數以免費點數（有效期1年）退還。","自動判定可能出錯，因此本公司以保守方式設定閾值。判定用副本不儲存。直播影片依第3條之4另行保存。偵測到可能涉及未成年人的畫面時，立即結束直播並刪除相應錄影。"]},
 {h:"第3條之7（卡拉OK裝飾道具）", b:["裝飾商店的道具自購買時起可持有和使用1天（24小時）、7天或30天。","期限屆滿後，道具將從道具箱中消失，如需繼續使用須重新購買。","正在使用的面具可使用至關閉並退出應用程式為止，放在 Doran-doran 房間的道具可使用至該房間結束。","消耗品自購買時起24小時內未使用者將消失。","面具屬於裝飾道具。前置鏡頭找不到臉部時畫面會變模糊，面具和模糊效果會原樣保留在錄影和直播中。"]},
 {h:"第3條之8（卡拉OK條款的適用）", b:["使用卡拉OK時，同時適用卡拉OK使用條款。"]},
 {h:"第4條（外部連結免責）", b:[
   "為方便使用者，本服務可能提供指向外部網站·應用程式的連結。本公司對外部服務的內容·交易·準確性不承擔責任。"]},
 {h:"第5條（使用者義務及禁止行為）", b:[
   "使用者不得有下列行為：",
   ["登記虛假資訊（尤其是涉及嚮導資格的資訊）或盜用他人資訊",
    "違反法律或公序良俗的行為",
    "妨礙本服務正常運營或擅自蒐集資料的行為",
    "侵害他人權利的行為"]]},
 {h:"第6條（責任限制）", b:[
   "本服務提供的地圖·交通·營業資訊等僅供旅遊參考，可能與實際不符。運行時間·費用·是否營業等請在現場及官方指南確認。",
   "對於天災、外部 API·通訊故障等超出本公司合理控制範圍的事由所致損害，本公司不承擔責任。"]},
 {h:"第7條（準據法及管轄）", b:[
   "公司與使用者之間提起的訴訟以大韓民國法律為準據法。","公司與使用者之間發生爭議的訴訟，向《民事訴訟法》規定的管轄法院提起。","使用者為外國居住者時，儘管有前款規定，公司與使用者之間發生爭議的訴訟以大韓民國首爾中央地方法院為專屬管轄法院。"]},
 {h:"第8條（諮詢）", b:[
   "有關本服務使用的諮詢，請聯絡客服（+82-10-4221-7066）或電郵（admin@moneypuzzle.co.kr）。"]}
 ]};

D.es={title:"Términos de Servicio", eff:"Fecha de entrada en vigor: 1 de enero de 2027", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"Artículo 1 (Objeto)", b:["Estos Términos regulan el uso de la app de guía turística \"Money Puzzle Tour for Korea\" (https://navi.moneypuzzle.co.kr, \"el Servicio\"), prestada por Booman Inc. (\"la Empresa\")."]},
 {h:"Artículo 2 (El Servicio)", b:[
   "El Servicio ofrece:",
   ["información de viaje como atracciones, restaurantes, alojamientos y servicios",
    "recomendaciones cercanas e indicaciones según tu ubicación actual",
    "venta de productos de viaje como tours guiados, experiencias y entradas (vendedor: la Empresa)",
    "enlaces a plataformas externas de reservas de viaje"],
   "El pago de los productos de viaje se realiza a la Empresa a través de la ventana de pago de su pasarela contratada (Toss Payments)."]},
 {h:"Artículo 3 (Venta de productos de viaje y guías)", b:[
   "La Empresa es la vendedora de los tours y experiencias que se venden a través del Servicio. Contratas con la Empresa y le pagas a ella, y la Empresa es responsable de la prestación, los cambios, las cancelaciones y los reembolsos.",
   "En los productos con un número mínimo de participantes, si no se alcanza 24 horas antes de la salida, la Empresa cancelará el contrato y reembolsará el importe íntegro pagado.",
   "Los guías que acompañan los tours son contratados por la Empresa (incluidos autónomos), y la Empresa les paga sus honorarios. No pagas a los guías por separado.",
   "Las reservas, pagos, cancelaciones y reembolsos a través de plataformas externas se rigen por los términos y la responsabilidad de esos proveedores."]},
 {h:"Artículo 3-2 (Bono de karaoke)", b:["La Empresa vende un «bono» por tiempo para el karaoke del Servicio. Los bonos se compran con puntos, y los periodos y precios son los que muestra la pantalla de compra (p. ej., 1 mes 10.000P).","Durante el bono puedes cantar sin límite. El bono no se renueva automáticamente y no se cobra nada cuando termina.","El bono se aplica a la cuenta con la que inicias sesión. Si compras otro mientras uno está activo, el nuevo periodo empieza en la fecha de fin del bono actual.",["Reembolso (en los 7 días siguientes a la compra y si no has cantado): se devuelve el importe completo.","Reembolso (en los demás casos): se devuelve el importe de los días restantes menos el 10% de ese importe (Directrices de protección de usuarios de contenidos; Normas de resolución de litigios de consumo para transacciones continuas). No se devuelven importes inferiores a 10P.","El reembolso del bono se paga a tu método de pago original solo por la parte pagada con puntos de pago (1P = ₩1); la parte comprada con puntos gratuitos no se reembolsa. No se vuelve a descontar la comisión de reembolso de puntos. La parte comprada con puntos recargados en una tienda de apps sigue la política de esa tienda. El bono termina en cuanto pides el reembolso."],"Los detalles siguen la Política de reembolso."]},
 {h:"Artículo 3-3 (Puntos de karaoke)", b:["La Empresa vende «puntos» prepagados para el karaoke del Servicio. Para usar y reembolsar puntos, 1P se calcula como ₩1. Los precios de recarga son los que muestra la pantalla de compra de cada medio de pago.","Los puntos se registran en un único monedero de tu cuenta con sesión iniciada, y los mismos puntos se recargan y usan en la web y en la app propia.","Los puntos se registran por separado como puntos de pago (recargados con tu pago) y puntos gratuitos (recibidos sin pago, como bonificaciones de recarga, eventos, premios de ranking, abonos de regalos de LIVE y compensaciones).","Al usar puntos, primero se usan los de pago (los recargados antes primero) y después los gratis. Antes de cualquier uso, la pantalla muestra los puntos que se usarán y el saldo restante, y pide tu confirmación.",["Puntos de pago: no caducan.","Puntos gratuitos: pueden usarse durante 1 año desde la fecha de entrega. Los puntos gratuitos caducados no pueden usarse."],["Reembolso (en los 7 días siguientes a la compra): los puntos de pago no usados se reembolsan íntegros sin comisión, aunque hayas usado una parte.","Reembolso (pasados 7 días): se reembolsan los puntos de pago restantes menos una comisión de hasta el 10%. La tasa aplicada se muestra en la pantalla de solicitud de reembolso. No obstante, si los puntos de pago restantes son 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso.","Los puntos gratuitos no son reembolsables y caducan al procesar un reembolso. No se reembolsan importes inferiores a ₩10."],"Puedes solicitar el reembolso en «Mi monedero > Solicitar reembolso» o a través de Atención al cliente. Tras revisarlo, la Empresa reembolsa al medio de pago utilizado. Los puntos con una solicitud de reembolso en curso no pueden usarse hasta que se procese.","El reembolso de los puntos de pago debe solicitarse antes de darte de baja (eliminar tu cuenta); al darte de baja, los puntos restantes caducan.","Los reembolsos de puntos comprados en una tienda de apps como Google Play o App Store siguen la política de reembolso de esa tienda. Si la tienda cancela o reembolsa el pago, los puntos de ese pago (incluidos los puntos gratuitos entregados con él) se descuentan de tu monedero; si ya se usaron, se descuentan de otros puntos o de recargas posteriores."]},
 {h:"Artículo 3-4 (Emisiones LIVE de karaoke)", b:["Este artículo se aplica a la función LIVE del karaoke.",["Solo los adultos verificados pueden iniciar una emisión LIVE. Quien pueda usar el Servicio puede ver, comentar y reaccionar, y ver no consume puntos.","Quien emite paga 100P por espectador y hora, calculados cada minuto. La Empresa lo muestra al iniciar la emisión y la termina automáticamente cuando los puntos restantes llegan a 0P.","La emisión continúa cuando termina una canción. Quien emite puede elegir la siguiente en 3 minutos y seguir cantando; si no, aparece un aviso y la emisión termina 30 segundos después.","Quien emite puede ver el apodo y la foto de perfil pública de los espectadores en el panel «Público».","Los espectadores pueden enviar regalos con puntos a quien emite. Los tipos, precios y el límite (500.000P por persona al día) son los que aparecen en pantalla. Los menores de 15 a menos de 19 años no pueden enviar regalos. Los regalos enviados no se cancelan ni se reembolsan, salvo cuando la ley permita cancelarlos.","Quien emite recibe el 60 % del importe del regalo como puntos gratuitos, válidos 1 año desde la fecha del abono, que solo se usan dentro del Servicio y no se cambian por dinero ni se reembolsan.","Si un pago usado para un regalo se cancela o reembolsa, o se confirma que es fraudulento, la Empresa puede recuperar los puntos abonados a quien emite por ese regalo. Si ya se han usado, la Empresa puede descontarlos de abonos posteriores o exigir su devolución.","En las emisiones se prohíben los contenidos obscenos, violentos u ofensivos, los insultos, la infracción de derechos ajenos y la publicidad. La Empresa puede terminar sin aviso una emisión denunciada o infractora y limitar a los reincidentes. Quien emite puede expulsar espectadores.","La Empresa guarda las emisiones de forma privada 30 días para atender denuncias y disputas, y luego las elimina. Solo los administradores pueden verlas."]]},
 {h:"Artículo 3-5 (Ranking y premios de karaoke)", b:[["La Empresa anuncia rankings semanales, mensuales y de fin de año (Campeón) de vídeos públicos y paga un premio en puntos al primer puesto. Los criterios y premios son los que aparecen en pantalla.", "El premio semanal del último domingo de cada mes se sustituye por el premio mensual de ese mes, y el premio mensual de diciembre se sustituye por el premio de Campeón.","Los premios se pagan automáticamente como puntos gratuitos, válidos 1 año desde el pago. No se reembolsan ni se cambian por dinero.","Los ganadores tienen una estrella de perfil. Las semanales y mensuales desaparecen al cambiar de año; las de Campeón se quedan.","Los vídeos que influyan en el ranking de forma indebida pueden excluirse."]]},
 {h:"Artículo 3-6 (Supervisión automática)", b:["StageSong tiene un sistema de supervisión automática del sonido y la imagen.","LIVE: además de la comprobación en el teléfono, se comprueban en el servidor imágenes de baja resolución y fragmentos de audio. No se guardan después, y las palabras ofensivas de los comentarios se ocultan.","Doran-doran: solo se comprueba la imagen, en tu teléfono cada 5 segundos, y no se envían vídeo ni sonido al servidor. El sonido no se comprueba; el lenguaje ofensivo se gestiona mediante denuncias de las personas de la sala. Solo nosotros Karaoke: los vídeos que se suben a una sala se comprueban igual que los vídeos publicados. Lo aceptas con los Términos la primera vez que entras en la app.","Vídeos publicados: se comprueban imágenes de muestra al publicar, junto con título, descripción y comentarios. Si hay un problema, el vídeo se guarda como «Solo yo».","Al principio la imagen se cubre unos segundos con un aviso. La expulsión y el límite de 24 horas solo se aplican si las detecciones de alta confianza continúan y se repiten. Las comprobaciones de sonido y lenguaje solo dan un aviso. No obstante, en las cuentas de menores se aplican desde la primera vez, y ante escenas que puedan implicar a un menor la emisión termina de inmediato y se limita el uso. Si las infracciones se repiten, el uso puede limitarse de forma permanente.","Toca «Reclamar» en el aviso y la Empresa lo revisará. Si fue un error, se levanta el límite y recuperas el periodo del bono y los puntos usados. El bono se amplía el tiempo que estuviste limitado, y los puntos usados en la emisión LIVE interrumpida se devuelven como puntos gratuitos (válidos 1 año).","Las comprobaciones automáticas pueden equivocarse, por lo que la Empresa fija umbrales prudentes. Las copias usadas para comprobar no se guardan. Los vídeos de las emisiones se guardan aparte según el artículo 3-4. Si se detecta una escena que pueda implicar a un menor, la emisión termina de inmediato y se borra esa grabación."]},
 {h:"Artículo 3-7 (Artículos de decoración del karaoke)", b:["Los artículos de la tienda de decoración se pueden tener y usar durante 1 día (24 horas), 7 días o 30 días desde la hora de compra.","Al terminar el periodo desaparecen de Mis artículos y, para seguir usándolos, hay que volver a comprarlos.","Una máscara facial en uso se puede usar hasta cerrar y salir de la app, y los artículos colocados en una sala Doran-doran se pueden usar hasta que termine esa sala.","Los consumibles desaparecen si no se usan en las 24 horas siguientes a la compra.","Las máscaras faciales son artículos de decoración. Si la cámara frontal no encuentra tu cara, la imagen se difumina. Las máscaras y el difuminado quedan tal cual en las grabaciones y emisiones."]},
 {h:"Artículo 3-8 (Términos del karaoke)", b:["Al uso del karaoke se aplican también los Términos de Servicio del karaoke."]},

 {h:"Artículo 6 (Limitación de responsabilidad)", b:[

 {h:"Artículo 7 (Ley aplicable y jurisdicción)", b:[

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://navi.moneypuzzle.co.kr/?lang="+lang;
  document.title=d.title+" · Money Puzzle Tour for Korea";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
