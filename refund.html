导行程检查如在付款后24小时内向导未能回复，或没有可检查的向导，将自动全额退款。"]}, {"h": "3. 退款方式与咨询", "b": ["退款仅通过取消所付款信用卡的付款办理，不以现金支付或银行转账方式退款。视发卡机构情况，取消可能需要3至7个工作日生效。", "所有交易的责任、退款及投诉等均由株式会社 富滿（Booman Inc.）负责处理。投诉负责人：监事 Hwang Euiman · +82-10-4221-7066", "咨询：应用内的客户留言板，或邮箱 admin@moneypuzzle.co.kr"]}, {"h": "语言", "b": ["本规定以韩语撰写。如其他语言译本与韩语版内容不一致，以韩语版为准。"]}]}, "zht": {"title": "退款規定", "eff": "施行日期：2027年1月1日", "app": "MosaicTrip", "sec": [{"h": "1. 旅遊、嚮導產品", "b": ["自付款之日起7日內，可無違約金撤銷訂購並全額退款。自付款之日起超過7日後取消者，依據韓國公平交易委員會《消費者紛爭解決標準》（國內旅行），按取消時間退款如下：", ["出發前5天及以前取消：全額退款", "出發前2天及以前取消：扣除費用的10%後退款", "出發前1天取消：扣除費用的20%後退款", "當天取消或未參加：扣除費用的30%後退款"]]}, {"h": "2. 因公司或嚮導原因取消", "b": ["因公司或嚮導原因（包括天氣、安全問題）取消行程時，全額退款。", "設有最少成團人數的商品，如在出發前24小時仍未達到該人數，本公司將取消合約並全額退還已收款項。", "嚮導行程檢查如在付款後24小時內嚮導未能回覆，或沒有可檢查的嚮導，將自動全額退款。"]}, {"h": "3. 退款方式與諮詢", "b": ["退款僅透過取消所付款信用卡的付款辦理，不以現金支付或銀行轉帳方式退款。視發卡機構情況，取消可能需要3至7個工作日生效。", "所有交易的責任、退款及申訴等均由株式會社 富滿（Booman Inc.）負責處理。申訴負責人：監事 Hwang Euiman · +82-10-4221-7066", "諮詢：應用程式內的客戶留言板，或電郵 admin@moneypuzzle.co.kr"]}, {"h": "語言", "b": ["本規定以韓語撰寫。如其他語言譯本與韓語版內容不一致，以韓語版為準。"]}]}, "es": {"title": "Política de reembolso", "eff": "Fecha de entrada en vigor: 1 de enero de 2027", "app": "MosaicTrip", "sec": [{"h": "1. Tours y servicios de guía", "b": ["Puedes desistir de tu compra en los 7 días siguientes al pago, sin penalización y con reembolso total. Si cancelas pasados 7 días desde el pago, el reembolso sigue los Estándares de Resolución de Disputas de Consumo de la Comisión de Comercio Justo de Corea (viajes nacionales), según cuándo canceles:", ["Hasta 5 días antes del tour: reembolso total", "Hasta 2 días antes: se descuenta el 10% del precio", "1 día antes: se descuenta el 20% del precio", "El mismo día o si no te presentas: se descuenta el 30% del precio"]]}, {"h": "2. Cancelación por nuestra parte o del guía", "b": ["Si el tour se cancela por motivos nuestros o del guía, incluidos el clima o la seguridad, el reembolso es total.", "En los productos con un número mínimo de participantes, si no se alcanza 24 horas antes de la salida, la Empresa cancelará el contrato y reembolsará el importe íntegro pagado.", "En la Revisión del itinerario por un guía, si ningún guía responde en las 24 horas siguientes al pago o no hay ningún guía disponible, se reembolsa todo automáticamente."]}, {"h": "3. Forma de reembolso y contacto", "b": ["Los reembolsos solo se hacen anulando el pago en la tarjeta con la que pagaste; no hay reembolsos en efectivo ni por transferencia bancaria. Según la entidad emisora, la anulación puede tardar de 3 a 7 días hábiles en reflejarse.", "Booman Inc. se encarga de la responsabilidad, los reembolsos y las reclamaciones de todas las transacciones. Responsable de reclamaciones: Hwang Euiman (auditor) · +82-10-4221-7066", "Contacto: Foro de clientes de la app o correo admin@moneypuzzle.co.kr"]}, {"h": "Idioma", "b": ["Esta Política se ha redactado en coreano. Si una traducción a otro idioma difiere de la versión en coreano, prevalecerá la versión en coreano."]}]}};
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://navi.moneypuzzle.co.kr/?lang="+lang;
  document.title=d.title+" · "+(d.app||"MosaicTrip");   // 11-08 여행사 이름(언어별)
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
