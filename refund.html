var D={"ko":{"title":"환불 규정","eff":"시행일:      년    월    일","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 투어·가이드 상품","b":["공정거래위원회 「소비자분쟁해결기준」(국내여행)을 따릅니다. 취소 시점에 따라 아래와 같이 환불합니다.",["여행 시작 5일 전까지 취소: 전액 환불","여행 시작 2일 전까지 취소: 요금의 10% 공제 후 환불","여행 시작 1일 전 취소: 요금의 20% 공제 후 환불","여행 당일 취소 또는 불참: 요금의 30% 공제 후 환불"]]},{"h":"2. 회사·가이드 사정으로 취소되는 경우","b":["날씨·안전 문제를 포함해 회사 또는 가이드의 사정으로 투어가 취소되면 전액 환불합니다.","최소 출발 인원이 있는 상품은 출발 24시간 전까지 인원이 차지 않으면 회사가 계약을 취소하고 받은 금액 전액을 환불합니다."]},{"h":"3. 디지털 서비스 (AI 여행 일정 등)","b":["결제 후 서비스가 제공되기 전(일정이 만들어지기 전)에는 전액 환불합니다.","서비스가 제공된 뒤(일정 생성 후)에는 디지털 콘텐츠 특성상 환불되지 않습니다."]},{"h":"4. 노래방 곡 이용권 (시험 운영 중)","b":["노래방 곡 이용권은 서비스 안 노래방의 정식 반주 곡(준비 중)에 쓰는 선불 이용권입니다. TJ·금영 공식 유튜브 채널의 노래방 영상은 무료이며 곡 이용권을 차감하지 않습니다.",["보관: 산 곡(서비스 곡 포함)은 로그인한 계정에 구매일로부터 1년간 보관됩니다.","구매일로부터 7일 이내이고 한 곡도 쓰지 않았으면: 전액 환불","그 밖의 경우: 남은 곡 비율만큼 환불 (결제 금액 × 남은 곡 ÷ 받은 전체 곡, 10원 미만 버림)","서비스 곡은 따로 환불 대상이 아니며, 이미 사용한(부른) 곡은 환불되지 않습니다."],"예: 10+5 묶음(10,000원·15곡)을 사고 8일째에 6곡을 썼다면 남은 9곡 → 10,000원 × 9 ÷ 15 = 6,000원 환불.","환불 요청은 노래방 화면의 「남은 곡 환불 요청」 단추 또는 아래 문의처로 하실 수 있습니다.","현재 곡 이용권 결제는 시험 운영 중(UNDER TESTING)입니다. 시험 결제는 실제로 청구되지 않으며 곡 수도 쌓이지 않습니다."]},{"h":"5. 환불 방법과 문의","b":["환불은 결제한 수단으로 영업일 기준 3~7일 안에 처리됩니다.","문의: 앱 안의 문의 메뉴 또는 이메일 emhwang3@moneypuzzle.co.kr"]}]},"en":{"title":"Refund Policy","eff":"Effective date: ____-__-__","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. Tours and guide services","b":["We follow the Korea Fair Trade Commission's Consumer Dispute Resolution Standards (domestic travel). Refunds depend on when you cancel:",["Cancel up to 5 days before the tour: full refund","Cancel up to 2 days before: 10% of the fee deducted","Cancel 1 day before: 20% of the fee deducted","Cancel on the day or no-show: 30% of the fee deducted"]]},{"h":"2. Cancellation by us or the guide","b":["If the tour is cancelled for reasons on our or the guide's side, including weather or safety, you get a full refund.","For products with a minimum number of participants, if that number is not reached 24 hours before departure, the Company will cancel the contract and refund the full amount paid."]},{"h":"3. Digital services (AI trip plans, etc.)","b":["Full refund if cancelled after payment but before the service is delivered (before the plan is created).","No refund after the service has been delivered (after the plan is created), due to the nature of digital content."]},{"h":"4. Karaoke song pass (test mode)","b":["The karaoke song pass is a prepaid pass for licensed accompaniment songs (in preparation) in the app's karaoke. Karaoke videos from the official TJ and KY YouTube channels are free and do not use the song pass.",["Storage: songs you buy (including bonus songs) stay in your signed-in account for 1 year from purchase.","Within 7 days of purchase and no song used: full refund","Otherwise: refund in proportion to the songs left (amount paid × songs left ÷ total songs received, rounded down to ₩10)","Bonus songs are not refundable on their own, and songs already used (sung) are not refunded."],"Example: buy the 10+5 pack (₩10,000, 15 songs) and use 6 songs by day 8 — 9 songs remain → ₩10,000 × 9 ÷ 15 = ₩6,000 refunded.","You can request a refund with the “Request refund for unused songs” button in the karaoke screen or through the contact below.","Song pass payments are currently in test mode (UNDER TESTING). Test payments are not actually charged and no songs are added."]},{"h":"5. How refunds are paid and contact","b":["Refunds are made to your original payment method within 3–7 business days.","Contact: the inquiry menu in the app, or email emhwang3@moneypuzzle.co.kr"]}]},"ja":{"title":"返金規定","eff":"施行日：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. ツアー・ガイド商品","b":["公正取引委員会「消費者紛争解決基準」（国内旅行）に従い、取消時期に応じて次のとおり返金します。",["旅行開始の5日前までの取消：全額返金","2日前までの取消：料金の10%を差し引いて返金","1日前の取消：料金の20%を差し引いて返金","当日取消・不参加：料金の30%を差し引いて返金"]]},{"h":"2. 会社・ガイドの都合による取消","b":["天候・安全上の理由を含め、会社またはガイドの都合でツアーが中止になった場合は全額返金します。","最少催行人員が定められた商品は、出発の24時間前ま function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:emhwang3@moneypuzzle.co.kr">emhwang3@moneypuzzle.co.kr</a>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:emhwang3@moneypuzzle.co.kr">emhwang3@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://navi.moneypuzzle.co.kr/?lang="+lang;
  document.title=d.title+" · Money Puzzle Tour for Korea";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
