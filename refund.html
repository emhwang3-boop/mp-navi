var D={"ko":{"title":"환불 규정","eff":"시행일:      년    월    일","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 투어·가이드 상품","b":["공정거래위원회 「소비자분쟁해결기준」(국내여행)을 따릅니다. 취소 시점에 따라 아래와 같이 환불합니다.",["여행 시작 5일 전까지 취소: 전액 환불","여행 시작 2일 전까지 취소: 요금의 10% 공제 후 환불","여행 시작 1일 전 취소: 요금의 20% 공제 후 환불","여행 당일 취소 또는 불참: 요금의 30% 공제 후 환불"]]},{"h":"2. 회사·가이드 사정으로 취소되는 경우","b":["날씨·안전 문제를 포함해 회사 또는 가이드의 사정으로 투어가 취소되면 전액 환불합니다.","최소 출발 인원이 있는 상품은 출발 24시간 전까지 인원이 차지 않으면 회사가 계약을 취소하고 받은 금액 전액을 환불합니다."]},{"h":"3. 노래방 곡 이용권","b":["노래방 곡 이용권은 서비스 안 노래방의 정식 반주 곡에 쓰는 선불 이용권이며, 정식 반주 곡 1곡을 부를 때마다 이용권 1곡이 차감됩니다.",["보관: 산 곡(서비스 곡 포함)은 로그인한 계정에 구매일로부터 1년간 보관됩니다.","구매일로부터 7일 이내: 결제 금액에서 사용한(부른) 곡을 1곡 1,000원으로 계산해 뺀 금액을 환불합니다.","7일이 지난 뒤(보관 기간 1년 안): 위와 같이 계산한 금액에서 환불 수수료 10%를 뺀 금액을 환불합니다.","서비스로 받은 곡은 환불 대상이 아닙니다. 계산 결과가 0원 이하면 환불 금액은 없으며, 10원 미만은 버립니다."],"예: 10+5 묶음(10,000원·15곡)을 사고 3곡을 쓴 경우 — 7일 이내: 10,000원 − 3,000원 = 7,000원 환불 / 8일째: 7,000원에서 수수료 10% 뺀 6,300원 환불","환불 요청은 노래방 화면의 「남은 곡 환불 요청」 단추 또는 아래 문의처로 하실 수 있습니다."]},{"h":"4. 노래방 포인트","b":["포인트(1P = 1원)는 유료 포인트(결제로 충전)와 무료 포인트(회사가 무상 지급)로 나누어 기록하며, 충전(지급)일로부터 1년간 사용할 수 있습니다. 유효기간 안에 요청하면 유료 포인트의 유효기간을 3개월 연장합니다(충전일로부터 5년까지).",["구매일로부터 7일 이내: 사용하지 않은 유료 포인트 전부를 수수료 없이 환불합니다(일부를 사용했어도).","구매일로부터 7일이 지난 뒤(유효기간 안): 잔여 유료 포인트에서 10% 이내의 환불 수수료를 공제하고 환불합니다(적용 수수료율은 환불 요청 화면에 표시). 다만 잔여 유료 포인트가 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다.","유효기간이 지난 뒤: 충전일로부터 5년까지 잔여 유료 포인트의 90%를 환불합니다.","무료 포인트는 환불하지 않으며 환불 처리 시 소멸합니다. 10원 미만은 버립니다."],"예: 10,000P를 충전하고 3,000P를 사용한 경우 — 7일 이내: 잔여 7,000P → 7,000원 환불 / 8일째: 잔여 7,000P가 10,000P 이하이므로 1,000원 공제 → 6,000원 환불 / 유효기간이 지난 뒤(충전일부터 5년 안): 7,000P의 90% = 6,300원 환불. 30,000P를 충전하고 10,000P를 사용한 경우 8일째: 잔여 20,000P에서 수수료 10% 공제 → 18,000원 환불","구글 플레이·앱스토어 등 앱 마켓에서 구매한 포인트는 해당 앱 마켓의 환불 규정을 따르며, 앱 마켓에서 환불되면 그 포인트를 지갑에서 차감합니다.","환불 요청은 노래방 「내 지갑 → 환불 요청」 단추 또는 아래 문의처로 하실 수 있습니다."]},{"h":"5. 환불 방법과 문의","b":["환불은 결제한 수단으로 영업일 기준 3~7일 안에 처리됩니다.","문의: 앱 안의 문의 메뉴 또는 이메일 admin@moneypuzzle.co.kr"]}]},"en":{"title":"Refund Policy","eff":"Effective date: ____-__-__","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. Tours and guide services","b":["We follow the Korea Fair Trade Commission's Consumer Dispute Resolution Standards (domestic travel). Refunds depend on when you cancel:",["Cancel up to 5 days before the tour: full refund","Cancel up to 2 days before: 10% of the fee deducted","Cancel 1 day before: 20% of the fee deducted","Cancel on the day or no-show: 30% of the fee deducted"]]},{"h":"2. Cancellation by us or the guide","b":["If the tour is cancelled for reasons on our or the guide's side, including weather or safety, you get a full refund.","For products with a minimum number of participants, if that number is not reached 24 hours before departure, the Company will cancel the contract and refund the full amount paid."]},{"h":"3. Karaoke song pass","b":["The karaoke song pass is a prepaid pass for licensed accompaniment songs in the app's karaoke; one song is deducted for each licensed accompaniment song you sing.",["Storage: songs you buy (including bonus songs) stay in your signed-in account for 1 year from purchase.","Within 7 days of purchase: we refund the amount paid minus the songs used (sung), counted at ₩1,000 per song.","After 7 days (within the 1-year storage period): we refund the amount calculated the same way, minus a 10% refund fee.","Bonus songs are not refundable. If the result is ₩0 or less, there is no refund; amounts are rounded down to ₩10."],"Example: buy the 10+5 pack (₩10,000, 15 songs) and use 3 songs — within 7 days: ₩10,000 − ₩3,000 = ₩7,000 refunded / on day 8: ₩7,000 minus the 10% fee = ₩6,300 refunded.","You can request a refund with the “Request refund for unused songs” button in the karaoke screen or through the contact below."]},{"h":"4. Karaoke points","b":["Points (1P = ₩1) are recorded separately as paid points (topped up by payment) and free points (given by the Company at no charge), and can be used for 1 year from the top-up (or grant) date. If you request it within the validity period, paid points are extended by 3 months (up to 5 years from the top-up date).",["Within 7 days of purchase: all unused paid points are refunded with no fee (even if you used some).","After 7 days (within the validity period): remaining paid points are refunded minus a refund fee of up to 10% (the rate applied is shown on the refund request screen). However, if the remaining paid points are 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund.","After expiry: 90% of the remaining paid points is refunded until 5 years from the top-up date.","Free points are not refunded and expire when a refund is processed. Amounts under ₩10 are dropped."],"Example: top up 10,000P and use 3,000P — within 7 days: 7,000P left → ₩7,000 refunded / on day 8: 7,000P left is 10,000P or less, so ₩1,000 is deducted → ₩6,000 / after expiry (within 5 years of top-up): 90% of 7,000P = ₩6,300. Top up 30,000P and use 10,000P — on day 8: 20,000P left minus a 10% fee → ₩18,000.","Points bought in an app marketplace such as Google Play or the App Store follow that marketplace's refund policy; if the marketplace refunds them, the points are deducted from your wallet.","You can request a refund with “My wallet > Request refund” in the karaoke or through the contact below."]},{"h":"5. How refunds are paid and contact","b":["Refunds are made to your original payment method within 3–7 business days.","Contact: the inquiry menu in the app, or email admin@moneypuzzle.co.kr"]}]},"ja":{"title":"返金規定","eff":"施行日：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. ツアー・ガイド商品","b":["公正取引委員会「消費者紛争解決基準」（国内旅行）に従い、取消時期に応じて次のとおり返金します。",["旅行開始の5日前までの取消：全額返金","2日前までの取消：料金の10%を差し引いて返金","1日前の取消：料金の20%を差し引いて返金","当日取消・不参加：料金の30%を差し引いて返金"]]},{"h":"2. 会社・ガイドの都合による取消","b":["天候・安全上の理由を含め、会社またはガイドの都合でツアーが中止になった場合は全額返金します。","最少催行人員が定められた商品は、出発の24時間前までに人数に達しない場合、当社が契約を取り消し、受け取った代金の全額を返金します。"]},{"h":"3. カラオケ曲チケット","b":["カラオケ曲チケットは、アプリ内カラオケの正式な伴奏曲に使う前払いチケットで、正式な伴奏曲を1曲歌うたびに1曲分差し引かれます。",["保管：購入した曲（サービス曲を含む）はログインしたアカウントに購入日から1年間保管されます。","購入日から7日以内：支払額から、使った（歌った）曲を1曲1,000ウォンとして差し引いた金額を返金します。","7日を過ぎた後（保管期間1年以内）：同じ方法で計算した金額から返金手数料10%を差し引いた金額を返金します。","サービス曲は返金の対象外です。計算結果が0ウォン以下の場合は返金額はなく、10ウォン未満は切り捨てます。"],"例：10+5パック（10,000ウォン・15曲）を購入し3曲使った場合 — 7日以内：10,000ウォン − 3,000ウォン = 7,000ウォンを返金／8日目：7,000ウォンから手数料10%を引いた6,300ウォンを返金。","返金の申請は、カラオケ画面の「残り曲の返金を申請」ボタンまたは下記お問い合わせ先から行えます。"]},{"h":"4. カラオケポイント","b":["ポイント（1P＝1ウォン）は有料ポイント（決済でチャージ）と無料ポイント（当社が無償付与）に分けて記録し、チャージ（付与）日から1年間使用できます。有効期限内に申請すると、有料ポイントの有効期限を3か月延長します（チャージ日から5年まで）。",["購入日から7日以内：未使用の有料ポイントを手数料なしで全額返金します（一部を使っていても）。","購入日から7日経過後（有効期限内）：残りの有料ポイントから10%以内の返金手数料を差し引いて返金します（適用率は返金申請画面に表示）。ただし、残りの有料ポイントが10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。","有効期限経過後：チャージ日から5年まで、残りの有料ポイントの90%を返金します。","無料ポイントは返金せず、返金処理時に消滅します。10ウォン未満は切り捨てます。"],"例：10,000Pをチャージして3,000Pを使った場合 — 7日以内：残り7,000P → 7,000ウォン返金／8日目：残り7,000Pが10,000P以下のため1,000ウォン差引 → 6,000ウォン／有効期限経過後（チャージ日から5年以内）：7,000Pの90%＝6,300ウォン。30,000Pをチャージして10,000Pを使った場合の8日目：残り20,000Pから手数料10%を差引 → 18,000ウォン","Google Play・App Storeなどのアプリマーケットで購入したポイントは、そのマーケットの返金規定に従い、マーケットで返金された場合はウォレットから差し引きます。","返金申請はカラオケの「マイウォレット → 返金申請」または下記お問い合わせ先からできます。"]},{"h":"5. 返金方法・お問い合わせ","b":["返金は決済した手段で、営業日3～7日以内に行います。","お問い合わせ：アプリ内のお問い合わせメニュー、またはメール admin@moneypuzzle.co.kr"]}]},"zhs":{"title":"退款规定","eff":"施行日期：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 旅游·向导产品","b":["依据韩国公平交易委员会《消费者纠纷解决标准》（国内旅行），按取消时间退款如下：",["出发前5天及以前取消：全额退款","出发前2天及以前取消：扣除费用的10%后退款","出发前1天取消：扣除费用的20%后退款","当天取消或未参加：扣除费用的30%后退款"]]},{"h":"2. 因公司或向导原因取消","b":["因公司或向导原因（包括天气、安全问题）取消行程时，全额退款。","设有最少成团人数的商品，如在出发前24小时仍未达到该人数，本公司将取消合同并全额退还已收款项。"]},{"h":"3. 卡拉OK点歌券","b":["卡拉OK点歌券是用于应用内卡拉OK正式伴奏歌曲的预付券，每演唱一首正式伴奏歌曲扣除一首点歌券。",["保存：购买的歌曲（含赠送歌曲）自购买日起在已登录的账户中保留1年。","购买后7天内：退还支付金额减去已使用（已唱）歌曲（每首按₩1,000计算）后的金额。","超过7天后（1年保存期内）：按同样方法计算的金额再扣除10%退款手续费后退还。","赠送歌曲不在退款范围内。计算结果为₩0或以下时不予退款，不足₩10舍去。"],"例：购买10+5套餐（₩10,000·15首）并用了3首 — 7天内：₩10,000 − ₩3,000 = ₩7,000 退款 / 第8天：₩7,000 扣除10%手续费后退款 ₩6,300。","可通过卡拉OK页面的“申请退还剩余歌曲”按钮或下方联系方式申请退款。"]},{"h":"4. 卡拉OK积分","b":["积分（1P = 1韩元）分为付费积分（付款充值）和免费积分（本公司无偿赠送）分别记录，自充值（赠送）之日起1年内可用。在有效期内申请的，付费积分有效期延长3个月（最长至充值日起5年）。",["购买之日起7日内：未使用的付费积分免手续费全额退还（即使已使用部分）。","购买满7日后（有效期内）：从剩余付费积分中扣除不超过10%的退款手续费后退还（适用费率显示在退款申请页面）。但剩余付费积分在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。","有效期届满后：自充值之日起5年内，退还剩余付费积分的90%。","免费积分不予退款，并在退款处理时失效。不足10韩元的部分舍去。"],"例：充值10,000P并使用3,000P — 7日内：剩余7,000P → 退还7,000韩元／第8天：剩余7,000P在10,000P以下，扣除1,000韩元 → 6,000韩元／有效期届满后（充值起5年内）：7,000P的90% = 6,300韩元。充值30,000P并使用10,000P，第8天：剩余20,000P扣除10%手续费 → 18,000韩元","在 Google Play、App Store 等应用市场购买的积分按该市场的退款规定办理；市场退款后，将从钱包中扣除相应积分。","可通过卡拉OK的“我的钱包 → 申请退款”或下方联系方式申请退款。"]},{"h":"5. 退款方式与咨询","b":["退款将通过原支付方式在3～7个工作日内办理。","咨询：应用内咨询菜单，或邮箱 admin@moneypuzzle.co.kr"]}]},"zht":{"title":"退款規定","eff":"施行日期：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 旅遊·嚮導產品","b":["依據韓國公平交易委員會《消費者紛爭解決標準》（國內旅行），按取消時間退款如下：",["出發前5天及以前取消：全額退款","出發前2天及以前取消：扣除費用的10%後退款","出發前1天取消：扣除費用的20%後退款","當天取消或未參加：扣除費用的30%後退款"]]},{"h":"2. 因公司或嚮導原因取消","b":["因公司或嚮導原因（包括天氣、安全問題）取消行程時，全額退款。","設有最少成團人數的商品，如在出發前24小時仍未達到該人數，本公司將取消合約並全額退還已收款項。"]},{"h":"3. 卡拉OK點歌券","b":["卡拉OK點歌券是用於應用程式內卡拉OK正式伴奏歌曲的預付券，每演唱一首正式伴奏歌曲扣除一首點歌券。",["保存：購買的歌曲（含贈送歌曲）自購買日起在已登入的帳戶中保留1年。","購買後7天內：退還付款金額減去已使用（已唱）歌曲（每首按₩1,000計算）後的金額。","超過7天後（1年保存期內）：按同樣方法計算的金額再扣除10%退款手續費後退還。","贈送歌曲不在退款範圍內。計算結果為₩0或以下時不予退款，不足₩10捨去。"],"例：購買10+5套餐（₩10,000·15首）並用了3首 — 7天內：₩10,000 − ₩3,000 = ₩7,000 退款 / 第8天：₩7,000 扣除10%手續費後退款 ₩6,300。","可透過卡拉OK頁面的「申請退還剩餘歌曲」按鈕或下方聯絡方式申請退款。"]},{"h":"4. 卡拉OK點數","b":["點數（1P = 1韓元）分為付費點數（付款儲值）與免費點數（本公司無償贈送）分別記錄，自儲值（贈送）之日起1年內可用。在有效期內申請者，付費點數有效期延長3個月（最長至儲值日起5年）。",["購買之日起7日內：未使用的付費點數免手續費全額退還（即使已使用部分）。","購買滿7日後（有效期內）：從剩餘付費點數中扣除不超過10%的退款手續費後退還（適用費率顯示在退款申請頁面）。但剩餘付費點數在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。","有效期屆滿後：自儲值之日起5年內，退還剩餘付費點數的90%。","免費點數不予退款，並於退款處理時失效。未滿10韓元的部分捨去。"],"例：儲值10,000P並使用3,000P — 7日內：剩餘7,000P → 退還7,000韓元／第8天：剩餘7,000P在10,000P以下，扣除1,000韓元 → 6,000韓元／有效期屆滿後（儲值起5年內）：7,000P的90% = 6,300韓元。儲值30,000P並使用10,000P，第8天：剩餘20,000P扣除10%手續費 → 18,000韓元","在 Google Play、App Store 等應用程式市集購買的點數依該市集的退款規定辦理；市集退款後，將從錢包中扣除相應點數。","可透過卡拉OK的「我的錢包 → 申請退款」或下方聯絡方式申請退款。"]},{"h":"5. 退款方式與諮詢","b":["退款將透過原付款方式於3～7個工作天內辦理。","諮詢：應用程式內的諮詢選單，或電郵 admin@moneypuzzle.co.kr"]}]},"es":{"title":"Política de reembolso","eff":"Fecha de entrada en vigor: ____-__-__","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. Tours y servicios de guía","b":["Seguimos los Estándares de Resolución de Disputas de Consumo de la Comisión de Comercio Justo de Corea (viajes nacionales). El reembolso depende de cuándo canceles:",["Hasta 5 días antes del tour: reembolso total","Hasta 2 días antes: se descuenta el 10% del precio","1 día antes: se descuenta el 20% del precio","El mismo día o si no te presentas: se descuenta el 30% del precio"]]},{"h":"2. Cancelación por nuestra parte o del guía","b":["Si el tour se cancela por motivos nuestros o del guía, incluidos el clima o la seguridad, el reembolso es total.","En los productos con un número mínimo de participantes, si no se alcanza 24 horas antes de la salida, la Empresa cancelará el contrato y reembolsará el importe íntegro pagado."]},{"h":"3. Bono de canciones de karaoke","b":["El bono de canciones es un bono prepago para las canciones con acompañamiento con licencia del karaoke de la app; se descuenta una canción del bono por cada canción con acompañamiento con licencia que se cante.",["Conservación: las canciones compradas (incluidas las de regalo) se guardan en tu cuenta durante 1 año desde la compra.","En los 7 días siguientes a la compra: reembolsamos el importe pagado menos las canciones usadas (cantadas), a ₩1,000 por canción.","Pasados 7 días (dentro del año de conservación): reembolsamos el importe calculado igual, menos una comisión de reembolso del 10%.","Las canciones de regalo no son reembolsables. Si el resultado es ₩0 o menos, no hay reembolso; se redondea a la baja a ₩10."],"Ejemplo: compras el pack 10+5 (₩10,000, 15 canciones) y usas 3 — en 7 días: ₩10,000 − ₩3,000 = ₩7,000 de reembolso / el día 8: ₩7,000 menos la comisión del 10% = ₩6,300 de reembolso.","Puedes pedir el reembolso con el botón «Solicitar reembolso de canciones» de la pantalla de karaoke o por el contacto de abajo."]},{"h":"4. Puntos de karaoke","b":["Los puntos (1P = ₩1) se registran por separado como puntos de pago (recargados con pago) y puntos gratis (dados por la Empresa sin coste), y pueden usarse durante 1 año desde la recarga (o entrega). Si lo solicitas dentro del período de validez, los puntos de pago se amplían 3 meses (hasta 5 años desde la recarga).",["En los 7 días siguientes a la compra: todos los puntos de pago no usados se reembolsan sin comisión (aunque hayas usado parte).","Pasados 7 días (dentro del período de validez): se reembolsan los puntos de pago restantes menos una comisión de hasta el 10% (la tasa aplicada se muestra en la pantalla de solicitud). No obstante, si los puntos de pago restantes son 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso.","Después de caducar: se reembolsa el 90% de los puntos de pago restantes hasta 5 años desde la recarga.","Los puntos gratis no se reembolsan y caducan al procesar un reembolso. Se descartan los importes inferiores a ₩10."],"Ejemplo: recargas 10.000P y usas 3.000P — en 7 días: quedan 7.000P → reembolso de ₩7.000 / el día 8: quedan 7.000P (10.000P o menos), se descuentan ₩1.000 → ₩6.000 / tras caducar (en 5 años desde la recarga): 90% de 7.000P = ₩6.300. Recargas 30.000P y usas 10.000P — el día 8: 20.000P restantes menos un 10% de comisión → ₩18.000.","Los puntos comprados en una tienda de apps como Google Play o App Store siguen la política de reembolso de esa tienda; si la tienda los reembolsa, se descuentan de tu monedero.","Puedes solicitar el reembolso con «Mi monedero > Solicitar reembolso» en el karaoke o en el contacto de abajo."]},{"h":"5. Forma de reembolso y contacto","b":["El reembolso se hace al medio de pago original en 3–7 días hábiles.","Contacto: menú de consultas de la app o correo admin@moneypuzzle.co.kr"]}]}};
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://navi.moneypuzzle.co.kr/?lang="+lang;
  document.title=d.title+" · Money Puzzle Tour for Korea";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
