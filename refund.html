var D={"ko":{"title":"환불 규정","eff":"시행일:      년    월    일","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 투어·가이드 상품","b":["공정거래위원회 「소비자분쟁해결기준」(국내여행)을 따릅니다. 취소 시점에 따라 아래와 같이 환불합니다.",["여행 시작 5일 전까지 취소: 전액 환불","여행 시작 2일 전까지 취소: 요금의 10% 공제 후 환불","여행 시작 1일 전 취소: 요금의 20% 공제 후 환불","여행 당일 취소 또는 불참: 요금의 30% 공제 후 환불"]]},{"h":"2. 회사·가이드 사정으로 취소되는 경우","b":["날씨·안전 문제를 포함해 회사 또는 가이드의 사정으로 투어가 취소되면 전액 환불합니다.","최소 출발 인원이 있는 상품은 출발 24시간 전까지 인원이 차지 않으면 회사가 계약을 취소하고 받은 금액 전액을 환불합니다."]},{"h":"3. 노래방 이용권","b":["노래방 이용권은 포인트로 구매하는 기간제 이용권입니다(1개월 7,000P · 3개월 17,000P · 6개월 30,000P · 12개월 50,000P). 기간에는 노래를 무제한으로 부를 수 있으며, 자동으로 연장되지 않습니다.",["구매일로부터 7일 이내이고 노래를 부르지 않은 경우: 전액 환불합니다.","그 밖의 경우: 남은 일수에 해당하는 금액에서 그 금액의 10%를 공제하고 환불합니다(콘텐츠이용자보호지침, 소비자분쟁해결기준의 계속거래 기준: 이용일수에 해당하는 금액과 잔여 금액의 10% 공제). 10P 미만은 버립니다.","환불은 이용권 구매에 사용한 유료 포인트 몫만 결제한 수단으로 영업일 기준 3~7일 안에 환불하며(1P = 1원), 무료 포인트로 산 몫은 환불하지 않습니다. 이 금액에서 포인트 환불 수수료를 다시 공제하지 않으며, 앱 마켓에서 충전한 포인트로 산 몫은 해당 앱 마켓의 환불 규정을 따릅니다. 환불을 요청하면 이용권은 바로 끝납니다.","이용 중에 다시 구매해 이어진 기간이 있으면 남은 기간 전부를 함께 계산합니다."],"예: 1개월 이용권(7,000P · 30일, 모두 유료 포인트)을 사고 노래를 부른 뒤 10일째 환불 — 남은 20일 금액 4,666원에서 10% 공제 → 4,200원 환불 / 7일 이내이고 노래를 부르지 않았으면 7,000원 전액 환불","환불 요청은 노래방 PAYMENT 창의 「이용권 환불」 단추 또는 아래 문의처로 하실 수 있습니다."]},{"h":"4. 노래방 포인트","b":["포인트(1P = 1원)는 유료 포인트(결제로 충전)와 무료 포인트(회사가 무상 지급)로 나누어 기록하며, 충전(지급)일로부터 1년간 사용할 수 있습니다. 유효기간 안에 요청하면 유료 포인트의 유효기간을 3개월 연장합니다(충전일로부터 5년까지).",["구매일로부터 7일 이내: 사용하지 않은 유료 포인트 전부를 수수료 없이 환불합니다(일부를 사용했어도).","구매일로부터 7일이 지난 뒤(유효기간 안): 잔여 유료 포인트에서 10% 이내의 환불 수수료를 공제하고 환불합니다(적용 수수료율은 환불 요청 화면에 표시). 다만 잔여 유료 포인트가 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다.","유효기간이 지난 뒤: 충전일로부터 5년까지 잔여 유료 포인트의 90%를 환불합니다.","무료 포인트는 환불하지 않으며 환불 처리 시 소멸합니다. 10원 미만은 버립니다."],"예: 10,000P를 충전하고 3,000P를 사용한 경우 — 7일 이내: 잔여 7,000P → 7,000원 환불 / 8일째: 잔여 7,000P가 10,000P 이하이므로 1,000원 공제 → 6,000원 환불 / 유효기간이 지난 뒤(충전일부터 5년 안): 7,000P의 90% = 6,300원 환불. 30,000P를 충전하고 10,000P를 사용한 경우 8일째: 잔여 20,000P에서 수수료 10% 공제 → 18,000원 환불","구글 플레이·앱스토어 등 앱 마켓에서 구매한 포인트는 해당 앱 마켓의 환불 규정을 따르며, 앱 마켓에서 환불되면 그 포인트를 지갑에서 차감합니다.","환불 요청은 노래방 「내 지갑 → 환불 요청」 단추 또는 아래 문의처로 하실 수 있습니다."]},{"h":"5. 이전에 구매한 곡 이용권 (판매 종료)","b":["곡 이용권은 더 이상 판매하지 않으며, 이미 구매한 곡 이용권(잔여 곡)은 그대로 유효합니다. 잔여 곡은 로그인한 계정에 구매일로부터 1년간 보관되며, 환불은 아래와 같습니다.",["구매일로부터 7일 이내: 결제 금액에서 사용한(부른) 곡을 1곡 1,000원으로 계산해 뺀 금액을 환불합니다.","7일이 지난 뒤(보관 기간 1년 안): 위와 같이 계산한 금액에서 환불 수수료 10%를 뺀 금액을 환불합니다.","서비스로 받은 곡은 환불 대상이 아닙니다. 계산 결과가 0원 이하면 환불 금액은 없으며, 10원 미만은 버립니다."],"환불 요청은 노래방 화면의 「남은 곡 환불 요청」 단추 또는 아래 문의처로 하실 수 있습니다."]},{"h":"6. 환불 방법과 문의","b":["환불은 결제한 수단으로 영업일 기준 3~7일 안에 처리됩니다.","문의: 앱 안의 문의 메뉴 또는 이메일 admin@moneypuzzle.co.kr"]}]},"en":{"title":"Refund Policy","eff":"Effective date: ____-__-__","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. Tours and guide services","b":["We follow the Korea Fair Trade Commission's Consumer Dispute Resolution Standards (domestic travel). Refunds depend on when you cancel:",["Cancel up to 5 days before the tour: full refund","Cancel up to 2 days before: 10% of the fee deducted","Cancel 1 day before: 20% of the fee deducted","Cancel on the day or no-show: 30% of the fee deducted"]]},{"h":"2. Cancellation by us or the guide","b":["If the tour is cancelled for reasons on our or the guide's side, including weather or safety, you get a full refund.","For products with a minimum number of participants, if that number is not reached 24 hours before departure, the Company will cancel the contract and refund the full amount paid."]},{"h":"3. Karaoke pass","b":["A karaoke pass is a time-based pass bought with points (1 month 7,000P · 3 months 17,000P · 6 months 30,000P · 12 months 50,000P). You can sing without limit during the pass, and it does not renew automatically.",["Within 7 days of purchase and you have not sung: full refund.","All other cases: the amount for the remaining days minus 10% of that amount (Content User Protection Guidelines; Consumer Dispute Resolution Standards for continuous transactions: the amount for the days used plus 10% of the remainder is deducted). Amounts under 10P are rounded down.","Refunds are paid to your original payment method within 3–7 business days for the paid-point share only (1P = ₩1); the share bought with free points is not refunded. No points refund fee is deducted again, and the share bought with points topped up in an app market follows that market's refund policy. The pass ends as soon as you request the refund.","If you extended the pass by buying again, all remaining periods are calculated together."],"Example: buy a 1-month pass (7,000P · 30 days, all paid points), sing, and ask for a refund on day 10 — ₩4,666 for the remaining 20 days minus 10% → ₩4,200 refunded / within 7 days and without singing: the full ₩7,000","You can request a refund with the “Pass refund” button in the karaoke PAYMENT window or through the contact below."]},{"h":"4. Karaoke points","b":["Points (1P = ₩1) are recorded separately as paid points (topped up by payment) and free points (given by the Company at no charge), and can be used for 1 year from the top-up (or grant) date. If you request it within the validity period, paid points are extended by 3 months (up to 5 years from the top-up date).",["Within 7 days of purchase: all unused paid points are refunded with no fee (even if you used some).","After 7 days (within the validity period): remaining paid points are refunded minus a refund fee of up to 10% (the rate applied is shown on the refund request screen). However, if the remaining paid points are 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund.","After expiry: 90% of the remaining paid points is refunded until 5 years from the top-up date.","Free points are not refunded and expire when a refund is processed. Amounts under ₩10 are dropped."],"Example: top up 10,000P and use 3,000P — within 7 days: 7,000P left → ₩7,000 refunded / on day 8: 7,000P left is 10,000P or less, so ₩1,000 is deducted → ₩6,000 / after expiry (within 5 years of top-up): 90% of 7,000P = ₩6,300. Top up 30,000P and use 10,000P — on day 8: 20,000P left minus a 10% fee → ₩18,000.","Points bought in an app marketplace such as Google Play or the App Store follow that marketplace's refund policy; if the marketplace refunds them, the points are deducted from your wallet.","You can request a refund with “My wallet > Request refund” in the karaoke or through the contact below."]},{"h":"5. Song passes bought before (no longer sold)","b":["Song passes are no longer sold, and song passes you already bought (songs left) remain valid. Songs left are kept in your account for 1 year from purchase, and refunds work as follows.",["Within 7 days of purchase: we refund the amount paid minus the songs used (sung), counted at ₩1,000 per song.","After 7 days (within the 1-year storage period): we refund the amount calculated the same way, minus a 10% refund fee.","Bonus songs are not refundable. If the result is ₩0 or less, there is no refund; amounts are rounded down to ₩10."],"You can request a refund with the “Request refund for unused songs” button in the karaoke screen or through the contact below."]},{"h":"6. How refunds are paid and contact","b":["Refunds are made to your original payment method within 3–7 business days.","Contact: the inquiry menu in the app, or email admin@moneypuzzle.co.kr"]}]},"ja":{"title":"返金規定","eff":"施行日：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. ツアー・ガイド商品","b":["公正取引委員会「消費者紛争解決基準」（国内旅行）に従い、取消時期に応じて次のとおり返金します。",["旅行開始の5日前までの取消：全額返金","2日前までの取消：料金の10%を差し引いて返金","1日前の取消：料金の20%を差し引いて返金","当日取消・不参加：料金の30%を差し引いて返金"]]},{"h":"2. 会社・ガイドの都合による取消","b":["天候・安全上の理由を含め、会社またはガイドの都合でツアーが中止になった場合は全額返金します。","最少催行人員が定められた商品は、出発の24時間前までに人数に達しない場合、当社が契約を取り消し、受け取った代金の全額を返金します。"]},{"h":"3. カラオケ利用券","b":["カラオケ利用券はポイントで購入する期間制の利用券です（1か月7,000P・3か月17,000P・6か月30,000P・12か月50,000P）。期間中は歌い放題で、自動で延長されません。",["購入日から7日以内で、まだ歌っていない場合：全額を返金します。","それ以外の場合：残り日数分の金額からその10%を差し引いて返金します（コンテンツ利用者保護指針、消費者紛争解決基準の継続取引基準：利用日数分の金額と残額の10%を差し引き）。10P未満は切り捨てます。","返金は、利用券の購入に使った有料ポイント分のみを決済した手段で営業日3〜7日以内に返金し（1P＝1ウォン）、無料ポイントで購入した分は返金しません。ポイントの返金手数料を再び差し引くことはなく、アプリマーケットでチャージしたポイントで購入した分はそのマーケットの返金規定に従います。返金を申請すると利用券はすぐに終了します。","利用中にもう一度購入して続いた期間がある場合は、残りの期間をすべて合わせて計算します。"],"例：1か月の利用券（7,000P・30日、すべて有料ポイント）を購入して歌い、10日目に返金 — 残り20日分 4,666ウォンから10%を差し引き → 4,200ウォン返金／7日以内でまだ歌っていなければ 7,000ウォン全額","返金申請はカラオケのPAYMENT画面の「利用券の返金」ボタン、または下記のお問い合わせ先からできます。"]},{"h":"4. カラオケポイント","b":["ポイント（1P＝1ウォン）は有料ポイント（決済でチャージ）と無料ポイント（当社が無償付与）に分けて記録し、チャージ（付与）日から1年間使用できます。有効期限内に申請すると、有料ポイントの有効期限を3か月延長します（チャージ日から5年まで）。",["購入日から7日以内：未使用の有料ポイントを手数料なしで全額返金します（一部を使っていても）。","購入日から7日経過後（有効期限内）：残りの有料ポイントから10%以内の返金手数料を差し引いて返金します（適用率は返金申請画面に表示）。ただし、残りの有料ポイントが10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。","有効期限経過後：チャージ日から5年まで、残りの有料ポイントの90%を返金します。","無料ポイントは返金せず、返金処理時に消滅します。10ウォン未満は切り捨てます。"],"例：10,000Pをチャージして3,000Pを使った場合 — 7日以内：残り7,000P → 7,000ウォン返金／8日目：残り7,000Pが10,000P以下のため1,000ウォン差引 → 6,000ウォン／有効期限経過後（チャージ日から5年以内）：7,000Pの90%＝6,300ウォン。30,000Pをチャージして10,000Pを使った場合の8日目：残り20,000Pから手数料10%を差引 → 18,000ウォン","Google Play・App Storeなどのアプリマーケットで購入したポイントは、そのマーケットの返金規定に従い、マーケットで返金された場合はウォレットから差し引きます。","返金申請はカラオケの「マイウォレット → 返金申請」または下記お問い合わせ先からできます。"]},{"h":"5. 以前に購入した曲チケット（販売終了）","b":["曲チケットの販売は終了しましたが、購入済みの曲チケット（残り曲）はそのまま有効です。残り曲はログインしたアカウントに購入日から1年間保管され、返金は次のとおりです。",["購入日から7日以内：支払額から、使った（歌った）曲を1曲1,000ウォンとして差し引いた金額を返金します。","7日を過ぎた後（保管期間1年以内）：同じ方法で計算した金額から返金手数料10%を差し引いた金額を返金します。","サービス曲は返金の対象外です。計算結果が0ウォン以下の場合は返金額はなく、10ウォン未満は切り捨てます。"],"返金の申請は、カラオケ画面の「残り曲の返金を申請」ボタンまたは下記お問い合わせ先から行えます。"]},{"h":"6. 返金方法・お問い合わせ","b":["返金は決済した手段で、営業日3～7日以内に行います。","お問い合わせ：アプリ内のお問い合わせメニュー、またはメール admin@moneypuzzle.co.kr"]}]},"zhs":{"title":"退款规定","eff":"施行日期：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 旅游·向导产品","b":["依据韩国公平交易委员会《消费者纠纷解决标准》（国内旅行），按取消时间退款如下：",["出发前5天及以前取消：全额退款","出发前2天及以前取消：扣除费用的10%后退款","出发前1天取消：扣除费用的20%后退款","当天取消或未参加：扣除费用的30%后退款"]]},{"h":"2. 因公司或向导原因取消","b":["因公司或向导原因（包括天气、安全问题）取消行程时，全额退款。","设有最少成团人数的商品，如在出发前24小时仍未达到该人数，本公司将取消合同并全额退还已收款项。"]},{"h":"3. 卡拉OK畅唱券","b":["卡拉OK畅唱券是用积分购买的期限制畅唱券（1个月7,000P · 3个月17,000P · 6个月30,000P · 12个月50,000P）。有效期内可无限唱歌，不会自动续期。",["购买之日起7天内且未唱歌：全额退款。","其他情况：退还剩余天数对应金额扣除该金额10%后的金额（依据《内容用户保护指南》及《消费者纠纷解决标准》的持续交易标准：扣除已使用天数金额及剩余金额的10%）。不足10P的舍去。","退款仅将购买畅唱券时使用的付费积分部分在3–7个工作日内退回原支付方式（1P = 1韩元），用免费积分购买的部分不予退款。不会再次扣除积分退款手续费，用应用商店充值的积分购买的部分按该商店的退款规定办理。申请退款后畅唱券立即结束。","使用中再次购买而接续的期间，将与剩余期间一并计算。"],"例：购买1个月畅唱券（7,000P · 30天，全部为付费积分）并唱歌后，第10天申请退款 — 剩余20天金额 4,666韩元 扣除10% → 退还 4,200韩元／7天内且未唱歌则全额退还 7,000韩元","可通过卡拉OK PAYMENT 窗口的「畅唱券退款」按钮或下方联系方式申请退款。"]},{"h":"4. 卡拉OK积分","b":["积分（1P = 1韩元）分为付费积分（付款充值）和免费积分（本公司无偿赠送）分别记录，自充值（赠送）之日起1年内可用。在有效期内申请的，付费积分有效期延长3个月（最长至充值日起5年）。",["购买之日起7日内：未使用的付费积分免手续费全额退还（即使已使用部分）。","购买满7日后（有效期内）：从剩余付费积分中扣除不超过10%的退款手续费后退还（适用费率显示在退款申请页面）。但剩余付费积分在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。","有效期届满后：自充值之日起5年内，退还剩余付费积分的90%。","免费积分不予退款，并在退款处理时失效。不足10韩元的部分舍去。"],"例：充值10,000P并使用3,000P — 7日内：剩余7,000P → 退还7,000韩元／第8天：剩余7,000P在10,000P以下，扣除1,000韩元 → 6,000韩元／有效期届满后（充值起5年内）：7,000P的90% = 6,300韩元。充值30,000P并使用10,000P，第8天：剩余20,000P扣除10%手续费 → 18,000韩元","在 Google Play、App Store 等应用市场购买的积分按该市场的退款规定办理；市场退款后，将从钱包中扣除相应积分。","可通过卡拉OK的“我的钱包 → 申请退款”或下方联系方式申请退款。"]},{"h":"5. 此前购买的点歌券（已停售）","b":["点歌券已停止销售，已购买的点歌券（剩余歌曲）继续有效。剩余歌曲自购买日起在登录账户中保留1年，退款如下。",["购买后7天内：退还支付金额减去已使用（已唱）歌曲（每首按₩1,000计算）后的金额。","超过7天后（1年保存期内）：按同样方法计算的金额再扣除10%退款手续费后退还。","赠送歌曲不在退款范围内。计算结果为₩0或以下时不予退款，不足₩10舍去。"],"可通过卡拉OK页面的“申请退还剩余歌曲”按钮或下方联系方式申请退款。"]},{"h":"6. 退款方式与咨询","b":["退款将通过原支付方式在3～7个工作日内办理。","咨询：应用内咨询菜单，或邮箱 admin@moneypuzzle.co.kr"]}]},"zht":{"title":"退款規定","eff":"施行日期：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 旅遊·嚮導產品","b":["依據韓國公平交易委員會《消費者紛爭解決標準》（國內旅行），按取消時間退款如下：",["出發前5天及以前取消：全額退款","出發前2天及以前取消：扣除費用的10%後退款","出發前1天取消：扣除費用的20%後退款","當天取消或未參加：扣除費用的30%後退款"]]},{"h":"2. 因公司或嚮導原因取消","b":["因公司或嚮導原因（包括天氣、安全問題）取消行程時，全額退款。","設有最少成團人數的商品，如在出發前24小時仍未達到該人數，本公司將取消合約並全額退還已收款項。"]},{"h":"3. 卡拉OK暢唱券","b":["卡拉OK暢唱券是以點數購買的期限制暢唱券（1個月7,000P · 3個月17,000P · 6個月30,000P · 12個月50,000P）。有效期內可無限唱歌，不會自動續期。",["購買之日起7天內且未唱歌：全額退款。","其他情況：退還剩餘天數對應金額扣除該金額10%後的金額（依據《內容使用者保護指南》及《消費者紛爭解決標準》之持續交易標準：扣除已使用天數金額及剩餘金額的10%）。不足10P者捨去。","退款僅將購買暢唱券時使用的付費點數部分於3–7個工作天內退回原付款方式（1P = 1韓元），以免費點數購買的部分不予退款。不會再次扣除點數退款手續費，以應用商店儲值的點數購買的部分依該商店的退款規定辦理。申請退款後暢唱券立即結束。","使用中再次購買而接續的期間，將與剩餘期間一併計算。"],"例：購買1個月暢唱券（7,000P · 30天，全部為付費點數）並唱歌後，第10天申請退款 — 剩餘20天金額 4,666韓元 扣除10% → 退還 4,200韓元／7天內且未唱歌則全額退還 7,000韓元","可透過卡拉OK PAYMENT 視窗的「暢唱券退款」按鈕或下方聯絡方式申請退款。"]},{"h":"4. 卡拉OK點數","b":["點數（1P = 1韓元）分為付費點數（付款儲值）與免費點數（本公司無償贈送）分別記錄，自儲值（贈送）之日起1年內可用。在有效期內申請者，付費點數有效期延長3個月（最長至儲值日起5年）。",["購買之日起7日內：未使用的付費點數免手續費全額退還（即使已使用部分）。","購買滿7日後（有效期內）：從剩餘付費點數中扣除不超過10%的退款手續費後退還（適用費率顯示在退款申請頁面）。但剩餘付費點數在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。","有效期屆滿後：自儲值之日起5年內，退還剩餘付費點數的90%。","免費點數不予退款，並於退款處理時失效。未滿10韓元的部分捨去。"],"例：儲值10,000P並使用3,000P — 7日內：剩餘7,000P → 退還7,000韓元／第8天：剩餘7,000P在10,000P以下，扣除1,000韓元 → 6,000韓元／有效期屆滿後（儲值起5年內）：7,000P的90% = 6,300韓元。儲值30,000P並使用10,000P，第8天：剩餘20,000P扣除10%手續費 → 18,000韓元","在 Google Play、App Store 等應用程式市集購買的點數依該市集的退款規定辦理；市集退款後，將從錢包中扣除相應點數。","可透過卡拉OK的「我的錢包 → 申請退款」或下方聯絡方式申請退款。"]},{"h":"5. 此前購買的點歌券（已停售）","b":["點歌券已停止銷售，已購買的點歌券（剩餘歌曲）繼續有效。剩餘歌曲自購買日起於登入帳戶中保留1年，退款如下。",["購買後7天內：退還付款金額減去已使用（已唱）歌曲（每首按₩1,000計算）後的金額。","超過7天後（1年保存期內）：按同樣方法計算的金額再扣除10%退款手續費後退還。","贈送歌曲不在退款範圍內。計算結果為₩0或以下時不予退款，不足₩10捨去。"],"可透過卡拉OK頁面的「申請退還剩餘歌曲」按鈕或下方聯絡方式申請退款。"]},{"h":"6. 退款方式與諮詢","b":["退款將透過原付款方式於3～7個工作天內辦理。","諮詢：應用程式內的諮詢選單，或電郵 admin@moneypuzzle.co.kr"]}]},"es":{"title":"Política de reembolso","eff":"Fecha de entrada en vigor: ____-__-__","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. Tours y servicios de guía","b":["Seguimos los Estándares de Resolución de Disputas de Consumo de la Comisión de Comercio Justo de Corea (viajes nacionales). El reembolso depende de cuándo canceles:",["Hasta 5 días antes del tour: reembolso total","Hasta 2 días antes: se descuenta el 10% del precio","1 día antes: se descuenta el 20% del precio","El mismo día o si no te presentas: se descuenta el 30% del precio"]]},{"h":"2. Cancelación por nuestra parte o del guía","b":["Si el tour se cancela por motivos nuestros o del guía, incluidos el clima o la seguridad, el reembolso es total.","En los productos con un número mínimo de participantes, si no se alcanza 24 horas antes de la salida, la Empresa cancelará el contrato y reembolsará el importe íntegro pagado."]},{"h":"3. Bono de karaoke","b":["El bono de karaoke es un bono por tiempo que se compra con puntos (1 mes 7,000P · 3 meses 17,000P · 6 meses 30,000P · 12 meses 50,000P). Durante el bono puedes cantar sin límite y no se renueva automáticamente.",["En los 7 días siguientes a la compra y si no has cantado: reembolso completo.","En los demás casos: el importe de los días restantes menos el 10% de ese importe (Directrices de protección de usuarios de contenidos; Normas de resolución de litigios de consumo para transacciones continuas: se descuentan el importe de los días usados y el 10% del resto). Se redondea a la baja a 10P.","El reembolso se paga a tu método de pago original en 3–7 días hábiles solo por la parte pagada con puntos de pago (1P = ₩1); la parte comprada con puntos gratuitos no se reembolsa. No se vuelve a descontar la comisión de reembolso de puntos, y la parte comprada con puntos recargados en una tienda de apps sigue la política de esa tienda. El bono termina en cuanto pides el reembolso.","Si ampliaste el bono comprando otro, se calculan juntos todos los periodos restantes."],"Ejemplo: compras un bono de 1 mes (7,000P · 30 días, todo con puntos de pago), cantas y pides el reembolso el día 10 — ₩4,666 por los 20 días restantes menos el 10% → ₩4,200 de reembolso / en 7 días y sin cantar: los ₩7,000 completos","Puedes pedir el reembolso con el botón «Reembolso del bono» de la ventana PAYMENT del karaoke o por el contacto de abajo."]},{"h":"4. Puntos de karaoke","b":["Los puntos (1P = ₩1) se registran por separado como puntos de pago (recargados con pago) y puntos gratis (dados por la Empresa sin coste), y pueden usarse durante 1 año desde la recarga (o entrega). Si lo solicitas dentro del período de validez, los puntos de pago se amplían 3 meses (hasta 5 años desde la recarga).",["En los 7 días siguientes a la compra: todos los puntos de pago no usados se reembolsan sin comisión (aunque hayas usado parte).","Pasados 7 días (dentro del período de validez): se reembolsan los puntos de pago restantes menos una comisión de hasta el 10% (la tasa aplicada se muestra en la pantalla de solicitud). No obstante, si los puntos de pago restantes son 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso.","Después de caducar: se reembolsa el 90% de los puntos de pago restantes hasta 5 años desde la recarga.","Los puntos gratis no se reembolsan y caducan al procesar un reembolso. Se descartan los importes inferiores a ₩10."],"Ejemplo: recargas 10.000P y usas 3.000P — en 7 días: quedan 7.000P → reembolso de ₩7.000 / el día 8: quedan 7.000P (10.000P o menos), se descuentan ₩1.000 → ₩6.000 / tras caducar (en 5 años desde la recarga): 90% de 7.000P = ₩6.300. Recargas 30.000P y usas 10.000P — el día 8: 20.000P restantes menos un 10% de comisión → ₩18.000.","Los puntos comprados en una tienda de apps como Google Play o App Store siguen la política de reembolso de esa tienda; si la tienda los reembolsa, se descuentan de tu monedero.","Puedes solicitar el reembolso con «Mi monedero > Solicitar reembolso» en el karaoke o en el contacto de abajo."]},{"h":"5. Bonos de canciones comprados antes (ya no se venden)","b":["Los bonos de canciones ya no se venden, y los que ya compraste (canciones restantes) siguen siendo válidos. Las canciones restantes se guardan en tu cuenta 1 año desde la compra, y el reembolso es así.",["En los 7 días siguientes a la compra: reembolsamos el importe pagado menos las canciones usadas (cantadas), a ₩1,000 por canción.","Pasados 7 días (dentro del año de conservación): reembolsamos el importe calculado igual, menos una comisión de reembolso del 10%.","Las canciones de regalo no son reembolsables. Si el resultado es ₩0 o menos, no hay reembolso; se redondea a la baja a ₩10."],"Puedes pedir el reembolso con el botón «Solicitar reembolso de canciones» de la pantalla de karaoke o por el contacto de abajo."]},{"h":"6. Forma de reembolso y contacto","b":["El reembolso se hace al medio de pago original en 3–7 días hábiles.","Contacto: menú de consultas de la app o correo admin@moneypuzzle.co.kr"]}]}};
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://navi.moneypuzzle.co.kr/?lang="+lang;
  document.title=d.title+" · Money Puzzle Tour for Korea";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
