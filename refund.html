から1年間保管されます。","購入日から7日以内：支払額から、使った（歌った）曲を1曲1,000ウォンとして差し引いた金額を返金します。","7日を過ぎた後（保管期間1年以内）：同じ方法で計算した金額から返金手数料10%を差し引いた金額を返金します。","サービス曲は返金の対象外です。計算結果が0ウォン以下の場合は返金額はなく、10ウォン未満は切り捨てます。"],"例：10+5パック（10,000ウォン・15曲）を購入し3曲使った場合 — 7日以内：10,000ウォン − 3,000ウォン = 7,000ウォンを返金／8日目：7,000ウォンから手数料10%を引いた6,300ウォンを返金。","返金の申請は、カラオケ画面の「残り曲の返金を申請」ボタンまたは下記お問い合わせ先から行えます。","現在、曲チケットの決済はテスト運用中（UNDER TESTING）です。テスト決済は実際には請求されず、曲数も追加されません。"]},{"h":"4. 返金方法・お問い合わせ","b":["返金は決済した手段で、営業日3～7日以内に行います。","お問い合わせ：アプリ内のお問い合わせメニュー、またはメール emhwang3@moneypuzzle.co.kr"]}]},"zhs":{"title":"退款规定","eff":"施行日期：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 旅游·向导产品","b":["依据韩国公平交易委员会《消费者纠纷解决标准》（国内旅行），按取消时间退款如下：",["出发前5天及以前取消：全额退款","出发前2天及以前取消：扣除费用的10%后退款","出发前1天取消：扣除费用的20%后退款","当天取消或未参加：扣除费用的30%后退款"]]},{"h":"2. 因公司或向导原因取消","b":["因公司或向导原因（包括天气、安全问题）取消行程时，全额退款。","设有最少成团人数的商品，如在出发前24小时仍未达到该人数，本公司将取消合同并全额退还已收款项。"]},{"h":"3. 卡拉OK点歌券（测试运营中）","b":["卡拉OK点歌券是用于应用内卡拉OK正式伴奏歌曲（筹备中）的预付券。金永（KY）官方YouTube频道的卡拉OK视频免费，不扣点歌券。",["保存：购买的歌曲（含赠送歌曲）自购买日起在已登录的账户中保留1年。","购买后7天内：退还支付金额减去已使用（已唱）歌曲（每首按₩1,000计算）后的金额。","超过7天后（1年保存期内）：按同样方法计算的金额再扣除10%退款手续费后退还。","赠送歌曲不在退款范围内。计算结果为₩0或以下时不予退款，不足₩10舍去。"],"例：购买10+5套餐（₩10,000·15首）并用了3首 — 7天内：₩10,000 − ₩3,000 = ₩7,000 退款 / 第8天：₩7,000 扣除10%手续费后退款 ₩6,300。","可通过卡拉OK页面的“申请退还剩余歌曲”按钮或下方联系方式申请退款。","目前点歌券付款处于测试运营（UNDER TESTING）。测试付款不会实际扣款，也不会增加歌曲。"]},{"h":"4. 退款方式与咨询","b":["退款将通过原支付方式在3～7个工作日内办理。","咨询：应用内咨询菜单，或邮箱 emhwang3@moneypuzzle.co.kr"]}]},"zht":{"title":"退款規定","eff":"施行日期：    年  月  日","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. 旅遊·嚮導產品","b":["依據韓國公平交易委員會《消費者紛爭解決標準》（國內旅行），按取消時間退款如下：",["出發前5天及以前取消：全額退款","出發前2天及以前取消：扣除費用的10%後退款","出發前1天取消：扣除費用的20%後退款","當天取消或未參加：扣除費用的30%後退款"]]},{"h":"2. 因公司或嚮導原因取消","b":["因公司或嚮導原因（包括天氣、安全問題）取消行程時，全額退款。","設有最少成團人數的商品，如在出發前24小時仍未達到該人數，本公司將取消合約並全額退還已收款項。"]},{"h":"3. 卡拉OK點歌券（測試營運中）","b":["卡拉OK點歌券是用於應用程式內卡拉OK正式伴奏歌曲（籌備中）的預付券。金永（KY）官方YouTube頻道的卡拉OK影片免費，不扣點歌券。",["保存：購買的歌曲（含贈送歌曲）自購買日起在已登入的帳戶中保留1年。","購買後7天內：退還付款金額減去已使用（已唱）歌曲（每首按₩1,000計算）後的金額。","超過7天後（1年保存期內）：按同樣方法計算的金額再扣除10%退款手續費後退還。","贈送歌曲不在退款範圍內。計算結果為₩0或以下時不予退款，不足₩10捨去。"],"例：購買10+5套餐（₩10,000·15首）並用了3首 — 7天內：₩10,000 − ₩3,000 = ₩7,000 退款 / 第8天：₩7,000 扣除10%手續費後退款 ₩6,300。","可透過卡拉OK頁面的「申請退還剩餘歌曲」按鈕或下方聯絡方式申請退款。","目前點歌券付款處於測試營運（UNDER TESTING）。測試付款不會實際扣款，也不會增加歌曲。"]},{"h":"4. 退款方式與諮詢","b":["退款將透過原付款方式於3～7個工作天內辦理。","諮詢：應用程式內的諮詢選單，或電郵 emhwang3@moneypuzzle.co.kr"]}]},"es":{"title":"Política de reembolso","eff":"Fecha de entrada en vigor: ____-__-__","app":"Money Puzzle Tour for Korea","sec":[{"h":"1. Tours y servicios de guía","b":["Seguimos los Estándares de Resolución de Disputas de Consumo de la Comisión de Comercio Justo de Corea (viajes nacionales). El reembolso depende de cuándo canceles:",["Hasta 5 días antes del tour: reembolso total","Hasta 2 días antes: se descuenta el 10% del precio","1 día antes: se descuenta el 20% del precio","El mismo día o si no te presentas: se descuenta el 30% del precio"]]},{"h":"2. Cancelación por nuestra parte o del guía","b":["Si el tour se cancela por motivos nuestros o del guía, incluidos el clima o la seguridad, el reembolso es total.","En los productos con un número mínimo de participantes, si no se alcanza 24 horas antes de la salida, la Empresa cancelará el contrato y reembolsará el importe íntegro pagado."]},{"h":"3. Bono de canciones de karaoke (modo de prueba)","b":["El bono de canciones es un bono prepago para las canciones con acompañamiento con licencia (en preparación) del karaoke de la app. Los vídeos de karaoke de los canal oficial de KY (Kumyoung) en YouTube son gratis y no usan el bono.",["Conservación: las canciones compradas (incluidas las de regalo) se guardan en tu cuenta durante 1 año desde la compra.","En los 7 días siguientes a la compra: reembolsamos el importe pagado menos las canciones usadas (cantadas), a ₩1,000 por canción.","Pasados 7 días (dentro del año de conservación): reembolsamos el importe calculado igual, menos una comisión de reembolso del 10%.","Las canciones de regalo no son reembolsables. Si el resulta function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}
