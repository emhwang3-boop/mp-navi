function favAsk(force){ if(favOk()&&!force) return; var y=confirm(T("관심 장소를 이 기기 안에서만 분석해 「요즘 관심」을 보여 드릴까요?\n(서버로 보내지 않습니다. 거절해도 저장은 됩니다)","Analyse your saved places on this device only to show your interests?\n(Nothing is sent to our server. You can still save places if you decline.)"));
  try{ localStorage.setItem("mpt_fav_ok",y?"y":"n"); }catch(e){} }
var FAVCAT=[["palace","궁궐·유적","Palaces & heritage",/궁|문$|문 |묘|사당|성곽|탑|향교|서원|palace|gate|shrine|tomb|fortress/i],["market","시장","Markets",/시장|market/i],
  ["cafe","카페·한옥","Cafés & hanok",/카페|커피|찻집|한옥|cafe|coffee|tea|hanok/i],["nature","자연·공원","Nature & parks",/공원|산|숲|호수|강|천$|폭포|섬|해변|계곡|park|mountain|forest|lake|river|stream|beach|island/i],
  ["museum","박물관·전시","Museums",/박물관|미술관|기념관|전시|museum|gallery|memorial/i],["shop","쇼핑·거리","Shopping & streets",/거리|길$|백화점|몰|쇼핑|상가|문고|street|mall|shopping|store/i],
  ["food","맛집","Food",/맛집|식당|음식|골목|food|restaurant/i]];
function favCat(nm,d){ var s=(nm||"")+" "+(d||""); for(var i=0;i<FAVCAT.length;i++) if(FAVCAT[i][3].test(s)) return FAVCAT[i][0]; return "etc"; }
function favCatName(c){ for(var i=0;i<FAVCAT.length;i++) if(FAVCAT[i][0]===c) return T(FAVCAT[i][1],FAVCAT[i][2]); return T("기타","Other"); }
function favTap(k){ if(favOk()!=="y"||!k||k.charAt(0)==="_") return; var p=PLACES[k]; if(!p) return; var c=favCat(p.ko,p.dko);
  try{ var t=JSON.parse(localStorage.getItem("mpt_favtap_v1")||"{}"); t[c]=(t[c]||0)+1; localStorage.setItem("mpt_favtap_v1",JSON.stringify(t)); }catch(e){} }
function favScore(){ var s={}; favGet().forEach(function(f){ s[f.c]=(s[f.c]||0)+3; });   // 저장 1곳 = 누름 3번
  try{ var t=JSON.parse(localStorage.getItem("mpt_favtap_v1")||"{}"); for(var c in t) s[c]=(s[c]||0)+t[c]; }catch(e){}
  return Object.keys(s).filter(function(c){ return c!=="etc"; }).sort(function(a,b){ return s[b]-s[a]; }).slice(0,3).map(function(c){ return [c,s[c]]; }); }
function favSend(){ if(!FAV_SEND||favOk()!=="y") return; var tot={}; favScore().forEach(function(x){ tot[x[0]]=x[1]; });   // 통로만 — 지금은 꺼짐
  try{ fetch(HUB_FAV,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cat:tot})}).catch(function(){}); }catch(e){} }
function favSame(f,lat,lng){ return Math.abs(f.lat-lat)<1e-5&&Math.abs(f.lng-lng)<1e-5; }
function favHas(lat,lng){ return favGet().some(function(f){ return favSame(f,lat,lng); }); }
function favAdd(o){ favAsk(); var a=favGet(); if(favHas(o.lat,o.lng)) return; o.c=favCat(o.ko,o.d); o.t=Date.now(); a.unshift(o); favPut(a.slice(0,200)); favSend(); }
function favDel(i){ var a=favGet(); a.splice(i,1); favPut(a); favList(); }
function favToggle(k){ var p=PLACES[k]; if(!p) return; var lat=+p.lat, lng=+p.lng;
  if(favHas(lat,lng)) favPut(favGet().filter(function(f){ return !favSame(f,lat,lng); }));
  else favAdd({k:k.charAt(0)==="_"?null:k,ko:p.ko,en:p.en||p.ko,lat:lat,lng:lng,d:p.dko||p.cat||""});
  favBtn(k); }
function favBtn(k){ var r=document.getElementById("res"), it=r&&r.firstElementChild, p=PLACES[k]; if(!it||!p) return; var b=it.querySelector(".favb");
  if(!b){ b=document.createElement("button"); b.type="button"; b.className="favb"; b.style.cssText="float:right;margin:-2px 0 0 8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;cursor:pointer;color:#b8860b"; it.insertBefore(b,it.firstChild); b.onclick=function(e){ e.stopPropagation(); favToggle(window._cardK||k); }; }
  b.textContent=favHas(+p.lat,+p.lng)?T("★ 저장됨","★ Saved"):T("☆ 관심 장소","☆ Save"); }
function favGo(i){ var f=favGet()[i]; if(!f) return; if(f.k&&PLACES[f.k]){ var id=meBest(f.lat,f.lng)||NAVI_ROOT; spinGo(id===NAVI_ROOT?"kr":id,f.lat,f.lng,null); placeShow(f.k); return; }
  spinShow({name:f.ko,name_en:f.en,x:f.lng,y:f.lat,addr:f.d||""}); }
function favList(){ var a=favGet(), sc=favOk()==="y"?favScore():[], h='<div class="item"><div class="t">★ '+T("관심 장소","Saved places")+' <span class="d">('+a.length+')</span></div>';
  if(sc.length) h+='<div class="d" style="margin:4px 0 2px;color:var(--ink)">'+T("요즘 관심: ","Your interests: ")+sc.map(function(x,i){ return esc(favCatName(x[0]))+' '+"★★★".slice(0,3-i); }).join(" · ")+'</div>';
  else if(favOk()!=="y") h+='<div class="d" style="margin:4px 0 2px">'+T("관심 분석은 꺼져 있습니다. ","Interest analysis is off. ")+'<a href="#" onclick="favAsk(true);favList();return false">'+T("켜기","Turn on")+'</a></div>';
  if(!a.length) h+='<div class="d" style="margin-top:6px">'+T("장소 카드의 ☆를 누르거나, 약도를 길게 눌러 저장해 보세요.","Tap ☆ on a place card, or long-press the map to save a spot.")+'</div>';
  a.forEach(function(f,i){ h+='<div style="display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0;margin-top:6px"><a href="#" style="flex:1;color:var(--ink);text-decoration:none;font-weight:700" onclick="favGo('+i+');return false"><span style="color:#f5b301">★</span> '+esc(LANG==="ko"?f.ko:(f.k&&PLACES[f.k]?LN(PLACES[f.k]):(f.en||f.ko)))+'<span class="d" style="font-weight:400"> · '+esc(favCatName(f.c))+'</span></a><a href="#" class="d" onclick="favDel('+i+');return false">'+T("삭제","Delete")+'</a></div>'; });
  h+='<div class="d" style="margin-top:8px">'+T("이 목록은 이 기기 안에만 있습니다. 폰을 바꾸거나 앱 데이터를 지우면 사라집니다.","This list is kept on this device only; it is lost if you change phones or clear app data.")+'</div></div>';
  window._cardK=null; document.getElementById("res").innerHTML=h; try{ document.getElementById("res").scrollIntoView({behavior:"smooth",block:"start"}); }catch(e){} }
function favBar(){ var b=document.getElementById("favbar"); if(!b) return; var n=favGet().length; b.innerHTML=""; if(!n) return;   // 자리는 늘 두 줄 확보 — 한 줄 넘치면 두 줄 (사장님 10-17)
  var w=b.clientWidth||300, per=Math.max(1,Math.floor((w-40)/14)), fit=per*2, k=Math.min(n,fit);
  b.innerHTML='<span style="flex:1;text-align:right;letter-spacing:2px;word-break:break-all;white-space:normal;line-height:15px">'+new Array(k+1).join("★")+(n>k?"…":"")+'</span><b style="margin-left:6px;color:var(--ink);font-size:12px;align-self:flex-end">'+n+'</b>';
  b.title=T("관심 장소 "+n+"곳","Saved places: "+n); }
(function(){   // 카드·지도 아래 별 줄·길게 누르기 붙이기
  var _ps=placeShow; placeShow=function(k){ _ps(k); try{ favTap(k); favBtn(k); }catch(e){} };
  var _sc=spinCard; spinCard=function(){ _sc(); try{ favBtn("__pin"); }catch(e){} };
  var m=document.getElementById("map"), b=document.createElement("div"); b.id="favbar";
  b.style.cssText="display:flex;align-items:flex-start;justify-content:flex-end;height:32px;margin:4px 6px 0;color:#f5b301;font-size:12px;line-height:15px;cursor:pointer;overflow:hidden;user-select:none";
  b.onclick=function(){ favList(); }; m.parentNode.insertBefore(b,m.nextSibling);
  var st=document.createElement("style"); st.textContent="#favbar[hidden]{display:none!important}"; document.head.appendChild(st);
  window.addEventListener("resize",favBar);
  var lp=null;   // 약도 길게 누르기 → 여기 저장 (한 손가락, 안 움직이고 0.7초)
  function lpEnd(){ if(lp){ clearTimeout(lp.t); lp=null; } }
  m.addEventListener("touchstart",function(e){ lpEnd(); if(DET||e.touches.length!==1||e.target.closest(".zb")||e.target.closest("#zme")) return; var t=e.touches[0], x=t.clientX, y=t.clientY;
    if(hitAt(x,y)==="mpstat") return;   // 통계청 길게 누르기는 관리자 입구
    lp={x:x,y:y,t:setTimeout(function(){ lp=null; var r=document.getElementById("mapimg").getBoundingClientRect(), ll=meGeoInv(VIEW==="kr"?NAVI_ROOT:VIEW,(x-r.left)/r.width,(y-r.top)/r.height); if(!ll) return;
      var nm=prompt(T("여기를 관심 장소로 저장합니다. 이름을 적어 주세요.","Save this spot. Give it a name:"),T("내 장소","My spot")); if(nm===null) return; nm=String(nm).trim().slice(0,40)||T("내 장소","My spot");
      favAdd({k:null,ko:nm,en:nm,lat:+ll[0].toFixed(6),lng:+ll[1].toFixed(6),d:""}); try{ favList(); }catch(er){} },700)}; },{passive:true});
  m.addEventListener("touchmove",function(e){ if(lp&&e.touches.length===1){ var t=e.touches[0]; if(Math.abs(t.clientX-lp.x)+Math.abs(t.clientY-lp.y)>10) lpEnd(); } else lpEnd(); },{passive:true});
  m.addEventListener("touchend",lpEnd,{passive:true}); m.addEventListener("touchcancel",lpEnd,{passive:true});
  setTimeout(favBar,0);
})();
</script>
<script>
// ── 「여기!」 표시 (사장님 10-17) — 검색한 곳에 그림이 있으면 그 그림 위에 「나」 부부처럼 붉은 말풍선 화살표를 띄운다
function hereClear(){ var e=document.getElementById("herek"); if(e) e.remove(); }
function hereShow(k){ hereClear(); if(DET||VIEW==="kr") return; var c=CITY[VIEW], b=c&&c.spots&&c.spots[k], f;
  if(b) f=[(b[0]+b[2])/2,b[1]]; else { var p=PLACES[k]; if(!p) return; f=meGeoFrac(VIEW,+p.lat,+p.lng); } if(!f) return;
  var e=document.createElement("div"); e.id="herek";
  e.style.cssText="position:absolute;z-index:6;pointer-events:none;left:"+(f[0]*100)+"%;top:"+(f[1]*100)+"%;transform:translate(-50%,-100%);text-align:center";
  e.innerHTML='<div class="hk-b">'+esc(T("여기!","Here"))+'</div><div class="hk-a"></div>';
  document.getElementById("mz").appendChild(e); }
(function(){
  var st=document.createElement("style");
  st.textContent="#herek .hk-b{display:inline-block;background:#e03131;color:#fff;font-weight:900;font-size:13px;line-height:1.2;border-radius:999px;padding:4px 11px;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}"
   +"#herek .hk-a{width:0;height:0;margin:-1px auto 0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #e03131}"
   +"#herek{animation:hkBob 1s ease-in-out infinite}@keyframes hkBob{0%,100%{margin-top:-4px}50%{margin-top:-12px}}"
   +"#spin .spbob{animation:spBob .9s cubic-bezier(.3,0,.5,1) infinite;transform-origin:50% 100%}@keyframes spBob{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-9px) scaleY(1.04)}55%{transform:translateY(-9px)}85%{transform:translateY(0) scaleY(.9)}}";   /* 그림 없는 곳 핀은 통통 튄다 (사장님 10-17) */
  document.head.appendChild(st);
  var _s0=spinShow0; spinShow0=function(x){ window._hereNext=true; try{ _s0(x); } finally{ window._hereNext=false; } };   // 검색에서 온 것만
  var _ps=placeShow; placeShow=function(k){ var go=window._hereNext; _ps(k); if(go) try{ hereShow(k); }catch(e){} else hereClear(); };
  var _vs=viewSet; viewSet=function(v){ hereClear(); _vs(v); };
  var _rc=resClear; resClear=function(){ hereClear(); _rc(); };
})();
</script>
<script>/*nmsel*/
// ── 고른 장소 = 자세한 지도에서 빨간 핀이 통통 (사장님 10-18) — 약도 그림 카드·검색 핀 카드가 열린 채 「자세히」를 누르면 그곳 마커만 빨갛게.
//   자세한 지도로 저절로 바꾸지 않는다 · 다른 마커는 그대로 · 카드를 닫거나 다른 곳을 고르면 옮겨 가거나 멈춘다
var _nmSel=null, _nmSelK=null, _nmSelHid=null;
function nmSelIcon(){ return {content:'<div class="nmsel"><svg class="nmbob" viewBox="0 0 24 34" width="30" height="42" aria-hidden="true"><path d="M12 1C6 1 1.5 5.5 1.5 11.3 1.5 19 12 33 12 33s10.5-14 10.5-21.7C22.5 5.5 18 1 12 1z" fill="#e03131" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="11.5" r="4" fill="#fff"/></svg></div>',anchor:new naver.maps.Point(15,42)}; }
function nmSel(k){ if(!_nm||!window.naver||!naver.maps) return; var p=k&&PLACES[k];
  if(_nmSelHid){ try{ _nmSelHid.setVisible(true); }catch(e){} _nmSelHid=null; }
  if(!p){ if(_nmSel) _nmSel.setMap(null); _nmSelK=null; return; }
  var mk=k==="__pin"?_spm:_nmk[k]; if(mk&&mk.getMap()){ try{ mk.setVisible(false); }catch(e){} _nmSelHid=mk; }   // 원래 마커는 숨기고 그 자리에 빨간 핀
  var ll=new naver.maps.LatLng(+p.lat,+p.lng);
  if(!_nmSel) _nmSel=new naver.maps.Marker({position:ll,map:_nm,icon:nmSelIcon(),zIndex:300,title:LN(p)});
  else { _nmSel.setPosition(ll); try{ _nmSel.setTitle(LN(p)); }catch(e){} if(_nmSel.getMap()!==_nm) _nmSel.setMap(_nm); }
  _nmSelK=k; }
function nmSelKey(){ var k=window._cardK, r=document.getElementById("res"); return (k&&k!=="__me"&&PLACES[k]&&r&&r.firstElementChild)?k:null; }
function nmSelSync(){ if(!DET||!_nm) return; nmSel(nmSelKey()); }
// 「자세히」를 연 순간 — 검색 핀이면 네이버 마커를 만들고, 고른 곳이 있으면 그곳을 가운데로
function nmSelOpen(){ if(!_nm) return; var p=PLACES.__pin;
  if(p&&(!_spm||!_spm.getMap())){ _spm=new naver.maps.Marker({position:new naver.maps.LatLng(+p.lat,+p.lng),map:_nm,title:LN(p)}); naver.maps.Event.addListener(_spm,"click",spinCard); }
  var k=nmSelKey(); if(k){ var q=PLACES[k]; try{ _nm.setCenter(new naver.maps.LatLng(+q.lat,+q.lng)); }catch(e){} }
  nmSel(k); }
(function(){ var st=document.createElement("style");
  st.textContent=".nmsel{width:30px;height:42px;pointer-events:none}.nmbob{display:block;transform-origin:50% 100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));animation:nmBob .9s cubic-bezier(.3,0,.5,1) infinite}@keyframes nmBob{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-10px) scaleY(1.04)}55%{transform:translateY(-10px)}85%{transform:translateY(0) scaleY(.9)}}"
   +"@media (prefers-reduced-motion:reduce){.nmbob,#spin .spbob,#herek{animation:none!important}}";
  document.head.appendChild(st);
  new MutationObserver(function(){ try{ nmSelSync(); }catch(e){} }).observe(document.getElementById("res"),{childList:true});   // 카드가 바뀌면 빨간 핀도
  var _no=nmOpen; nmOpen=function(k){ _no(k); try{ nmSel(k); }catch(e){} };   // 자세한 지도에서 마커를 누르면 그곳으로 옮겨 간다
})();
</script>
<script>/*nmhit*/
// ── 자세한 지도 핀 누르기를 직접 잡는다 (사장님 10-17 「웹·폰 둘 다 먹통」) — 네이버 마커 click 이벤트가 오지 않아, 누른 자리에서 가장 가까운 핀(손가락 한 마디 28px)을 찾아 설명을 연다
document.addEventListener("click",function(e){ try{ if(!DET||!_nm||!e.target.closest||!e.target.closest("#nmap")) return;
    if(e.target.closest(".nmiw")) return;   // 설명 말풍선 안
    var x=e.clientX, y=e.clientY, best=null, bd=28;
    if(_nmSel&&_nmSelK&&_nmSel.getMap()&&_nmSel.getElement){ var rs=_nmSel.getElement().getBoundingClientRect(); if(rs.width&&Math.hypot(x-(rs.left+rs.width/2),y-(rs.top+rs.height*0.4))<28){ window._nmMk=Date.now(); if(_nmSelK==="__pin") spinCard(); else nmOpen(_nmSelK); return; } }   // 빨간 핀 (10-18)
    for(var k in _nmk){ var el=_nmk[k].getElement&&_nmk[k].getElement(); if(!el) continue; var r=el.getBoundingClientRect(); if(!r.width) continue;
      var cx=r.left+r.width/2, cy=r.top+r.height*0.4, d=Math.hypot(x-cx,y-cy); if(d<bd){ bd=d; best=k; } }
    if(best){ window._nmMk=Date.now(); nmOpen(best); return; }
    if(_spm&&_spm.getElement){ var r2=_spm.getElement().getBoundingClientRect(); if(r2.width&&Math.hypot(x-(r2.left+r2.width/2),y-(r2.top+r2.height*0.4))<28){ spinCard(); return; } }
  }catch(z){} },true);
</script>
