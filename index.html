<script>
var HUB="https://brief-live-hub.emhwang3.workers.dev";
var LANG="ko"; try{ var _ql=(location.search.match(/[?&]lang=(ko|en)/i)||[])[1]; if(_ql) localStorage.setItem("mpv_lang",_ql.toLowerCase()); LANG=localStorage.getItem("mpv_lang")||(/^ko/i.test(navigator.language)?"ko":"en"); }catch(e){}
function T(k,e){ return LANG==="en"?e:k; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function setLang(l){ LANG=l; try{ localStorage.setItem("mpv_lang",l); }catch(e){} paint(); try{ infoPaint(); }catch(e){} }
function paint(){
  document.getElementById("lang").textContent=LANG==="ko"?"EN":"한";

  document.getElementById("gob").textContent=T("검색","Search");
  document.getElementById("hint").textContent=T("가고 싶은 곳, 먹고 싶은 것, 하고 싶은 것 등 아무거나 써 보세요. 뭐라도 추천해 드립니다.","Type anything — places to go, food to eat, things to do. We'll recommend something.");
  document.getElementById("mapimg").alt=T("대한민국 관광 지도","Korea travel map");
  document.title=T("머니퍼즐 내비","Money Puzzle Navi");
  document.getElementById("foot").textContent=T("머니퍼즐 내비 — 주식회사 부만","Money Puzzle Navi — Booman Inc.");
}
// 내 위치 (문장 검색 때만, 4초 안에 못 받으면 위치 없이) — 저장하지 않는다 (위치정보법)
function myPos(){ return new Promise(function(ok){ if(!navigator.geolocation) return ok(null); var t=setTimeout(function(){ ok(null); },4000);
  navigator.geolocation.getCurrentPosition(function(p){ clearTimeout(t); ok([p.coords.latitude,p.coords.longitude]); },function(){ clearTimeout(t); ok(null); },{enableHighAccuracy:false,timeout:3800,maximumAge:120000}); }); }
function kmTxt(m){ return m<1000?m+" m":(m/1000).toFixed(1)+" km"; }
function go(kq){
  var q=(typeof kq==="string"&&kq)||document.getElementById("q").value.trim(), out=document.getElementById("res"); if(!q){ out.innerHTML=""; return; }
  out.innerHTML='<div class="msg">'+T("찾는 중…","Searching…")+'</div>';
  (/\s/.test(q)?myPos():Promise.resolve(null)).then(function(ps){ return fetch(HUB+"/kplace?q="+encodeURIComponent(q)+(LANG==="en"?"&lang=en":"")+(ps?"&ux="+ps[1].toFixed(5)+"&uy="+ps[0].toFixed(5):"")); }).then(function(r){ return r.json(); }).then(function(j){
    var it=(j&&j.ok&&j.items)||[];
    if(!it.length){ out.innerHTML='<div class="msg">'+T("찾은 곳이 없습니다. 다른 말로 찾아 보세요.","No places found. Try other words.")+'</div>'; return; }
    var gs=j.guess?'<div class="d" style="margin:0 4px 6px">'+T('「'+esc(q)+'」을(를) 「'+esc(j.guess)+'」(으)로 찾았습니다','Showing results for “'+esc(j.guess)+'” (from “'+esc(q)+'”)')+'</div>':'';
    out.innerHTML=gs+it.slice(0,10).map(function(x){
      var nm=encodeURIComponent(x.name), ll=x.y+","+x.x;
      var en=LANG==="en"&&x.name_en, ttl=en?x.name_en:x.name, ad=en?(x.addr_en||x.addr):x.addr, ct=en?(x.cat_en||""):String(x.cat||"").split(">").pop().trim();
      return '<div class="item"><div class="t">'+esc(ttl)+'</div>'+(en?'<div class="d" style="margin:1px 0 0">'+esc(x.name)+'</div>':'')+'<div class="d">'+esc(ad||"")+(ct?' · '+esc(ct):'')+(x.dist!=null?' · <b>'+kmTxt(x.dist)+'</b>':'')+'</div>'
        +(LANG==="en"   // 영어 화면은 카카오(한글뿐) 빼고 구글 먼저 (사장님 10-15)
          ?'<a href="https://www.google.com/maps/dir/?api=1'+(LANG==="en"?"&hl=en":"")+'&destination='+ll+'" target="_blank" rel="noopener">Google Maps (English)</a>'
           +'<a href="https://map.naver.com/p/search/'+nm+'" target="_blank" rel="noopener">Naver Map</a>'
          :'<a href="https://map.kakao.com/link/to/'+nm+','+x.y+','+x.x+'" target="_blank" rel="noopener">카카오맵 길찾기</a>'
           +'<a href="https://map.naver.com/p/search/'+nm+'" target="_blank" rel="noopener">네이버 지도</a>'
           +'<a href="https://www.google.com/maps/dir/?api=1'+(LANG==="en"?"&hl=en":"")+'&destination='+ll+'" target="_blank" rel="noopener">구글 지도</a>')+'</div>';
    }).join("");
  }).catch(function(){ out.innerHTML='<div class="msg">'+T("잠시 뒤 다시 해 주세요.","Please try again shortly.")+'</div>'; });
}
// 공유 — 화면은 보여 주되 실제로는 보내지 않는다 (체험판, 사장님 기기 포함 · 2026-10-12)

function shBuild(){
  var p=document.getElementById("shIn");

  if(a==="ktx"||b==="ktx"){ ktxErr(); dlDraw(null); return; }
  if(!a||!b||a===b){ dlDraw(null); return; }
  var km=kmBetween(a,b), rp=routePlan(a,b,km), t=(km<10?km.toFixed(1):Math.round(km).toLocaleString())+" km";
  dlDraw(p0,p1,t);
  document.getElementById("res").innerHTML='<div class="item"><div class="t">'+esc(pName(a))+' ↔ '+esc(pName(b))+'</div><div class="dist">'+t+'</div><div class="d">'+T("직선거리","Straight-line distance")+'</div><div id="trn"></div>'+rp.html+'</div>'; if(rp.train) trainBox(a,b); if(rp.ods) odsBox(a,b); }
// 줌 — s=배율(1~5), tx·ty=옮긴 만큼(px). 지도 칸 밖이 보이지 않게 묶는다
var ZM={s:1,tx:0,ty:0};
function ASP(){ var c=CITY[VIEW]; return (c&&c.aspect)||1; }
function zApply(){ var m=document.getElementById("map"), w=m.clientWidth, z=document.getElementById("mz"), as=ASP();
  z.style.width=(as*100)+"%";
  ZM.s=Math.max(1,Math.min(5,ZM.s)); ZM.tx=Math.min(0,Math.max(w-w*as*ZM.s,ZM.tx)); ZM.ty=Math.min(0,Math.max(w-w*ZM.s,ZM.ty));
  z.style.transform="translate("+ZM.tx+"px,"+ZM.ty+"px) scale("+ZM.s+")"; m.classList.toggle("zoomed",ZM.s>1.001);
  var lb=document.getElementById("dlb"); if(lb) lb.style.transform="translate(-50%,-50%) scale("+(1/ZM.s)+")"; }
function zAt(cx,cy,ns){ var r=document.getElementById("map").getBoundingClientRect(), px=cx-r.left, py=cy-r.top;
  ns=Math.max(1,Math.min(5,ns)); ZM.tx=px-(px-ZM.tx)*ns/ZM.s; ZM.ty=py-(py-ZM.ty)*ns/ZM.s; ZM.s=ns; zApply(); }
function zCenter(f){ var r=document.getElementById("map").getBoundingClientRect(); zAt(r.left+r.width/2,r.top+r.height/2,ZM.s*f); }
function hitInit(){ var m=document.getElementById("map"), drag=null, pan=null, moved=false, tch=null, tmr=null, pin=null, one=null;
  document.getElementById("zin").onclick=function(e){ e.stopPropagation(); zCenter(1.6); };
  document.getElementById("zout").onclick=function(e){ e.stopPropagation(); zCenter(1/1.6); };
  document.getElementById("zrs").onclick=function(e){ e.stopPropagation(); ZM={s:1,tx:0,ty:0}; zApply(); };
  document.getElementById("vback").onclick=function(e){ e.stopPropagation(); viewSet((CITY[VIEW]&&CITY[VIEW].parent)||"kr"); };
  document.getElementById("vdet").onclick=function(e){ e.stopPropagation(); detSet(!DET); };
  window.addEventListener("resize",zApply);
  m.addEventListener("click",function(e){ if(DET) return; if(e.button!==0||e.target.closest(".zb")||e.target.closest("#vback")||e.target.closest("#vdet")) return;
    if(VIEW!=="kr"){ if(!moved){ var hk=hitAt(e.clientX,e.clientY); if(hk){ dlDraw(null); hitClick(hk); } else areaTap(e.clientX,e.clientY); } moved=false; return; } if(moved){ moved=false; return; } dlDraw(null); hitClick(hitAt(e.clientX,e.clientY)); });
  m.addEventListener("wheel",function(e){ if(DET) return; e.preventDefault(); zAt(e.clientX,e.clientY,ZM.s*(e.deltaY<0?1.15:1/1.15)); },{passive:false});
  m.addEventListener("mousemove",function(e){
if(DET) return;     if(pan){ var dx=e.clientX-pan.x, dy=e.clientY-pan.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; ZM.tx=pan.tx+dx; ZM.ty=pan.ty+dy; zApply(); m.style.cursor="grabbing"; return; }
    var k=hitAt(e.clientX,e.clientY); m.style.cursor=k?"pointer":(ZM.s>1?"grab":"");
    if(drag){ dlDraw(drag.p,dlPt(e.clientX,e.clientY),""); } });
  m.addEventListener("contextmenu",function(e){ e.preventDefault(); });
  m.addEventListener("mousedown",function(e){ if(DET) return; if(e.target.closest(".zb")) return;
    if(e.button===0){ moved=false; if(ZM.s>1||ASP()>1){ e.preventDefault(); pan={x:e.clientX,y:e.clientY,tx:ZM.tx,ty:ZM.ty}; } return; }
    if(e.button!==2) return; var k=hitAt(e.clientX,e.clientY); if(!k) return; e.preventDefault(); drag={k:k,p:dlPt(e.clientX,e.clientY)}; });
  window.addEventListener("mouseup",function(e){ if(e.button===0){ pan=null; return; } if(e.button!==2||!drag) return; var k=hitAt(e.clientX,e.clientY), d=drag; drag=null; distShow(d.k,k,d.p,dlPt(e.clientX,e.clientY)); });
  function dist2(a,b){ return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); }
  m.addEventListener("touchstart",function(e){ if(DET) return; if(e.target.closest(".zb")) return; clearTimeout(tmr); tch=null; pin=null; one=null;
    if(e.touches.length===1){ dlDraw(null); if(ZM.s>1||ASP()>1){ var t=e.touches[0]; one={x:t.clientX,y:t.clientY,tx:ZM.tx,ty:ZM.ty,h:ZM.s<=1.001}; } return; }
    if(e.touches.length!==2) return; e.preventDefault();
    var t0=e.touches[0], t1=e.touches[1], a=hitAt(t0.clientX,t0.clientY), b=hitAt(t1.clientX,t1.clientY);
    pin={d:dist2(t0,t1),s:ZM.s,cx:(t0.clientX+t1.clientX)/2,cy:(t0.clientY+t1.clientY)/2,tx:ZM.tx,ty:ZM.ty,go:false};
    tch={a:a,b:b,p0:dlPt(t0.clientX,t0.clientY),p1:dlPt(t1.clientX,t1.clientY)};
    tmr=setTimeout(function(){ if(tch&&pin&&!pin.go){ distShow(tch.a,tch.b,tch.p0,tch.p1); tch=null; pin=null; } },300); },{passive:false});
  m.addEventListener("touchmove",function(e){
if(DET) return;     if(e.touches.length===2&&pin){ e.preventDefault(); var t0=e.touches[0], t1=e.touches[1], d=dist2(t0,t1), cx=(t0.clientX+t1.clientX)/2, cy=(t0.clientY+t1.clientY)/2;
      if(!pin.go&&(Math.abs(d-pin.d)>12||Math.hypot(cx-pin.cx,cy-pin.cy)>12)){ pin.go=true; clearTimeout(tmr); tch=null; }   // 움직이면 줌, 가만히 0.3초면 거리
      if(pin.go){ var r=m.getBoundingClientRect(), ns=Math.max(1,Math.min(5,pin.s*d/pin.d)), px=pin.cx-r.left, py=pin.cy-r.top;
        ZM.s=ns; ZM.tx=px-(px-pin.tx)*ns/pin.s+(cx-pin.cx); ZM.ty=py-(py-pin.ty)*ns/pin.s+(cy-pin.cy); zApply(); } return; }
    if(e.touches.length===1&&one){ var t=e.touches[0], dx=t.clientX-one.x, dy=t.clientY-one.y;
      if(one.h){ if(Math.abs(dx)<Math.abs(dy)) return; e.preventDefault(); ZM.tx=one.tx+dx; zApply(); return; }   // 넓은 약도 처음 크기 — 옆으로만 (위아래는 화면 넘김)
      e.preventDefault(); ZM.tx=one.tx+dx; ZM.ty=one.ty+dy; zApply(); } },{passive:false});
  m.addEventListener("touchend",function(e){ if(e.touches.length<2){ clearTimeout(tmr); tch=null; pin=null; } if(e.touches.length===0) one=null; });
  m.addEventListener("touchcancel",function(){ clearTimeout(tmr); tch=null; pin=null; one=null; });
  zApply();
}
// 결과(장소·거리·열차·검색) 오른쪽 위 X — 누르면 지운다 (사장님 10-15)
function resClear(){ document.getElementById("res").innerHTML=""; try{ dlDraw(null); }catch(e){} }
(function(){ var r=document.getElementById("res");
  new MutationObserver(function(){ if(r.firstElementChild&&!r.querySelector(":scope > .xbtn")){ var b=document.createElement("button"); b.className="xbtn"; b.type="button"; b.textContent="✕"; b.setAttribute("aria-label",T("닫기","Close")); b.onclick=resClear; r.insertBefore(b,r.firstChild); } }).observe(r,{childList:true});
})();
// 안내판 — 생각날 때마다 아래 목록에 한 줄씩 [한글, 영어] (사장님 10-15)
var INFO=[
  ["지도 그림을 두 번 누르면 그 지역 약도가 펼쳐집니다","Double-tap a picture on the map to open that area's detailed map"],
  ["네이버 지도를 영어로: 네이버 지도 앱 → ☰ 메뉴 → ⚙ 설정 → 언어 → English","Naver Map in English: Naver Map app → ☰ Menu → ⚙ Settings → Language → English"],
  ["구글 지도는 이 앱에서 열면 영어로 열립니다","Google Maps opened from this app shows in English"],
  ["카카오맵은 한국어만 됩니다","Kakao Map is Korean only"]
];
var INFO_AT=0;
function infoPaint(){ document.getElementById("infot").textContent=LANG==="en"?"Information":"안내";
  for(var i=0;i<3;i++){ var e=document.getElementById("pl"+i), k=INFO_AT+i, it=INFO[k]; e.innerHTML=it?'<span>'+esc(LANG==="en"?it[1]:it[0])+'</span>':''; e.dataset.k=it?k:""; }
  document.getElementById("infomore").hidden=INFO.length<=3; }
document.getElementById("infomore").onclick=function(){ INFO_AT+=3; if(INFO_AT>=INFO.length) INFO_AT=0; infoPaint(); };   // ⋮ — 다음 줄들이 판자로 들어온다
[0,1,2].forEach(function(i){ document.getElementById("pl"+i).onclick=function(){ var k=this.dataset.k; if(k==="") return; var it=INFO[+k];
  var b=document.createElement("div"); b.id="infopop"; b.onclick=function(e){ if(e.target===b) b.remove(); };
  b.innerHTML='<div><b>'+(LANG==="en"?"Information":"안내")+'</b><div style="margin-top:6px">'+esc(LANG==="en"?it[1]:it[0])+'</div></div>'; document.body.appendChild(b); }; });
thPaint();
paint();
infoPaint();
hitInit();
