function trainBox(a,b){ var box=document.getElementById("trn"); if(!box) return; var A=STN[a], B=STN[b];

function m3857(lat,lng){ return [lng*20037508.34/180, Math.log(Math.tan((90+lat)*Math.PI/360))/(Math.PI/180)*20037508.34/180]; }

function distShow(a,b,p0,p1){

  ZM.s=Math.max(1,Math.min(5,ZM.s)); ZM.tx=Math.min(0,Math.max(w-w*ZM.s,ZM.tx)); ZM.ty=Math.min(0,Math.max(w-w*ZM.s,ZM.ty));

    tmr=setTimeout(function(){ if(tch&&pin&&!pin.go){ distShow(tch.a,tch.b,tch.p0,tch.p1); tch=null; pin=null; } },300); },{passive:false});

      if(!pin.go&&(Math.abs(d-pin.d)>12||Math.hypot(cx-pin.cx,cy-pin.cy)>12)){ pin.go=true; clearTimeout(tmr); tch=null; }   // 움직이면 줌, 가만히 0.3초면 거리
