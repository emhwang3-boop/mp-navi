  var el=document.getElementById("treasIsle"); if(!el) return;
  function lbl(){ try{ var t; if(typeof LP==="function") t=LP(["보물섬","Treasure Island","宝島","宝岛","寶島","Isla del tesoro"]);
      else t=(typeof LANG!=="undefined"&&LANG==="ko")?"보물섬":"Treasure Island";
      var s=el.querySelector(".tiLbl"); if(s) s.textContent=t; }catch(e){} }
  lbl();
  try{ if(typeof setLang==="function" && !setLang.__tiWrap){ var _o=setLang; var w=function(){ var r=_o.apply(this,arguments); try{ lbl(); }catch(e){} return r; }; w.__tiWrap=1; setLang=w; window.setLang=w; } }catch(e){}   // 언어 바뀌면 라벨도 6개 언어로
  function play(e){ try{ if(e){ e.preventDefault(); e.stopPropagation(); } window.mpCrawlReplay && window.mpCrawlReplay(); }catch(x){} }
  el.addEventListener("click",play,false);
  el.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "||e.key==="Spacebar") play(e); },false);
  ["pointerdown","mousedown","touchstart"].forEach(function(ev){ el.addEventListener(ev,function(e){ e.stopPropagation(); },false); });   // 지도 끌기·거리재기 시작 막기 — 섬 누름은 지도 조작이 아니다
}catch(e){} })();
</script>
<script>
/* ★ 스타워즈 오프닝 크롤 인트로 (영어 고정) — 자족적, 어떤 실패에도 앱은 그대로 뜬다 (사장님 10-24)
   노출: 영어 사용자는 1회 · 다른 언어로 바꾼 사용자는 총 2회 · 그 뒤 안 뜸. mpv_crawl_n / mpv_lang_changed. 모든 localStorage 는 try/catch. */
(function(){
  try{
    var SKIP={ko:"건너뛰기",en:"Skip",es:"Saltar",ja:"スキップ",zhs:"跳过",zht:"跳過"};
    function lang(){ try{ if(typeof LANG!=="undefined"&&LANG) return LANG; return localStorage.getItem("mpv_lang")||"en"; }catch(e){ return "en"; } }
    /* 6개 언어 순서대로 — 영→일→중간→중번→스→한(한국어 맨 뒤). 한 언어 글이 화면 밖으로 다 올라가면 곧바로 다음 언어가 아래에서 이어 올라온다(빈 시간 없음, 같은 별 배경 유지) (사장님 10-25). 보물섬 유래 스토리 번역. title=제목줄, end=문단 끝 여백. */
    var TITLE='MONEY PUZZLE TOUR';
    var STORY={
      ko:[{t:'아주 먼 옛날, 내가 열 살이던 시절,'},{t:'나는 《보물섬》이라는 책을 읽었다.',end:true},{t:'그 안의 보물 지도는'},{t:'그때부터 내 마음에 남았다.',end:true},{t:'그래서 나는 한국의 지도를'},{t:'하나의 보물 지도로 그렸다 &mdash;'},{t:'모든 장소가 표식이고,'},{t:'모든 여정이 보물찾기.',end:true},{t:'한국을 찾는 모든 여행자가'},{t:'저마다의 보물을 찾아,'},{t:'집으로 가져가기를.'}],
      en:[{t:'A long, long time ago,'},{t:'when I was ten years old,'},{t:'I read a book called TREASURE ISLAND.',end:true},{t:'The treasure map inside it'},{t:'stayed in my heart ever since.',end:true},{t:'So I drew the map of Korea'},{t:'as a treasure map of its own &mdash;'},{t:'every place a mark,'},{t:'every journey a hunt.',end:true},{t:'May every traveler who visits Korea'},{t:'find their own treasure,'},{t:'and carry it home.'}],
      ja:[{t:'遠い遠い昔、私が十歳だった頃、'},{t:'『宝島』という本を読んだ。',end:true},{t:'その中の宝の地図は'},{t:'それ以来ずっと心に残っている。',end:true},{t:'だから私は韓国の地図を'},{t:'ひとつの宝の地図として描いた &mdash;'},{t:'すべての場所が印、'},{t:'すべての旅が宝探し。',end:true},{t:'韓国を訪れるすべての旅人が'},{t:'自分だけの宝を見つけ、'},{t:'家へ持ち帰れますように。'}],
      zhs:[{t:'很久很久以前，在我十岁那年，'},{t:'我读了一本叫《金银岛》的书。',end:true},{t:'书中的藏宝图'},{t:'从此留在我心中。',end:true},{t:'于是我把韩国的地图'},{t:'画成了一张藏宝图 &mdash;'},{t:'每个地方都是记号，'},{t:'每段旅程都是寻宝。',end:true},{t:'愿每位来到韩国的旅人，'},{t:'都能找到属于自己的宝藏，'},{t:'并带回家。'}],
      zht:[{t:'很久很久以前，在我十歲那年，'},{t:'我讀了一本叫《金銀島》的書。',end:true},{t:'書中的藏寶圖'},{t:'從此留在我心中。',end:true},{t:'於是我把韓國的地圖'},{t:'畫成了一張藏寶圖 &mdash;'},{t:'每個地方都是記號，'},{t:'每段旅程都是尋寶。',end:true},{t:'願每位來到韓國的旅人，'},{t:'都能找到屬於自己的寶藏，'},{t:'並帶回家。'}],
      es:[{t:'Hace mucho, mucho tiempo,'},{t:'cuando tenía diez años,'},{t:'leí un libro llamado LA ISLA DEL TESORO.',end:true},{t:'El mapa del tesoro que guardaba'},{t:'quedó en mi corazón desde entonces.',end:true},{t:'Por eso dibujé el mapa de Corea'},{t:'como su propio mapa del tesoro &mdash;'},{t:'cada lugar, una marca;'},{t:'cada viaje, una búsqueda.',end:true},{t:'Que cada viajero que visite Corea'},{t:'encuentre su propio tesoro'},{t:'y lo lleve a casa.'}]
    };
    var LANGSEQ=['en','ja','zhs','zht','es','ko'];
    function crawlHtml(lg,b0){ var LINES=[{t:TITLE,title:true}].concat(STORY[lg]||STORY.en), h='', base=(b0==null?0.4:b0), stag=1.0;
      for(var i=0;i<LINES.length;i++){ var L=LINES[i], d=(base+i*stag).toFixed(2); h+='<span class="mpc-line'+(L.title?' mpc-title':'')+(L.end?' mpc-end':'')+'" style="animation-delay:'+d+'s">'+L.t+'</span>'; } return h; }
    var ov=null, done=true, tmr=null, wtc=null, TM=[], count=false, seqIdx=0;
    function onKey(){ endAll(); }
    function removeOv(){ var o=ov; ov=null; if(o){ try{ o.style.opacity="0"; }catch(e){} setTimeout(function(){ try{ if(o.parentNode) o.parentNode.removeChild(o); }catch(e){} },850); } }
    /* 배경음악 — 애국가 (미 해군 군악대 연주, 공공영역 · Wikimedia Commons) 크롤 내내 반복, 끝·건너뛰기 때 1.5초 페이드아웃 (사장님 10-25)
       폰이 자동재생을 막으면 화면 첫 터치 때 시작 · 왼쪽 아래 「소리 켜기/끄기」 단추 (이모지 대신 글자) */
    var SND_ON={ko:"소리 켜기",en:"Sound on",ja:"音を出す",zhs:"打开声音",zht:"開啟聲音",es:"Activar sonido"},
        SND_OFF={ko:"소리 끄기",en:"Sound off",ja:"音を消す",zhs:"关闭声音",zht:"關閉聲音",es:"Silenciar"};
    var AU=null, auMute=false, auFadeT=null;
    function sndBtn(){ try{ var b=ov&&ov.querySelector(".mpc-snd"); if(b) b.textContent=((AU&&!AU.paused&&!auMute)?(SND_OFF[lang()]||SND_OFF.en):(SND_ON[lang()]||SND_ON.en)); }catch(e){} }
    function auPlay(){ if(done||auMute) return; try{ if(!AU){ AU=new Audio("audio/anthem_usnavy.mp3?v=1"); AU.loop=true; AU.preload="auto"; AU.addEventListener("playing",sndBtn); AU.addEventListener("pause",sndBtn); }
        clearInterval(auFadeT); AU.volume=0.8; var pr=AU.play(); if(pr&&pr.catch) pr.catch(function(){ sndBtn(); }); }catch(e){} sndBtn(); }
    function auFirst(){ document.removeEventListener("pointerdown",auFirst,true); document.removeEventListener("touchstart",auFirst,true); if(!done&&AU&&AU.paused&&!auMute) auPlay(); }
    function auStop(){ if(!AU) return; var a=AU; clearInterval(auFadeT); var v=a.volume, st=v/15;
      auFadeT=setInterval(function(){ v-=st; if(v<=0.01){ clearInterval(auFadeT); try{ a.pause(); a.currentTime=0; a.volume=0.8; }catch(e){} return; } try{ a.volume=v; }catch(e){} },100); }
    function endAll(){
      if(done) return; done=true; try{ auStop(); }catch(e){} try{ document.removeEventListener("pointerdown",auFirst,true); document.removeEventListener("touchstart",auFirst,true); }catch(e){}
      if(count){ try{ var n=parseInt(localStorage.getItem("mpv_crawl_n")||"0",10)||0; localStorage.setItem("mpv_crawl_n",String(n+1)); }catch(e){} }
      try{ clearTimeout(tmr); }catch(e){} try{ clearInterval(wtc); }catch(e){} TM.forEach(function(t){ try{ clearTimeout(t); clearInterval(t); }catch(e){} }); TM=[];
      try{ document.removeEventListener("keydown",onKey,true); }catch(e){}
      try{ document.documentElement.classList.remove("mpc-lock"); }catch(e){}
      removeOv();
    }
    // 이어 올리기 (사장님 10-25) — 앞 언어 글 맨 아랫줄이 화면 위쪽(원근으로 작아지며 흐려지는 구간, 높이 50%)에 닿으면 = 「사라지기 직전」
    //   다음 언어 글을 화면 아래에서 바로 들여보낸다 → 두 글이 겹쳐 이어지고 검정 빈 화면 0. 앞 글은 다 올라가면(가림 18% 위) 지운다. 마지막 언어가 다 올라가면 끝
    var HAND=0.50, GONE=0.18;
    function advance(){ if(done) return; var next=seqIdx+1; if(next>=LANGSEQ.length) return; playOne(next); }
    function playOne(idx){
      if(done) return; seqIdx=idx;
      var reduce=false; try{ reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
      if(!ov){
        ov=document.createElement("div"); ov.id="mpcrawl"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label","Intro");
        ov.innerHTML='<div class="mpc-stars"></div><div class="mpc-fade"></div><div class="mpc-persp"></div><button type="button" class="mpc-snd"></button><button type="button" class="mpc-skip"></button>';
        document.body.appendChild(ov);
        try{ ov.querySelector(".mpc-skip").textContent=(SKIP[lang()]||SKIP.en)+" ⏭"; }catch(e){}
        // 크롤 끝내기는 「건너뛰기」 단추로만 — 화면 아무 데나 누르면 끝나지 않고 애국가 재생 시작 (사장님 10-25 「가」)
        ov.addEventListener("click",function(e){ var t=e.target; if(t&&t.closest&&t.closest(".mpc-skip")){ endAll(); return; } if(t&&t.closest&&t.closest(".mpc-snd")) return; if(!done&&!auMute&&(!AU||AU.paused)) auPlay(); },false);
        try{ ov.querySelector(".mpc-snd").addEventListener("click",function(e){ e.stopPropagation(); if(AU&&!AU.paused&&!auMute){ auMute=true; auStop(); setTimeout(sndBtn,1700); } else { auMute=false; auPlay(); } },false); }catch(e){}
        sndBtn();
      }
      var persp=ov.querySelector(".mpc-persp"), last=(idx===LANGSEQ.length-1), handed=false, gone=false;
      if(reduce){ persp.innerHTML=''; }
      persp.insertAdjacentHTML("beforeend",'<div class="mpc-text'+(reduce?" mpc-static":"")+'" data-lg="'+LANGSEQ[idx]+'">'+crawlHtml(LANGSEQ[idx],idx?0:null)+'</div>');   // 2번째 언어부터 첫 줄 바로
      var txt=persp.lastElementChild;
      if(reduce){ tmr=setTimeout(function(){ if(last) endAll(); else advance(); },6000); return; }
      function hand(){ if(handed) return; handed=true; if(!last) advance(); }
      function fin(){ if(gone) return; gone=true; hand(); try{ clearInterval(iv); }catch(e){} try{ if(txt.parentNode) txt.parentNode.removeChild(txt); }catch(e){} if(last) endAll(); }
      try{ txt.addEventListener("animationend",function(e){ if(!e||e.animationName==="mpc-scroll") fin(); },false); }catch(e){}
      var iv=setInterval(function(){ try{ if(done){ clearInterval(iv); return; } var pr=persp.getBoundingClientRect(), tr=txt.getBoundingClientRect(); if(!(tr.height>0)) return;
        if(tr.bottom<=pr.top+pr.height*HAND) hand();
        if(tr.bottom<=pr.top+pr.height*GONE) fin(); }catch(e){} },100);
      TM.push(iv); TM.push(setTimeout(fin,35000));
    }
    function build(doCount){
      if(!done) return; done=false; count=!!doCount; seqIdx=0;
      try{ document.documentElement.classList.add("mpc-lock"); }catch(e){}
      document.addEventListener("keydown",onKey,true);
      playOne(0);
      auMute=false; auPlay(); document.addEventListener("pointerdown",auFirst,true); document.addEventListener("touchstart",auFirst,true);
    }
    window.mpCrawlReplay=function(){ try{ build(false); }catch(e){ endAll(); } };   // 메뉴 「인트로 다시 보기」 — 카운터 안 바꿈
    function shouldShow(){
      if(/[?&]bs=[0-9a-f]{16}/.test(location.search)) return false;   // 빙고 공유 링크로 온 사람은 크롤 없이 바로 빙고 (10-27)
      try{
        var n=parseInt(localStorage.getItem("mpv_crawl_n")||"0",10)||0;
        if(n===0) return true;
        if(n===1 && localStorage.getItem("mpv_lang_changed")==="1") return true;
        return false;
      }catch(e){ return true; }   // 저장소 막히면 한 번만 보여주되 에러 없이
    }
    function go(){ try{ if(shouldShow()) build(true); }catch(e){ try{ endAll(); }catch(x){} } }
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",go); else go();
  }catch(e){ try{ var o=document.getElementById("mpcrawl"); if(o&&o.parentNode) o.parentNode.removeChild(o); document.documentElement.classList.remove("mpc-lock"); }catch(x){} }
})();
</script>
<script>/* ⋮ 메뉴 순서 (사장님 10-30) — 여러 파일이 항목을 따로 붙여서, 붙을 때마다 이 순서로 다시 줄 세운다 */
(function(){ var ORD=["mnear_tg","mtrip","mnear_ig","mgift","mnear_am","mnear_st","mnear_em","mpg","mcopy","mref"];
  function sortM(){ var mm=document.getElementById("mm"); if(!mm) return; var now=[].map.call(mm.children,function(e){ return e.id; }).filter(function(id){ return ORD.indexOf(id)>=0; });
    var want=ORD.filter(function(id){ return now.indexOf(id)>=0; }); if(now.join()===want.join()) return;
    want.forEach(function(id){ var e=document.getElementById(id); if(e) mm.appendChild(e); }); [].slice.call(mm.children).forEach(function(e){ if(ORD.indexOf(e.id)<0) mm.appendChild(e); }); }
  function go(){ var mm=document.getElementById("mm"); if(!mm) return; sortM(); try{ new MutationObserver(sortM).observe(mm,{childList:true}); }catch(e){} }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",go); else go(); })();</script>
