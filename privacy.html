D.en={title:"Privacy Policy", eff:"Effective date: ____-__-__", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"", b:["Booman Inc. (\"the Company\") respects your privacy and complies with the Personal Information Protection Act, the Act on the Protection and Use of Location Information, and other applicable laws of the Republic of Korea. This policy applies to the tourist guide app \"Money Puzzle Tour for Korea\" (https://navi.moneypuzzle.co.kr, \"the Service\")."]},
 {h:"1. Information we collect and how", b:[
   "The Service can be used without creating an account. We collect personal information only in the following cases:",
   ["Location — your current location (latitude/longitude), when you consent",
    "Guide registration — name, photo, languages spoken, tour-guide (Tourist Interpreter Guide) license number and license photo, copy of the signed service agreement, experience, region, self-introduction, contact (email/phone)",
    "Guide request — the requester's name, contact, desired date and message",
     "Experience & ticket booking — the booker's name, email, phone number (optional) and booking details (product, date, time, number of people, language, chosen guide)",
    "Customer Voice — the contact details and message you enter",
    "Google or Apple sign-in (optional) — name, email and Google or Apple account identifier (to show event rankings and badges with your ID partly hidden, and to prevent fraudulent participation)",
    "Writing a place review (optional, Google or Apple sign-in required) — star rating, review text and date (to show reviews with your ID partly hidden, translate them with AI and screen out abusive, advertising or personal-information posts · kept until you ask us to delete it or close your account)"],
   "Collection method: entered directly by you in the app, or, if you consent to location use, read from your device's location function."]},
 {h:"2. Purpose of collection and use", b:[
   ["Location: to recommend nearby attractions, restaurants, stays and amenities, and to give directions",
    "Guide registration: to verify guide credentials, review and approve registrations, and introduce guides to travelers",
    "Guide request: to forward your request to the guide you chose and connect you",
     "Experience & ticket booking: to receive and confirm your booking, confirm payment, forward the booking to the guide you chose and carry it out, and send a confirmation email",
    "Customer Voice: to respond to your inquiries and improve the Service"]]},
 {h:"3. Location information (location-based service)", b:[
   "The Company has filed a location-based service business report under the Act on the Protection and Use of Location Information. "+PH,
   "The Service uses your current location only when you consent via the in-app consent dialog, and only while you are using the app (foreground). We do not collect location in the background.",
   "Location is used in real time only, to show recommendations or give directions, and is not stored on the Company's servers.",
   "Your current location is determined via the Google Geolocation Services API; in this process your device's location signals may be sent to Google.",
   "You may withdraw your consent or turn off the location permission at any time in your phone settings or in the app. Search and map viewing remain available without location."]},
 {h:"4. Retention and use period", b:[
   "Location: used in real time only and not stored.",
   "Guide registration data and guide-request data: automatically deleted one (1) year after registration/request. Where a law requires retention, we keep it for the required period.",
    "Experience & ticket booking data: under the Act on the Consumer Protection in Electronic Commerce, records of contracts and cancellations, payments and supply of goods or services are kept for 5 years.",
   "Google or Apple sign-in data (name, email, Google or Apple account identifier): kept to show event rankings and badges (with your ID partly hidden) and to prevent fraudulent participation, and deleted one (1) year after your last use.",
   "Karaoke usage records (song, time of use, playing time, country of access, masked user number): kept for 5 years to settle music copyright royalties. Names and email addresses are not recorded.",
   "If you request deletion, we destroy the data without delay."]},
 {h:"5. Third-party provision and processing", b:[
   "The Company does not sell personal information and does not provide it to third parties except as follows:",
   ["Google: current-location determination (Geolocation Services) and place information (Google Places)",
    "Korea Tourism Organization (TourAPI) and Kakao: attraction and place information",
    "The chosen guide: for a guide request, the requester's name, contact, desired date and message are forwarded to that guide",
    "The chosen guide: for an experience & ticket booking, the booker's name, email, phone number (optional) and booking details (product, date, time, number of people, language) are provided to that guide to carry out the booking; the guide keeps them until the booking has been completed"],
   "In the course of the Google and overseas API calls above, some information may be transferred outside Korea (to overseas servers). This is limited to what is necessary to provide the Service.",
   "We do not otherwise provide information to third parties, except where required by law or upon a lawful request from an investigative authority."]},
 {h:"6. Your rights", b:[
   "You may at any time request access to, correction or deletion of your personal information, and withdraw consent.",
   "Requests can be made to Support (+82-10-4221-7066) or by email (admin@moneypuzzle.co.kr), and we will act without delay."]},
 {h:"7. Security measures", b:[
   "The Company encrypts personal information such as guide registration data using AES-GCM, and manages it securely through an administrator-approval process and access controls."]},
 {h:"8. Privacy Officer", b:[
   "For questions, complaints or remedies regarding personal information, please contact:",
   ["Privacy Officer: Hwang Euiman",
    "Support: +82-10-4221-7066",
    "Email: admin@moneypuzzle.co.kr"]]},
 {h:"9. Children", b:[
   "The Service is not directed to children and does not knowingly collect children's personal information."]},
 {h:"10. Changes to this policy", b:[
   "If this policy changes, we will announce the effective date and the changes through the app or this page."]}
 ]};

D.ja={title:"個人情報処理方針", eff:"施行日：    年  月  日", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"", b:["株式会社 부만（Booman Inc.、以下「当社」）は、韓国の「個人情報保護法」および「位置情報の保護及び利用等に関する法律」等の関連法令を遵守し、利用者の個人情報を大切に保護します。本方針は、外国人観光案内アプリ「Money Puzzle Tour for Korea」（https://navi.moneypuzzle.co.kr、以下「本サービス」）に適用されます。"]},
 {h:"1. 収集する個人情報の項目および方法", b:[
   "本サービスは会員登録なしで利用でき、次の場合にのみ個人情報を収集します。",
   ["位置情報 — 利用者が同意した場合の現在地（緯度・経度）",
    "ガイド登録時 — 氏名、写真、使用言語、観光通訳案内士の資格番号および資格証の写真、署名済み業務委託契約書の写し、経歴、活動地域、自己紹介、連絡先（メール・電話番号）",
    "ガイド依頼時 — 依頼者の氏名、連絡先、希望日、依頼メッセージ",
     "体験・入場券の予約時 — 予約者の氏名、メールアドレス、電話番号（任意）、予約内容（商品・日付・時間・人数・言語・選択したガイド）",
    "お客様の声 — 利用者が入力した連絡先および問い合わせ内容",
    "GoogleまたはAppleログイン時（任意）— 氏名、メールアドレス、GoogleまたはAppleアカウント識別子（イベントの順位・バッジ表示（IDの一部を隠して表示）・不正参加防止のため）",
    "名所レビュー投稿時（任意、GoogleまたはAppleログインが必要）— 星の評価、レビュー本文、投稿日（レビュー表示（IDの一部を隠して表示）・AI翻訳および暴言・広告・個人情報を含む投稿の確認のため · 保管：削除依頼または退会時まで）"],
   "収集方法：アプリ画面で利用者が直接入力するか、位置情報の利用に同意した場合に端末の位置機能を通じて収集します。"]},
 {h:"2. 収集・利用の目的", b:[
   ["位置情報：周辺の観光地・グルメ・宿泊・施設のおすすめおよび道案内",
    "ガイド登録情報：ガイド資格の確認、登録審査・承認、利用者へのガイド紹介",
    "ガイド依頼情報：選択したガイドへの依頼の転送および連絡",
     "体験・入場券の予約情報：予約の受付・確認、決済確認、選択したガイドへの予約の伝達と予約の履行、予約確認メールの送信",
    "お客様の声：問い合わせ・ご意見への対応およびサービス改善"]]},
 {h:"3. 位置情報の取り扱い（位置基盤サービス）", b:[
   "当社は「位置情報の保護及び利用等に関する法律」に基づき、位置基盤サービス事業の届出を行いました。"+PH,
   "本サービスは、利用者がアプリ内の同意画面で同意した場合に限り、アプリの利用中（フォアグラウンド）にのみ現在地を利用します。バックグラウンドでは位置情報を収集しません。",
   "位置情報は、おすすめ結果の表示や道案内の際にリアルタイムでのみ利用し、当社サーバーには保存しません。",
   "現在地の測定は Google Geolocation Services API を通じて提供され、その過程で端末の位置信号が Google に送信される場合があります。",
   "利用者は端末の設定やアプリ内でいつでも位置利用の同意を撤回し、権限をオフにできます。その場合でも検索と地図の閲覧は引き続き利用できます。"]},
 {h:"4. 保有および利用期間", b:[
   "位置情報：リアルタイムでのみ利用し、保存しません。",
   "ガイド登録情報およびガイド依頼情報：登録・依頼日から1年を経過すると自動的に削除します。ただし法令が保存を求める場合は当該期間保管します。",
    "体験・入場券の予約情報：「電子商取引等における消費者保護に関する法律」に基づき、契約・申込撤回、代金決済および商品等の供給に関する記録は5年間保管します。",
   "GoogleまたはAppleログイン情報（氏名・メールアドレス・GoogleまたはAppleアカウント識別子）：イベントの順位・バッジ表示（IDの一部を隠して表示）および不正参加防止のために保管し、最終利用から1年を経過すると削除します。",
   "カラオケ利用記録（曲・利用日時・再生時間・接続国・一部を隠した利用者番号）：音楽著作権使用料の精算のため5年間保管します。氏名・メールアドレスは記録しません。",
   "利用者が削除を求めた場合は遅滞なく破棄します。"]},
 {h:"5. 第三者提供および処理委託", b:[
   "当社は利用者の個人情報を販売せず、次の場合を除き第三者に提供しません。",
   ["Google：現在地の測定（Geolocation Services）および場所情報の提供（Google Places）",
    "韓国観光公社（TourAPI）・Kakao：観光地・場所情報の提供",
    "選択したガイド：ガイド依頼時、依頼者の氏名・連絡先・希望日・メッセージを当該ガイドへ転送",
    "選択したガイド：体験・入場券の予約時、予約者の氏名・メールアドレス・電話番号（任意）・予約内容（商品・日付・時間・人数・言語）を予約履行の目的で当該ガイドに提供し、ガイドは予約の履行が終わるまで保有します"],
   "上記の Google および海外 API 呼び出しの過程で、一部の情報が韓国国外（海外サーバー）へ転送される場合があります。これはサービス提供に必要な範囲に限られます。",
   "そのほか、法令に根拠がある場合や捜査機関の適法な要請がある場合を除き、第三者には提供しません。"]},
 {h:"6. 利用者の権利", b:[
   "利用者はいつでも自身の個人情報の閲覧・訂正・削除を求め、同意を撤回できます。",
   "ご請求はカスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）で行え、当社は遅滞なく対応します。"]},
 {h:"7. 安全性確保の措置", b:[
   "当社はガイド登録情報などの個人情報を AES-GCM 方式で暗号化して保存し、管理者の承認手続きおよびアクセス権限の統制により安全に管理します。"]},
 {h:"8. 個人情報保護責任者", b:[
   "個人情報の取り扱いに関する問い合わせ・苦情・救済は、下記の保護責任者にご連絡ください。",
   ["個人情報保護責任者：黄義晩（Hwang Euiman）",
    "カスタマーセンター：+82-10-4221-7066",
    "メール：admin@moneypuzzle.co.kr"]]},
 {h:"9. 児童の個人情報", b:[
   "本サービスは児童を対象とせず、児童の個人情報を意図的に収集しません。"]},
 {h:"10. 方針の変更", b:[
   "本方針が変更される場合、施行日および変更内容をアプリまたは本ページで告知します。"]}
 ]};

D.zhs={title:"隐私政策", eff:"施行日期：    年  月  日", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"", b:["Booman Inc.（株式会社 부만，以下称\"本公司\"）遵守韩国《个人信息保护法》《位置信息的保护及利用等相关法律》等相关法律，珍视并保护用户的个人信息。本政策适用于面向外国游客的旅游向导应用\"Money Puzzle Tour for Korea\"（https://navi.moneypuzzle.co.kr，以下称\"本服务\"）。"]},
 {h:"1. 收集的个人信息项目及方式", b:[
   "本服务无需注册即可使用，仅在以下情况收集个人信息：",
   ["位置信息 — 用户同意时的当前位置（经纬度）",
    "向导注册时 — 姓名、照片、可用语言、观光翻译向导资格证号及资格证照片、已签名的业务委托合同副本、经历、活动地区、自我介绍、联系方式（邮箱·电话）",
    "向导预约时 — 申请人姓名、联系方式、期望日期、留言",
     "预订体验·门票时 — 预订人姓名、电子邮箱、电话号码（可选）、预订内容（商品·日期·时间·人数·语言·所选向导）",
    "客户之声 — 用户填写的联系方式及咨询内容",
    "使用Google或Apple登录时（可选）— 姓名、电子邮箱、Google或Apple账号标识（用于显示活动排名和徽章（账号部分隐藏）及防止违规参与）",
    "发表景点评价时（可选，需使用Google或Apple登录）— 星级、评价内容、发表日期（用于显示评价（账号部分隐藏）、AI翻译及审核辱骂、广告、个人信息内容 · 保存至您要求删除或注销账号为止）"],
   "收集方式：由用户在应用中直接填写，或在同意使用位置时通过设备的定位功能收集。"]},
 {h:"2. 收集与使用目的", b:[
   ["位置信息：推荐周边景点·美食·住宿·便利设施并提供路线指引",
    "向导注册信息：核实向导资格、注册审核与批准、向用户介绍向导",
    "向导预约信息：将请求转交给所选向导并进行连接",
     "体验·门票预订信息：受理和确认预订、确认付款、将预订转交给所选向导并履行预订、发送预订确认邮件",
    "客户之声：回复咨询·意见并改善服务"]]},
 {h:"3. 位置信息的处理（位置信息服务）", b:[
   "本公司已依据《位置信息的保护及利用等相关法律》办理位置信息服务业务申报。"+PH,
   "本服务仅在用户通过应用内同意界面同意后，且仅在使用应用期间（前台）使用当前位置，不在后台收集位置信息。",
   "位置信息仅在显示推荐结果或提供路线指引时实时使用，不存储于本公司服务器。",
   "当前位置通过 Google Geolocation Services API 测定，此过程中设备的位置信号可能发送至 Google。",
   "用户可随时在手机设置或应用内撤回位置使用同意或关闭权限，届时搜索与地图浏览仍可正常使用。"]},
 {h:"4. 保存及使用期限", b:[
   "位置信息：仅实时使用，不予存储。",
   "向导注册信息及向导预约信息：自注册·请求之日起满1年自动删除。法律要求保存的，按相应期限保管。",
    "体验·门票预订信息：根据韩国《电子商务等消费者保护法》，有关合同·撤回要约、货款结算及商品等供应的记录保存5年。",
   "Google或Apple登录信息（姓名·电子邮箱·Google或Apple账号标识）：为显示活动排名和徽章（账号部分隐藏）及防止违规参与而保存，自最后一次使用起满1年后删除。",
   "练歌房使用记录（歌曲·使用时间·播放时长·访问国家·部分隐藏的用户编号）：为结算音乐著作权使用费保存5年，不记录姓名和电子邮箱。",
   "用户请求删除时，立即予以销毁。"]},
 {h:"5. 向第三方提供及处理委托", b:[
   "本公司不出售用户个人信息，除以下情形外不向第三方提供：",
   ["Google：当前位置测定（Geolocation Services）及场所信息提供（Google Places）",
    "韩国观光公社（TourAPI）·Kakao：景点·场所信息提供",
    "所选向导：向导预约时，将申请人的姓名·联系方式·期望日期·留言转交给该向导",
    "所选向导：预订体验·门票时，为履行预订，将预订人的姓名·电子邮箱·电话号码（可选）·预订内容（商品·日期·时间·人数·语言）提供给该向导，向导保存至预订履行完毕为止"],
   "在上述 Google 及海外 API 调用过程中，部分信息可能传输至韩国境外（海外服务器）。此仅限于提供服务所必需的范围。",
   "除法律有依据或侦查机关提出合法请求外，不向第三方提供。"]},
 {h:"6. 用户的权利", b:[
   "用户可随时请求查阅·更正·删除本人个人信息，并撤回同意。",
   "可通过客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）提出，本公司将及时处理。"]},
 {h:"7. 安全保障措施", b:[
   "本公司以 AES-GCM 方式加密存储向导注册信息等个人信息，并通过管理员审批流程及访问权限控制进行安全管理。"]},
 {h:"8. 个人信息保护负责人", b:[
   "有关个人信息处理的咨询·投诉·救济，请联系下列负责人：",
   ["个人信息保护负责人：Hwang Euiman",
    "客服：+82-10-4221-7066",
    "邮箱：admin@moneypuzzle.co.kr"]]},
 {h:"9. 儿童个人信息", b:[
   "本服务不以儿童为对象，不会有意收集儿童的个人信息。"]},
 {h:"10. 政策变更", b:[
   "本政策如有变更，将通过应用或本页面公告施行日期及变更内容。"]}
 ]};

 {h:"5. 向第三方提供及處理委託", b:[

D.es={title:"Política de Privacidad", eff:"Fecha de entrada en vigor: ____-__-__", app:"Money Puzzle Tour for Korea",
 sec:[
 {h:"", b:["Booman Inc. (\"la Empresa\") respeta su privacidad y cumple con la Ley de Protección de Información Personal, la Ley sobre la Protección y el Uso de la Información de Ubicación y demás leyes aplicables de la República de Corea. Esta política se aplica a la app de guía turística \"Money Puzzle Tour for Korea\" (https://navi.moneypuzzle.co.kr, \"el Servicio\")."]},
 {h:"1. Información que recopilamos y cómo", b:[
   "El Servicio puede usarse sin crear una cuenta. Solo recopilamos datos personales en los siguientes casos:",
   ["Ubicación — su ubicación actual (latitud/longitud), cuando usted da su consentimiento",
    "Registro de guía — nombre, foto, idiomas, número de licencia de guía-intérprete turístico y foto de la licencia, copia del contrato de prestación de servicios firmado, experiencia, región, presentación y contacto (correo/teléfono)",
    "Solicitud de guía — nombre, contacto, fecha deseada y mensaje del solicitante",
     "Reserva de experiencias y entradas — nombre, correo electrónico, teléfono (opcional) y datos de la reserva (producto, fecha, hora, número de personas, idioma, guía elegido)",
    "Voz del Cliente — el contacto y el mensaje que usted introduce",
    "Inicio de sesión con Google o Apple (opcional) — nombre, correo electrónico e identificador de la cuenta de Google o Apple (para mostrar la clasificación y las insignias de los eventos con su ID parcialmente oculto, y prevenir la participación fraudulenta)",
    "Al escribir una reseña de un lugar (opcional, requiere iniciar sesión con Google o Apple) — puntuación, texto de la reseña y fecha (para mostrar las reseñas con su ID parcialmente oculto, traducirlas con IA y filtrar publicaciones ofensivas, publicitarias o con datos personales · se conservan hasta que solicite su eliminación o cierre su cuenta)"],
   "Método de recopilación: introducido directamente por usted en la app o, si consiente el uso de la ubicación, leído de la función de ubicación de su dispositivo."]},
 {h:"2. Finalidad de la recopilación y el uso", b:[
   ["Ubicación: recomendar atracciones, restaurantes, alojamientos y servicios cercanos, y dar indicaciones",
    "Registro de guía: verificar credenciales, revisar y aprobar registros, y presentar guías a los viajeros",
    "Solicitud de guía: reenviar su solicitud al guía elegido y ponerlos en contacto",
     "Reserva de experiencias y entradas: recibir y confirmar su reserva, confirmar el pago, enviar la reserva al guía elegido y llevarla a cabo, y enviar un correo de confirmación",
    "Voz del Cliente: responder a sus consultas y mejorar el Servicio"]]},
 {h:"3. Información de ubicación (servicio basado en ubicación)", b:[
   "La Empresa ha presentado la declaración de actividad de servicio basado en ubicación conforme a la Ley sobre la Protección y el Uso de la Información de Ubicación. "+PH,
   "El Servicio usa su ubicación actual solo cuando usted consiente mediante el diálogo de consentimiento de la app, y únicamente mientras usa la app (primer plano). No recopilamos la ubicación en segundo plano.",
   "La ubicación se usa solo en tiempo real para mostrar recomendaciones o indicaciones, y no se almacena en los servidores de la Empresa.",
   "Su ubicación actual se determina mediante la API de Google Geolocation Services; en este proceso las señales de ubicación de su dispositivo pueden enviarse a Google.",
   "Puede retirar su consentimiento o desactivar el permiso de ubicación en cualquier momento en los ajustes de su teléfono o en la app. La búsqueda y el mapa siguen disponibles sin la ubicación."]},
 {h:"4. Plazo de conservación y uso", b:[
   "Ubicación: se usa solo en tiempo real y no se almacena.",
   "Datos de registro de guía y de solicitud de guía: se eliminan automáticamente un (1) año después del registro/solicitud. Cuando la ley exija conservación, los guardamos por el plazo requerido.",
    "Datos de reservas de experiencias y entradas: según la Ley de Protección del Consumidor en el Comercio Electrónico de Corea, los registros de contratos y desistimientos, pagos y suministro de bienes o servicios se conservan 5 años.",
   "Datos de inicio de sesión con Google o Apple (nombre, correo electrónico, identificador de la cuenta de Google o Apple): se conservan para mostrar la clasificación y las insignias de los eventos (con su ID parcialmente oculto) y prevenir la participación fraudulenta, y se eliminan un (1) año después de su último uso.",
   "Registros de uso del karaoke (canción, hora de uso, tiempo de reproducción, país de acceso y número de usuario enmascarado): se conservan 5 años para liquidar los derechos de autor musicales. No se registran nombres ni correos electrónicos.",
   "Si usted solicita la eliminación, destruimos los datos sin demora."]},
 {h:"5. Cesión a terceros y encargo del tratamiento", b:[
   "La Empresa no vende datos personales y no los cede a terceros salvo en los siguientes casos:",
   ["Google: determinación de la ubicación actual (Geolocation Services) e información de lugares (Google Places)",
    "Organización de Turismo de Corea (TourAPI) y Kakao: información de atracciones y lugares",
    "El guía elegido: en una solicitud de guía, se reenvían a ese guía el nombre, el contacto, la fecha deseada y el mensaje del solicitante",
    "El guía elegido: en una reserva de experiencias y entradas, el nombre, correo electrónico, teléfono (opcional) y datos de la reserva (producto, fecha, hora, número de personas, idioma) se facilitan a ese guía para llevar a cabo la reserva; el guía los conserva hasta que se haya completado la reserva"],
   "Durante las llamadas a Google y a las API en el extranjero antes mencionadas, parte de la información puede transferirse fuera de Corea (a servidores en el extranjero). Esto se limita a lo necesario para prestar el Servicio.",
   "Por lo demás, no cedemos información a terceros, salvo cuando lo exija la ley o ante una solicitud legítima de una autoridad investigadora."]},
 {h:"6. Sus derechos", b:[
   "Puede en cualquier momento solicitar el acceso, la rectificación o la eliminación de sus datos personales y retirar su consentimiento.",
   "Las solicitudes pueden hacerse a Atención (+82-10-4221-7066) o por correo (admin@moneypuzzle.co.kr), y actuaremos sin demora."]},
 {h:"7. Medidas de seguridad", b:[
   "La Empresa cifra los datos personales, como los del registro de guías, mediante AES-GCM y los gestiona de forma segura con un proceso de aprobación por administrador y controles de acceso."]},
 {h:"8. Responsable de privacidad", b:[
   "Para consultas, reclamaciones o reparación relativas a los datos personales, puede contactar con:",
   ["Responsable de privacidad: Hwang Euiman",
    "Atención: +82-10-4221-7066",
    "Correo: admin@moneypuzzle.co.kr"]]},
 {h:"9. Menores", b:[
   "El Servicio no está dirigido a menores y no recopila conscientemente datos personales de menores."]},
 {h:"10. Cambios en esta política", b:[
   "Si esta política cambia, anunciaremos la fecha de entrada en vigor y los cambios a través de la app o de esta página."]}
 ]};

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
/* keep our own placeholder/email/anchor HTML, escape the rest */
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>').replace(/&lt;span class="ph"&gt;([^&]*)&lt;\/span&gt;/g,'<span class="ph">$1</span>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://navi.moneypuzzle.co.kr/?lang="+lang;
  document.title=d.title+" · Money Puzzle Tour for Korea";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
</body>
</html>
