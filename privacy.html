   "위 Google·Apple·Resend·Anthropic·텔레그램·Cloudflare 등 해외 서비스를 이용하는 과정에서 일부 정보가 국외(해외 서버)로 전송될 수 있습니다. 이는 서비스 제공에 꼭 필요한 범위로 한정됩니다.",
   "그 밖에 법령에 근거가 있거나 수사기관의 적법한 요청이 있는 경우를 제외하고는 제3자에게 제공하지 않습니다."]},
 {h:"6. 이용자의 권리와 행사 방법", b:[
   "이용자는 언제든지 자신의 개인정보에 대한 열람·정정·삭제를 요청하고 동의를 철회할 수 있습니다.",
   "요청은 고객센터(010-4221-7066) 또는 이메일(admin@moneypuzzle.co.kr)로 할 수 있으며, 회사는 지체 없이 처리합니다."]},
 {h:"7. 개인정보의 안전성 확보 조치", b:[
   "회사는 가이드 등록 정보 등 개인정보를 AES-GCM 방식으로 암호화하여 저장하고, 관리자 승인 절차 및 접근 권한 통제를 통해 안전하게 관리합니다."]},
 {h:"8. 개인정보 보호책임자", b:[
   "개인정보 처리에 관한 문의·불만·피해 구제는 아래 보호책임자에게 연락하실 수 있습니다.",
   ["개인정보 보호책임자: 황의만",
    "고객센터: 010-4221-7066",
    "이메일: admin@moneypuzzle.co.kr"]]},
 {h:"9. 아동의 개인정보", b:[
   "서비스는 아동을 대상으로 하지 않으며, 아동의 개인정보를 의도적으로 수집하지 않습니다."]},
 {h:"10. 방침의 변경", b:[
   "본 방침이 변경되는 경우 시행일과 변경 내용을 앱 또는 본 페이지를 통해 공지합니다."]},
 {h:"언어", b:["이 방침은 한국어로 작성되었으며, 다른 언어 번역본과 내용이 다를 때는 한국어판이 우선합니다."]}
 ]};

D.en={title:"Privacy Policy", eff:"Effective date: January 1, 2027", app:"MosaicTrip",
 sec:[
 {h:"", b:["Booman Inc. (\"the Company\") respects your privacy and complies with the Personal Information Protection Act, the Act on the Protection and Use of Location Information, and other applicable laws of the Republic of Korea. This policy applies to the tourist guide app \"MosaicTrip\" (https://navi.moneypuzzle.co.kr, \"the Service\")."]},
 {h:"1. Information we collect and how", b:[
   "The Service can be used without creating an account. We collect personal information only in the following cases:",
   ["Location — your current location (latitude/longitude), when you consent",
    "Guide registration — name, photo, languages spoken, tour-guide (Tourist Interpreter Guide) license number and license photo, copy of the signed service agreement, experience, region, self-introduction, contact (email/phone)",
     "Booking a travel product (Group Tour, Travel with Guide, Guide itinerary review) — the booker's name, email, mobile number and booking details (product, date, time, number of people, language, chosen guide, notes, chosen shop menu items). For a Guide itinerary review, we receive the email for the result, the plan to be reviewed and your notes.",
    "Chat room with your guide — messages exchanged between you and the guide, and the time sent (messages are stored encrypted)",
    "Sending your plan to a guide — your name and the plan (PDF and link). The email address you enter for “Email it to me” is used only to send the email and is not stored.",
    "If you are signed in — your “My trip” plans and stays, and your “My bookings” list (stored in your account so you can see them on all your signed-in devices)",
    "Customer board — nickname, message, time posted, screen language, and a value that confirms the writer (for public posts, a device identifier and, if you are signed in, an account identifier; for private posts, the password). These values are stored one-way encrypted, and the IP address used to limit the number of posts is not stored in its original form.",
    "Google or Apple sign-in (optional) — name, email and Google or Apple account identifier (to prevent fraudulent participation)",
     "Email code sign-in (optional) — email address (to send the sign-in code and prevent fraudulent participation). The code itself is not stored, and it can't be used after 10 minutes or after 5 wrong tries. If a Google or Apple account uses the same email, they are linked as one account. The IP address used to limit code requests is not stored in its original form.",
    "Writing a place review (optional, sign-in required) — star rating, review text and date (to show reviews with your ID partly hidden, translate them with AI and screen out abusive, advertising or personal-information posts · kept until you ask us to delete it or your sign-in record is deleted)"],
   "Collection method: entered directly by you in the app, or, if you consent to location use, read from your device's location function."]},
 {h:"2. Purpose of collection and use", b:[
   ["Location: to recommend nearby attractions, restaurants, stays and amenities, and to give directions",
    "Guide registration: to verify guide credentials, review and approve registrations, and introduce guides to travelers",
     "Travel product bookings: to receive and confirm your booking, confirm payment, pass the booking to the assigned guide and shop and carry it out, and send booking emails",
    "Chat room and sending plans: to let you and the guide contact each other, and to deliver your plan to a guide",
    "“My trip” and “My bookings”: to show the same plans and bookings on all your signed-in devices",
    "Customer board: to respond to your questions and feedback, improve the Service, confirm the writer when a post is deleted, and prevent spam",
     "Sign-in data: to identify signed-in users, prevent fraudulent participation and send email sign-in codes"]]},
 {h:"3. Location information (location-based service)", b:[
   "The Company has filed a location-based service business report under the Act on the Protection and Use of Location Information. "+PH,
   "The Service uses your current location only when you consent via the in-app consent dialog, and only while you are using the app (foreground). We do not collect location in the background.",
   "Location is used in real time only, for nearby recommendations, search and directions, and is not stored on the Company's servers. However, the location-use confirmation records required by the Act on the Protection and Use of Location Information (date and time, device identifier and service name, without coordinates) are kept for 6 months and then destroyed.",
   "Your current location is determined by your device's location function; depending on the device, a location information provider (Google Geolocation Services, Apple Core Location) determines it. In this process your device's location signals may be sent to Google or Apple.",
   "You may turn off the location permission at any time in your phone (browser) settings, or ask Support or email us to withdraw your consent. Search and map viewing remain available without location."]},
 {h:"4. Retention and use period", b:[
   "Location: used in real time only and not stored. Location-use confirmation records are kept for 6 months.",
   "Guide registration data: kept until the registration is deleted, and destroyed without delay if the guide asks for deletion.",
   "Records of plans sent to a guide (name): automatically deleted one (1) year after sending. Where a law requires retention, we keep it for the required period.",
    "Travel product booking data: under the Act on the Consumer Protection in Electronic Commerce, records of contracts and cancellations, payments and supply of goods or services are kept for 5 years.",
   "Sign-in data (name, email and account identifier for Google or Apple sign-in; email address for email code sign-in): kept to prevent fraudulent participation, and deleted one (1) year after your last use. Sign-in codes are valid for 10 minutes only and are deleted as soon as you sign in.",
    "Customer board posts: kept until the writer or an administrator deletes them.",
    "Chat room messages: automatically deleted one (1) year after the chat was last used.",
    "“My trip” data: deleted together with your account 1 year after your last use, or earlier without delay if you ask us.",
   "If you request deletion, we destroy the data without delay."]},
 {h:"5. Third-party provision and processing", b:[
   "The Company does not sell personal information and does not provide it to third parties except as follows:",
   ["Google: place information (Google Places) and Google sign-in",
    "Apple: Apple sign-in",
    "Kakao and Korea Tourism Organization (TourAPI): place search and tourist information — the location the search is based on (your current coordinates, if you use your current location)",
    "ODsay and TMAP: transit and walking directions — start and destination coordinates (your current coordinates, if you start from your current location)",
    "The assigned guide for your booking: the booker's name, contact (email and mobile number), booking details (product, date, time, number of people, language, notes) and chat messages are provided to carry out the booking; the guide keeps them until the booking has been completed. For a Guide itinerary review, only the plan and your notes are provided.",
    "A guide you send your plan to: your name and the plan (PDF and link)",
    "The shop of a Group Tour with shop menu items: the booker's name, the assigned guide's name and the chosen menu items (mobile voucher)",
    "KG Inicis and PortOne: payment processing for travel products — the payer's name, email and mobile number, order number and amount",
    "Resend (USA): sending emails (sign-in codes, booking emails and plan emails) — the recipient's email address and the email content",
    "Aligo: booking text messages to guides and shops — the recipient's mobile number and the message content",
    "Anthropic (USA): AI trip planning, and translating and screening place reviews — the trip conditions and review text you enter",
    "Telegram: notifying Company staff of new bookings, board posts, etc. — the booker's name, contact and booking details",
    "Cloudflare (USA): running the Service's servers and storing data — the data above (personal information is stored encrypted)"],
   "In the course of using Google, Apple, Resend, Anthropic, Telegram, Cloudflare and the other overseas services above, some information may be transferred outside Korea (to overseas servers). This is limited to what is necessary to provide the Service.",
   "We do not otherwise provide information to third parties, except where required by law or upon a lawful request from an investigative authority."]},
 {h:"6. Your rights", b:[
   "You may at any time request access to, correction or deletion of your personal information, and withdraw consent.",
   "Requests can be made to Support (+82-10-4221-7066) or by email (admin@moneypuzzle.co.kr), and we will act without delay."]},
 {h:"7. Security measures", b:[
   "The Company encrypts personal information such as guide registration data using AES-GCM, and manages it securely through an administrator-approval process and access controls."]},
 {h:"8. Privacy Officer", b:[
   "For questions, complaints or remedies regarding personal information, please contact:",
   ["Privacy Officer: Hwang Euiman",
    "Support: +82-10-4221-7066",
    "Email: admin@moneypuzzle.co.kr"]]},
 {h:"9. Children", b:[
   "The Service is not directed to children and does not knowingly collect children's personal information."]},
 {h:"10. Changes to this policy", b:[
   "If this policy changes, we will announce the effective date and the changes through the app or this page."]},
 {h:"Language", b:["This Policy is written in Korean. If a translation in another language differs from the Korean version, the Korean version prevails."]}
 ]};

D.ja={title:"個人情報処理方針", eff:"施行日：2027年1月1日", app:"MosaicTrip",
 sec:[
 {h:"", b:["株式会社 富滿（Booman Inc.、以下「当社」）は、韓国の「個人情報保護法」および「位置情報の保護及び利用等に関する法律」等の関連法令を遵守し、利用者の個人情報を大切に保護します。本方針は、外国人観光案内アプリ「MosaicTrip」（https://navi.moneypuzzle.co.kr、以下「本サービス」）に適用されます。"]},
 {h:"1. 収集する個人情報の項目および方法", b:[
   "本サービスは会員登録なしで利用でき、次の場合にのみ個人情報を収集します。",
   ["位置情報 — 利用者が同意した場合の現在地（緯度・経度）",
    "ガイド登録時 — 氏名、写真、使用言語、観光通訳案内士の資格番号および資格証の写真、署名済み業務委託契約書の写し、経歴、活動地域、自己紹介、連絡先（メール・電話番号）",
     "旅行商品（パッケージツアー・ガイド同行の自由旅行・ガイドによる日程チェック）の予約時 — 予約者の氏名、メールアドレス、携帯電話番号、予約内容（商品・日付・時間・人数・言語・選択したガイド・依頼メモ・選んだお店のメニュー）。ガイドによる日程チェックでは、結果を受け取るメールアドレス、チェックする日程、依頼メモを受け取ります。",
    "ガイドとのチャットルーム利用時 — 利用者とガイドがやり取りしたメッセージ、送信日時（メッセージは暗号化して保存）",
    "ガイドに日程を送るとき — 氏名、日程（PDF・リンク）。「自分のメールで受け取る」に入力したメールアドレスは送信にのみ使い、保存しません。",
    "ログインしている場合 — 「マイ旅行」の日程・宿泊先と「予約一覧」（ログインした複数の端末で同じ内容を見るためにアカウントに保存）",
    "お客様掲示板 — ニックネーム、投稿内容、投稿日時、画面の言語、投稿者確認用の値（公開投稿は端末識別子とログイン時のアカウント識別子、非公開投稿はパスワード）。確認用の値は一方向暗号化して保存し、投稿数の制限に使うIPアドレスも元の値は保存しません。",
    "GoogleまたはAppleログイン時（任意）— 氏名、メールアドレス、GoogleまたはAppleアカウント識別子（不正参加防止のため）",
     "メール認証番号ログイン時（任意）— メールアドレス（認証番号の送信および不正参加防止のため）。認証番号そのものは保存せず、10分を過ぎるか5回間違えると使えなくなります。同じメールアドレスのGoogleまたはAppleアカウントがある場合は、1つのアカウントとしてつなげます。送信回数の制限に使うIPアドレスは元の値を保存しません。",
    "名所レビュー投稿時（任意、ログインが必要）— 星の評価、レビュー本文、投稿日（レビュー表示（IDの一部を隠して表示）・AI翻訳および暴言・広告・個人情報を含む投稿の確認のため · 保管：削除依頼時またはログイン記録が削除されるまで）"],
   "収集方法：アプリ画面で利用者が直接入力するか、位置情報の利用に同意した場合に端末の位置機能を通じて収集します。"]},
 {h:"2. 収集・利用の目的", b:[
   ["位置情報：周辺の観光地・グルメ・宿泊・施設のおすすめおよび道案内",
    "ガイド登録情報：ガイド資格の確認、登録審査・承認、利用者へのガイド紹介",
     "旅行商品の予約情報：予約の受付・確認、決済確認、担当ガイド・お店への予約の伝達と予約の履行、予約案内メールの送信",
    "チャットルーム・日程送信：利用者とガイドの連絡、ガイドへの日程の伝達",
    "「マイ旅行」・「予約一覧」：ログインした複数の端末で同じ日程と予約を表示",
    "お客様掲示板：問い合わせ・ご意見への回答およびサービス改善、投稿削除時の投稿者確認、連続投稿の防止",
     "ログイン情報：ログインした利用者の確認、不正参加防止、メール認証番号の送信"]]},
 {h:"3. 位置情報の取り扱い（位置基盤サービス）", b:[
   "当社は「位置情報の保護及び利用等に関する法律」に基づき、位置基盤サービス事業の届出を行いました。"+PH,
   "本サービスは、利用者がアプリ内の同意画面で同意した場合に限り、アプリの利用中（フォアグラウンド）にのみ現在地を利用します。バックグラウンドでは位置情報を収集しません。",
   "位置情報は、周辺のおすすめ・検索・道案内の際にリアルタイムでのみ利用し、当社サーバーには保存しません。ただし「位置情報の保護及び利用等に関する法律」に基づく位置情報の利用事実確認資料（日時・端末識別子・サービス名、座標は含まない）は6か月間保管した後に破棄します。",
   "現在地は利用者の端末の位置機能で測定し、端末に応じて位置情報事業者（Google Geolocation Services、Apple Core Location）が位置を測定します。その過程で端末の位置信号が Google または Apple に送信される場合があります。",
   "利用者はいつでも端末（ブラウザ）の設定で位置情報の権限をオフにするか、カスタマーセンター・メールで位置利用の同意の撤回を求めることができます。その場合でも検索と地図の閲覧は引き続き利用できます。"]},
 {h:"4. 保有および利用期間", b:[
   "位置情報：リアルタイムでのみ利用し、保存しません。位置情報の利用事実確認資料は6か月間保管します。",
   "ガイド登録情報：登録を削除するまで保管し、ガイドが削除を求めた場合は遅滞なく破棄します。",
   "ガイドへの日程送信の記録（氏名）：送信日から1年を経過すると自動的に削除します。ただし法令が保存を求める場合は当該期間保管します。",
    "旅行商品の予約情報：「電子商取引等における消費者保護に関する法律」に基づき、契約・申込撤回、代金決済および商品等の供給に関する記録は5年間保管します。",
   "ログイン情報（GoogleまたはAppleログインの氏名・メールアドレス・アカウント識別子、メール認証番号ログインのメールアドレス）：不正参加防止のために保管し、最終利用から1年を経過すると削除します。認証番号の有効期限は10分で、ログインに成功するとすぐに削除します。",
    "お客様掲示板の投稿：投稿者または管理者が削除するまで保管します。",
    "チャットルームのメッセージ：最終利用から1年を経過すると自動的に削除します。",
    "「マイ旅行」のデータ：最後の利用から1年が過ぎるとアカウントと一緒に削除し、それより前でも利用者の求めがあれば遅滞なく削除します。",
   "利用者が削除を求めた場合は遅滞なく破棄します。"]},
 {h:"5. 第三者提供および処理委託", b:[
   "当社は利用者の個人情報を販売せず、次の場合を除き第三者に提供しません。",
   ["Google：場所情報の提供（Google Places）、Googleログイン",
    "Apple：Appleログイン",
    "Kakao・韓国観光公社（TourAPI）：場所検索と観光情報の提供 — 検索の基準位置（現在地を使った場合はその座標）",
    "ODsay・TMAP：公共交通・徒歩の経路検索 — 出発地・目的地の座標（現在地から出発する場合はその座標）",
    "予約した商品の担当ガイド：予約者の氏名・連絡先（メールアドレス・携帯電話番号）・予約内容（商品・日付・時間・人数・言語・依頼メモ）とチャットルームのメッセージを予約履行の目的で提供し、ガイドは予約の履行が終わるまで保有します。ガイドによる日程チェックでは、日程と依頼メモのみ提供します",
    "日程を受け取ったガイド：利用者がガイドに日程を送った場合、氏名と日程（PDF・リンク）",
    "お店のメニューがあるパッケージツアーのお店：予約者の氏名、担当ガイドの氏名、選んだメニュー（モバイルバウチャー）",
    "KG Inicis・PortOne：旅行商品の決済処理 — 支払う方の氏名・メールアドレス・携帯電話番号、注文番号、決済金額",
    "Resend（米国）：メール送信（ログイン認証番号、予約案内メール、日程メール）— 受信者のメールアドレスとメール内容",
    "Aligo：ガイド・お店に送る予約通知のSMS — 受信者の携帯電話番号とメッセージ内容",
    "Anthropic（米国）：AIによる日程作成、名所レビューの翻訳・確認 — 利用者が入力した日程の条件とレビュー本文",
    "Telegram：新しい予約・投稿などを当社担当者に通知 — 予約者の氏名・連絡先・予約内容",
    "Cloudflare（米国）：サービスのサーバー運営とデータの保管 — 上記のデータ（個人情報は暗号化して保管）"],
   "上記の Google・Apple・Resend・Anthropic・Telegram・Cloudflare など海外サービスを利用する過程で、一部の情報が韓国国外（海外サーバー）へ転送される場合があります。これはサービス提供に必要な範囲に限られます。",
   "そのほか、法令に根拠がある場合や捜査機関の適法な要請がある場合を除き、第三者には提供しません。"]},
 {h:"6. 利用者の権利", b:[
   "利用者はいつでも自身の個人情報の閲覧・訂正・削除を求め、同意を撤回できます。",
   "ご請求はカスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）で行え、当社は遅滞なく対応します。"]},
 {h:"7. 安全性確保の措置", b:[
   "当社はガイド登録情報などの個人情報を AES-GCM 方式で暗号化して保存し、管理者の承認手続きおよびアクセス権限の統制により安全に管理します。"]},
 {h:"8. 個人情報保護責任者", b:[
   "個人情報の取り扱いに関する問い合わせ・苦情・救済は、下記の保護責任者にご連絡ください。",
   ["個人情報保護責任者：黄義晩（Hwang Euiman）",
    "カスタマーセンター：+82-10-4221-7066",
    "メール：admin@moneypuzzle.co.kr"]]},
 {h:"9. 児童の個人情報", b:[
   "本サービスは児童を対象とせず、児童の個人情報を意図的に収集しません。"]},
 {h:"10. 方針の変更", b:[
   "本方針が変更される場合、施行日および変更内容をアプリまたは本ページで告知します。"]},

 ]};

D.zhs={title:"隐私政策", eff:"施行日期：2027年1月1日", app:"MosaicTrip",
 sec:[
 {h:"", b:["Booman Inc.（株式会社 富滿，以下称“本公司”）遵守韩国《个人信息保护法》《位置信息的保护及利用等相关法律》等相关法律，珍视并保护用户的个人信息。本政策适用于面向外国游客的旅游向导应用“MosaicTrip”（https://navi.moneypuzzle.co.kr，以下称“本服务”）。"]},
 {h:"1. 收集的个人信息项目及方式", b:[
   "本服务无需注册即可使用，仅在以下情况收集个人信息：",
   ["位置信息 — 用户同意时的当前位置（经纬度）",
    "向导注册时 — 姓名、照片、可用语言、观光翻译向导资格证号及资格证照片、已签名的业务委托合同副本、经历、活动地区、自我介绍、联系方式（邮箱、电话）",
     "预订旅游商品（跟团游、向导陪同自由行、向导行程检查）时 — 预订人姓名、电子邮箱、手机号码、预订内容（商品、日期、时间、人数、语言、所选向导、留言、所选店铺菜单）。向导行程检查会收集接收结果的邮箱、需检查的行程及留言。",
    "使用与向导的聊天室时 — 您与向导互发的消息、发送时间（消息加密保存）",
    "把行程发给向导时 — 姓名、行程（PDF、链接）。在“发到我的邮箱”中填写的邮箱地址仅用于发送邮件，不予保存。",
    "登录时 — “我的旅行”中的行程、住宿以及“我的预约”列表（保存在账号中，以便在已登录的多台设备上查看）",
    "客户留言板 — 昵称、留言内容、发布时间、界面语言、用于确认发布者的值（公开留言为设备标识及登录时的账号标识，私密留言为密码）。确认用的值经单向加密后保存，用于限制留言数量的IP地址也不保存原始值。",
    "使用Google或Apple登录时（可选）— 姓名、电子邮箱、Google或Apple账号标识（用于防止违规参与）",
     "使用邮箱验证码登录时（可选）— 电子邮箱地址（用于发送验证码及防止违规参与）。验证码本身不予保存，超过10分钟或输错5次即无法使用。如有使用相同邮箱的Google或Apple账号，将合并为同一账号。用于限制发送次数的IP地址不保存原始值。",
    "发表景点评价时（可选，需登录）— 星级、评价内容、发表日期（用于显示评价（账号部分隐藏）、AI翻译及审核辱骂、广告、个人信息内容 · 保存至您要求删除或登录记录被删除为止）"],
   "收集方式：由用户在应用中直接填写，或在同意使用位置时通过设备的定位功能收集。"]},
 {h:"2. 收集与使用目的", b:[
   ["位置信息：推荐周边景点、美食、住宿、便利设施并提供路线指引",
    "向导注册信息：核实向导资格、注册审核与批准、向用户介绍向导",
     "旅游商品预订信息：受理和确认预订、确认付款、将预订转交给负责向导和店铺并履行预订、发送预订通知邮件",
    "聊天室和发送行程：您与向导之间的联系、向向导转交行程",
    "“我的旅行”和“我的预约”：在已登录的多台设备上显示相同的行程和预约",
    "客户留言板：回复咨询、意见并改善服务、删除留言时确认发布者、防止刷屏",
     "登录信息：确认已登录的用户、防止违规参与、发送邮箱验证码"]]},
 {h:"3. 位置信息的处理（位置信息服务）", b:[
   "本公司已依据《位置信息的保护及利用等相关法律》办理位置信息服务业务申报。"+PH,
   "本服务仅在用户通过应用内同意界面同意后，且仅在使用应用期间（前台）使用当前位置，不在后台收集位置信息。",
   "位置信息仅在提供周边推荐、搜索和路线指引时实时使用，不存储于本公司服务器。但依照《位置信息的保护及利用等相关法律》的位置信息使用事实确认资料（日期时间、设备标识、服务名称，不含坐标）保存6个月后销毁。",
   "当前位置由用户设备的定位功能测定，视设备不同，由位置信息经营者（Google Geolocation Services、Apple Core Location）测定位置。此过程中设备的位置信号可能发送至 Google 或 Apple。",
   "用户可随时在手机（浏览器）设置中关闭位置权限，或通过客服、邮箱要求撤回位置使用同意，届时搜索与地图浏览仍可正常使用。"]},
 {h:"4. 保存及使用期限", b:[
   "位置信息：仅实时使用，不予存储。位置信息使用事实确认资料保存6个月。",
   "向导注册信息：保存至注册被删除为止，向导要求删除时立即销毁。",
   "向向导发送行程的记录（姓名）：自发送之日起满1年自动删除。法律要求保存的，按相应期限保管。",
    "旅游商品预订信息：根据韩国《电子商务等消费者保护法》，有关合同、撤回要约、货款结算及商品等供应的记录保存5年。",
   "登录信息（Google或Apple登录的姓名、电子邮箱、账号标识，邮箱验证码登录的电子邮箱地址）：为防止违规参与而保存，自最后一次使用起满1年后删除。验证码有效期为10分钟，登录成功后立即删除。",
    "客户留言板的留言：保存至发布者或管理员删除为止。",
    "聊天室消息：自最后一次使用起满1年自动删除。",
    "“我的旅行”资料：自最后一次使用起满1年后与账号一起删除；在此之前如您要求，也会立即删除。",
   "用户请求删除时，立即予以销毁。"]},
 {h:"5. 向第三方提供及处理委托", b:[
   "本公司不出售用户个人信息，除以下情形外不向第三方提供：",
   ["Google：场所信息提供（Google Places）、Google登录",
    "Apple：Apple登录",
    "Kakao、韩国观光公社（TourAPI）：场所搜索及旅游信息提供 — 搜索基准位置（使用当前位置时为该坐标）",
    "ODsay、TMAP：公共交通及步行路线查询 — 出发地和目的地坐标（从当前位置出发时为该坐标）",
    "所预订商品的负责向导：为履行预订，提供预订人的姓名、联系方式（电子邮箱、手机号码）、预订内容（商品、日期、时间、人数、语言、留言）及聊天室消息，向导保存至预订履行完毕为止。向导行程检查仅提供行程和留言",
    "收到行程的向导：用户把行程发给向导时，提供姓名和行程（PDF、链接）",
    "含店铺菜单的跟团游的店铺：预订人姓名、负责向导姓名、所选菜单（电子凭证）",
    "KG Inicis、PortOne：旅游商品的支付处理 — 付款人的姓名、电子邮箱、手机号码、订单号、支付金额",
    "Resend（美国）：发送邮件（登录验证码、预订通知邮件、行程邮件）— 收件人的电子邮箱地址及邮件内容",
    "Aligo：发给向导和店铺的预订通知短信 — 收件人的手机号码和短信内容",
    "Anthropic（美国）：AI行程规划、景点评价的翻译和审核 — 用户输入的行程条件和评价内容",
    "Telegram：向本公司负责人通知新预订、新留言等 — 预订人姓名、联系方式、预订内容",
    "Cloudflare（美国）：服务器运营及资料保存 — 上述资料（个人信息加密保存）"],
   "在使用上述 Google、Apple、Resend、Anthropic、Telegram、Cloudflare 等海外服务的过程中，部分信息可能传输至韩国境外（海外服务器）。此仅限于提供服务所必需的范围。",
   "除法律有依据或侦查机关提出合法请求外，不向第三方提供。"]},
 {h:"6. 用户的权利", b:[
   "用户可随时请求查阅、更正、删除本人个人信息，并撤回同意。",
   "可通过客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）提出，本公司将及时处理。"]},
 {h:"7. 安全保障措施", b:[
   "本公司以 AES-GCM 方式加密存储向导注册信息等个人信息，并通过管理员审批流程及访问权限控制进行安全管理。"]},
 {h:"8. 个人信息保护负责人", b:[
   "有关个人信息处理的咨询、投诉、救济，请联系下列负责人：",
   ["个人信息保护负责人：Hwang Euiman",
    "客服：+82-10-4221-7066",
    "邮箱：admin@moneypuzzle.co.kr"]]},
 {h:"9. 儿童个人信息", b:[
   "本服务不以儿童为对象，不会有意收集儿童的个人信息。"]},
 {h:"10. 政策变更", b:[
   "本政策如有变更，将通过应用或本页面公告施行日期及变更内容。"]},
 {h:"语言", b:["本政策以韩语撰写。如其他语言译本与韩语版内容不一致，以韩语版为准。"]}
 ]};

D.zht={title:"隱私政策", eff:"施行日期：2027年1月1日", app:"MosaicTrip",
 sec:[
 {h:"", b:["Booman Inc.（株式會社 富滿，以下稱「本公司」）遵守韓國《個人資料保護法》《位置資訊之保護及利用等相關法律》等相關法律，珍視並保護使用者的個人資料。本政策適用於面向外國旅客的旅遊嚮導應用程式「MosaicTrip」（https://navi.moneypuzzle.co.kr，以下稱「本服務」）。"]},
 {h:"1. 蒐集的個人資料項目及方式", b:[
   "本服務無需註冊即可使用，僅於以下情形蒐集個人資料：",
   ["位置資訊 — 使用者同意時的目前位置（經緯度）",
    "嚮導註冊時 — 姓名、照片、可用語言、觀光翻譯嚮導資格證號及資格證照片、已簽名的業務委託合約副本、經歷、活動地區、自我介紹、聯絡方式（電郵、電話）",
     "預訂旅遊商品（跟團遊、嚮導陪同自由行、嚮導行程檢查）時 — 預訂人姓名、電子郵件、手機號碼、預訂內容（商品、日期、時間、人數、語言、所選嚮導、留言、所選店家菜單）。嚮導行程檢查會蒐集接收結果的電子郵件、需檢查的行程及留言。",
    "使用與嚮導的聊天室時 — 您與嚮導互傳的訊息、傳送時間（訊息加密儲存）",
    "將行程傳給嚮導時 — 姓名、行程（PDF、連結）。在「寄到我的電子郵件」中填寫的電子郵件地址僅用於寄送郵件，不予儲存。",
    "登入時 — 「我的旅行」中的行程、住宿以及「我的預約」列表（儲存在帳號中，以便在已登入的多台裝置上查看）",
    "客戶留言板 — 暱稱、留言內容、發布時間、介面語言、用於確認發布者的值（公開留言為裝置識別碼及登入時的帳號識別碼，私密留言為密碼）。確認用的值經單向加密後儲存，用於限制留言數量的IP位址也不儲存原始值。",
    "使用Google或Apple登入時（選擇性）— 姓名、電子郵件、Google或Apple帳號識別碼（用於防止不當參與）",
     "使用電子郵件驗證碼登入時（選擇性）— 電子郵件地址（用於寄送驗證碼及防止不當參與）。驗證碼本身不予儲存，超過10分鐘或輸錯5次即無法使用。如有使用相同電子郵件的Google或Apple帳號，將合併為同一帳號。用於限制寄送次數的IP位址不儲存原始值。",
    "發表景點評價時（選擇性，需登入）— 星級、評價內容、發表日期（用於顯示評價（帳號部分隱藏）、AI翻譯及審核辱罵、廣告、個人資訊內容 · 保存至您要求刪除或登入紀錄被刪除為止）"],
   "蒐集方式：由使用者於應用程式中直接填寫，或在同意使用位置時透過裝置的定位功能蒐集。"]},
 {h:"2. 蒐集與使用目的", b:[
   ["位置資訊：推薦周邊景點、美食、住宿、便利設施並提供路線指引",
    "嚮導註冊資料：核實嚮導資格、註冊審核與核准、向使用者介紹嚮導",
     "旅遊商品預訂資料：受理和確認預訂、確認付款、將預訂轉交給負責嚮導和店家並履行預訂、寄送預訂通知郵件",
    "聊天室和傳送行程：您與嚮導之間的聯絡、向嚮導轉交行程",
    "「我的旅行」和「我的預約」：在已登入的多台裝置上顯示相同的行程和預約",
    "客戶留言板：回覆諮詢、意見並改善服務、刪除留言時確認發布者、防止洗版",
     "登入資料：確認已登入的使用者、防止不當參與、寄送電子郵件驗證碼"]]},
 {h:"3. 位置資訊的處理（位置資訊服務）", b:[
   "本公司已依據《位置資訊之保護及利用等相關法律》辦理位置資訊服務業務申報。"+PH,
   "本服務僅在使用者透過應用程式內同意畫面同意後，且僅於使用應用程式期間（前景）使用目前位置，不於背景蒐集位置資訊。",
   "位置資訊僅於提供周邊推薦、搜尋和路線指引時即時使用，不儲存於本公司伺服器。但依《位置資訊之保護及利用等相關法律》的位置資訊利用事實確認資料（日期時間、裝置識別碼、服務名稱，不含座標）保存6個月後銷毀。",
   "目前位置由使用者裝置的定位功能測定，視裝置不同，由位置資訊業者（Google Geolocation Services、Apple Core Location）測定位置。此過程中裝置的位置訊號可能傳送至 Google 或 Apple。",
   "使用者可隨時於手機（瀏覽器）設定中關閉位置權限，或透過客服、電郵要求撤回位置使用同意，屆時搜尋與地圖瀏覽仍可正常使用。"]},
 {h:"4. 保存及使用期限", b:[
   "位置資訊：僅即時使用，不予儲存。位置資訊利用事實確認資料保存6個月。",
   "嚮導註冊資料：保存至註冊被刪除為止，嚮導要求刪除時立即銷毀。",
   "向嚮導傳送行程的紀錄（姓名）：自傳送之日起滿1年自動刪除。法律要求保存者，依相應期限保管。",
    "旅遊商品預訂資料：依據韓國《電子商務等消費者保護法》，有關契約、撤回要約、貨款結算及商品等供應的紀錄保存5年。",
   "登入資料（Google或Apple登入的姓名、電子郵件、帳號識別碼，電子郵件驗證碼登入的電子郵件地址）：為防止不當參與而保存，自最後一次使用起滿1年後刪除。驗證碼有效期限為10分鐘，登入成功後立即刪除。",
    "客戶留言板的留言：保存至發布者或管理員刪除為止。",
    "聊天室訊息：自最後一次使用起滿1年自動刪除。",
    "「我的旅行」資料：自最後一次使用起滿1年後與帳號一起刪除；在此之前如您要求，也會立即刪除。",
   "使用者請求刪除時，立即予以銷毀。"]},
 {h:"5. 向第三方提供及處理委託", b:[
   "本公司不出售使用者個人資料，除以下情形外不向第三方提供：",
   ["Google：場所資訊提供（Google Places）、Google登入",
    "Apple：Apple登入",
    "Kakao、韓國觀光公社（TourAPI）：場所搜尋及旅遊資訊提供 — 搜尋基準位置（使用目前位置時為該座標）",
    "ODsay、TMAP：大眾運輸及步行路線查詢 — 出發地和目的地座標（從目前位置出發時為該座標）",
    "所預訂商品的負責嚮導：為履行預訂，提供預訂人的姓名、聯絡方式（電子郵件、手機號碼）、預訂內容（商品、日期、時間、人數、語言、留言）及聊天室訊息，嚮導保存至預訂履行完畢為止。嚮導行程檢查僅提供行程和留言",
    "收到行程的嚮導：使用者將行程傳給嚮導時，提供姓名和行程（PDF、連結）",
    "含店家菜單的跟團遊的店家：預訂人姓名、負責嚮導姓名、所選菜單（電子憑證）",
    "KG Inicis、PortOne：旅遊商品的付款處理 — 付款人的姓名、電子郵件、手機號碼、訂單編號、付款金額",
    "Resend（美國）：寄送電子郵件（登入驗證碼、預訂通知郵件、行程郵件）— 收件人的電子郵件地址及郵件內容",
    "Aligo：寄給嚮導和店家的預訂通知簡訊 — 收件人的手機號碼和簡訊內容",
    "Anthropic（美國）：AI行程規劃、景點評價的翻譯和審核 — 使用者輸入的行程條件和評價內容",
    "Telegram：向本公司負責人通知新預訂、新留言等 — 預訂人姓名、聯絡方式、預訂內容",
    "Cloudflare（美國）：伺服器營運及資料保存 — 上述資料（個人資料加密儲存）"],
   "於使用上述 Google、Apple、Resend、Anthropic、Telegram、Cloudflare 等海外服務的過程中，部分資訊可能傳輸至韓國境外（海外伺服器）。此僅限於提供服務所必需的範圍。",
   "除法律有依據或偵查機關提出合法請求外，不向第三方提供。"]},
 {h:"6. 使用者的權利", b:[

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
/* keep our own placeholder/email/anchor HTML, escape the rest */
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>').replace(/&lt;span class="ph"&gt;([^&]*)&lt;\/span&gt;/g,'<span class="ph">$1</span>'); }

function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}

function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="https://navi.moneypuzzle.co.kr/?lang="+lang;
  document.title=d.title+" · "+(d.app||"MosaicTrip");   // 11-08 여행사 이름(언어별)
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}

function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}

(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
</body>
</html>
