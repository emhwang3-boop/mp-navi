<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>머니퍼즐 통계청</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2230;--sub:#667085;--line:#e3e7ee;--acc:#2f5bd3;--bar:#5b8def;--bar2:#f59f00;--ok:#2b8a3e;--bad:#c92a2a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171d2b;--ink:#e8ecf2;--sub:#9aa4b2;--line:#263044;--acc:#7aa2ff;--bar:#5b8def;--bar2:#f5b33b;--ok:#69db7c;--bad:#ff8787}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--sub);font-size:13px}
#hero{display:none;width:100%;max-height:220px;object-fit:contain;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
input,select,button{font:inherit;color:inherit}
input[type=password],input[type=text],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.menu button{background:var(--card);color:var(--ink);border:1px solid var(--line);text-align:left;padding:12px;border-radius:12px}
.menu button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.menu small{display:block;color:var(--sub);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}
.tile{background:var(--bg);border-radius:12px;padding:10px}
.tile b{display:block;font-size:24px}
.tile span{color:var(--sub);font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{color:var(--sub);font-weight:600;font-size:12px}
td.l,th.l{text-align:left;white-space:normal;min-width:120px}
.barc{width:140px}
.bar{height:10px;border-radius:5px;background:var(--bar)}
.bar.u{background:var(--bar2);height:6px;margin-top:2px}
.msg{color:var(--sub);font-size:13px;margin-top:6px}
.err{color:var(--bad)}
.prep{color:var(--sub);padding:20px 4px}
.inv{word-break:break-all;background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 머리 그림 자리 — 「머니퍼즐 통계청」 그림을 admin/hero.png 로 두면 나온다 (없으면 안 보임) -->
  <img id="hero" src="hero.png" alt="" onload="this.style.display='block'" onerror="this.remove()">
  <h1>머니퍼즐 통계청 · 관리자 메뉴판</h1>
  <div class="sub">주식회사 부만 · 머니퍼즐 내비</div>

  <div class="card" id="gate">
    <div class="row">
      <input type="password" id="tok" placeholder="관리 비밀번호" autocomplete="off" style="flex:1;min-width:200px">
      <button onclick="login()">들어가기</button>
      <button class="g" onclick="logout()">이 기기에서 지우기</button>
      <button class="g" onclick="location.href='../'">← 지도로 나가기</button>
    </div>
    <div class="msg" id="gmsg">비밀번호는 이 기기 브라우저에만 저장됩니다. 5번 틀리면 15분 동안 잠깁니다.</div>
  </div>

  <div id="app" hidden>
    <div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="g" onclick="location.href='../'">← 지도로 나가기</button><button class="g" onclick="show('pw')" title="비밀번호 변경">⚙ 비밀번호 변경</button><button class="g" onclick="TOK='';try{localStorage.removeItem('mpadm_tok')}catch(e){}location.href='../'" title="이 기기에서 비밀번호를 지우고 지도로">🔒 잠그고 나가기</button></div>
    <div class="menu" id="menu"></div>
    <div id="pane"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var HUB="https://brief-live-hub.emhwang3.workers.dev", CO="주식회사 부만 · 머니퍼즐 내비";
var TOK=""; try{ TOK=localStorage.getItem("mpadm_tok")||""; }catch(e){}
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function kday(add){ return new Date(Date.now()+9*3600e3+(add||0)*864e5).toISOString().slice(0,10); }
function api(path,opt){ opt=opt||{}; opt.headers={"x-admin":encodeURIComponent(TOK)};   /* 한글 비밀번호도 머리줄에 실리게 */ opt.cache="no-store";
  return fetch(HUB+path,opt).then(function(r){ if(r.status===403) throw new Error("admin"); if(r.status===429) throw new Error("locked"); return r.json(); }); }

// ── 들어가기 — 허브가 토큰을 확인해야만 메뉴가 열린다 ──
function login(){ var v=$("tok").value.trim(); if(v) TOK=v; if(!TOK){ $("gmsg").textContent="토큰을 넣어 주세요."; return; }
  $("gmsg").textContent="확인 중…";
  api("/ntapstats?from="+kday(0)+"&to="+kday(0)).then(function(j){ if(!j.ok) throw new Error("x");
    try{ localStorage.setItem("mpadm_tok",TOK); }catch(e){} $("tok").value=""; $("gate").hidden=true; $("app").hidden=false; menu(); show("home");
  }).catch(function(e){ TOK=""; try{ localStorage.removeItem("mpadm_tok"); }catch(x){} $("gmsg").innerHTML='<span class="err">'+(e.message==="admin"?"비밀번호가 맞지 않습니다.":e.message==="locked"?"5번 틀려 15분 동안 잠겼습니다. 잠시 뒤 다시 넣어 주세요.":"허브에 닿지 못했습니다.")+'</span>'; });
}
function logout(){ TOK=""; try{ localStorage.removeItem("mpadm_tok"); }catch(e){} location.reload(); }

var MENU=[["home","계기판","오늘 요약"],["tap","그림별 누름 통계","누름·사람 수 · 엑셀 받기"],["visit","방문 통계","내비 방문 · 허브 화면"],["voice","고객의 소리","내비에서 온 글"],["inq","입점 문의","업체 문의 · 엑셀 받기"],["guide","가이드 승인","통역·길안내 가이드 등록·요청"],["mis","가이드 장부(MIS)","날짜별 가이드·결제·수수료 · 엑셀"],["inv","초대 링크 발급","7일짜리 초대 링크"],["ptn","제휴 가게","식당 추천 광고 · 추가·수정"],["pay","이용권·결제 내역","장부 · 엑셀 받기"],["pw","비밀번호 변경","관리 비밀번호 바꾸기"]];
function won(n){ return Math.round(n||0).toLocaleString()+"원"; }
function usd(n){ return "$"+(Math.round((n||0)*100)/100).toLocaleString(); }
function tile(v,l){ return '<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>'; }
// ── 계기판 — 건물에 들어오면 바로 보이는 장부 ──
function homeLoad(){ var P=$("pane"), td=kday(0), ms=td.slice(0,8)+"01";
  P.innerHTML='<div class="card"><b>오늘 '+td+'</b><div id="hsum"><div class="msg">불러오는 중…</div></div></div><div class="card"><b>새 고객의 소리</b><div id="hvc"></div></div><div class="card"><b>최근 7일</b><div class="tw"><table id="h7"></table></div></div>';
  Promise.all([api("/ntapstats?from="+kday(-6)+"&to="+td),api("/nledger?from="+td+"&to="+td),api("/nledger?from="+ms+"&to="+td),api("/nvoice").catch(function(){ return {ok:false}; }),api("/ninq/admin").catch(function(){ return {ok:false}; })]).then(function(a){
    var w=a[0], tdy=(w.days||[]).filter(function(d){ return d.d===td; })[0]||{}, L0=a[1].total, LM=a[2].total, V=a[3], IQ=a[4];
    $("hsum").innerHTML='<div class="tiles">'
      +tile((tdy.vis||0).toLocaleString(),"오늘 방문 (열림)")+tile((tdy.visU||0).toLocaleString(),"오늘 방문 기기 수")
      +tile((tdy.t||0).toLocaleString(),"오늘 그림 누름")+tile((tdy.u||0).toLocaleString(),"오늘 사람 수")
      +tile(L0.KRW.n+L0.USD.n+"건","오늘 결제")+tile(won(L0.KRW.amt)+(L0.USD.amt?" · "+usd(L0.USD.amt):""),"오늘 결제금액")
      +tile(won(LM.KRW.amt)+(LM.USD.amt?" · "+usd(LM.USD.amt):""),"이번 달 매출 ("+ms.slice(5,7)+"월)")
      +tile(V.ok?V.unread+"건":"-","새 고객의 소리")+tile(IQ.ok?IQ.unread+"건":"-","새 입점 문의")+'</div>'
      +(a[1].pg===false?'<div class="msg">결제 연결 전 — 0원 (결제를 붙이면 자동으로 쌓입니다)</div>':'');
    var it=V.ok?V.items.filter(function(x){ return !x.read; }).slice(0,3):[];
    $("hvc").innerHTML=it.length?it.map(function(x){ return '<div class="inv"><div class="sub">'+esc(x.at)+(x.lang?' · '+esc(x.lang):'')+'</div>'+esc(x.text)+'</div>'; }).join("")+'<div class="row" style="margin-top:8px"><button class="g" onclick="show(\'voice\')">모두 보기</button></div>':'<div class="msg">새 글 없음</div>';
    var h='<tr><th class="l">날짜</th><th>방문</th><th>기기</th><th>누름</th><th>사람 수</th><th>길찾기</th></tr>';
    (w.days||[]).slice().reverse().forEach(function(d){ h+='<tr><td class="l">'+d.d+'</td><td>'+(d.vis||0)+'</td><td>'+(d.visU||0)+'</td><td>'+d.t+'</td><td>'+d.u+'</td><td>'+d.r+'</td></tr>'; });
    $("h7").innerHTML=h;
  }).catch(function(e){ $("hsum").innerHTML='<div class="msg err">불러오지 못했습니다 ('+esc(e.message)+')</div>'; }); }
// ── 방문 — 내비 숫자는 토큰 경로(/ntapstats)에서, 허브 공개 화면은 단추로 ──
function visitLoad(){ var P=$("pane");
  P.innerHTML='<div class="card"><b>내비 방문 (최근 30일)</b><div class="msg">앱이 열릴 때 1번 셉니다. 기기 수 = 그날 처음 연 기기 (사장님 기기 제외)</div><div class="tw"><table id="vt"></table></div></div>'
    +'<div class="card"><b>허브 방문 통계 화면</b><div class="row" style="margin-top:8px"><a href="'+HUB+'/stats" target="_blank" rel="noopener"><button class="g">앱 방문 통계 (/stats)</button></a><a href="'+HUB+'/hstats" target="_blank" rel="noopener"><button class="g">홈페이지 방문 (/hstats)</button></a></div></div>';
  api("/ntapstats?from="+kday(-29)+"&to="+kday(0)).then(function(j){ var h='<tr><th class="l">날짜</th><th>방문</th><th>기기 수</th><th>누른 기기</th></tr>';
    j.days.slice().reverse().forEach(function(d){ h+='<tr><td class="l">'+d.d+'</td><td>'+(d.vis||0)+'</td><td>'+(d.visU||0)+'</td><td>'+(d.dev||0)+'</td></tr>'; });
    h+='<tr><td class="l"><b>합계</b></td><td><b>'+j.total.vis+'</b></td><td><b>'+j.total.visU+'</b></td><td><b>'+j.total.dev+'</b></td></tr>'; $("vt").innerHTML=h; })
  .catch(function(e){ $("vt").innerHTML='<tr><td class="l err">불러오지 못했습니다</td></tr>'; }); }
// ── 고객의 소리 — 허브에 저장된 내비 글. 연락처는 가려 두고 단추로 하나씩 ──
function voiceLoad(){ var P=$("pane"); P.innerHTML='<div class="card"><b>고객의 소리 (내비)</b><div class="msg">메일로도 갑니다. 연락처는 「연락처 보기」를 눌러야 보입니다.</div><div id="vl"><div class="msg">불러오는 중…</div></div></div>';
  api("/nvoice").then(function(j){ if(!j.items.length){ $("vl").innerHTML='<div class="msg">아직 글이 없습니다.</div>'; return; }
    $("vl").innerHTML=j.items.map(function(x){ return '<div class="inv" style="'+(x.read?'opacity:.65':'border-left:4px solid var(--acc)')+'"><div class="sub">'+esc(x.at)+(x.lang?' · '+(x.lang==="en"?"영어":"한국어"):'')+(x.read?' · 읽음':' · 새 글')+'</div>'
      +'<div style="white-space:pre-wrap;margin:4px 0">'+esc(x.text)+'</div><div class="row">'
      +(x.read?'':'<button class="g" data-id="'+esc(x.id)+'" onclick="vRead(this.dataset.id)">읽음</button>')
      +(x.hasContact?'<button class="g" data-id="'+esc(x.id)+'" onclick="vContact(this)">연락처 보기</button>':'')
      +'<button class="g" data-id="'+esc(x.id)+'" onclick="vDel(this.dataset.id)">지우기</button></div></div>'; }).join("");
  }).catch(function(e){ $("vl").innerHTML='<div class="msg err">불러오지 못했습니다</div>'; }); }
function vRead(id){ api("/nvoice?read="+encodeURIComponent(id),{method:"POST"}).then(voiceLoad); }
function vDel(id){ if(!confirm("이 글을 지울까요?")) return; api("/nvoice?del="+encodeURIComponent(id),{method:"POST"}).then(voiceLoad); }
function vContact(b){ api("/nvoice?contact="+encodeURIComponent(b.dataset.id)).then(function(j){ var s=document.createElement("span"); s.textContent=j.contact||"(없음)"; s.style.padding="8px"; b.replaceWith(s); }); }
// ── 비밀번호 변경 — 허브가 지금 비밀번호를 확인한 뒤에만 바꾼다 (저장은 소금+해시) ──
function pwChange(){ var a=$("pw0").value, b=$("pw1").value, c=$("pw2").value, m=$("pwm");
  if(!a){ m.innerHTML='<span class="err">지금 비밀번호를 넣어 주세요.</span>'; return; }
  if([...b].length<10){ m.innerHTML='<span class="err">새 비밀번호는 10자 이상이어야 합니다.</span>'; return; }
  if(b!==c){ m.innerHTML='<span class="err">새 비밀번호와 확인이 다릅니다.</span>'; return; }
  if(b===a){ m.innerHTML='<span class="err">지금 비밀번호와 다른 것으로 정해 주세요.</span>'; return; }
  $("pwb").disabled=true; m.textContent="바꾸는 중…";
  fetch(HUB+"/nadminpw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cur:a,"new":b}),cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){ $("pwb").disabled=false;
    if(j.ok){ TOK=b; try{ localStorage.setItem("mpadm_tok",b); }catch(e){} $("pw0").value=$("pw1").value=$("pw2").value="";
      m.innerHTML='<b>바꿨습니다.</b> 이 기기에는 새 비밀번호로 저장했습니다. 다른 기기(폰 등)에서는 새 비밀번호를 다시 넣어 주세요.'; return; }
    m.innerHTML='<span class="err">'+(j.err==="locked"?"5번 틀려 15분 동안 잠겼습니다.":j.err==="admin"?"지금 비밀번호가 맞지 않습니다.":j.err==="weak"?"새 비밀번호가 너무 짧습니다 (10자 이상).":"바꾸지 못했습니다.")+'</span>';
  }).catch(function(){ $("pwb").disabled=false; m.innerHTML='<span class="err">허브에 닿지 못했습니다.</span>'; }); }
// ── 입점 문의 — 사업자번호·이메일 확인을 거친 업체 문의. 연락처는 가려 두고 단추로 · 업종 코드표는 허브 /ninq/cats 한 곳 ──
var IQS={active:"계속사업자 ✓ (국세청)",pending:"국세청 확인 대기 (형식·체크섬만)"}, IQD=null, IQC=null, IQF={a:"",b:""};
function iqCats(){ if(IQC) return Promise.resolve(IQC); return fetch(HUB+"/ninq/cats").then(function(r){ return r.json(); }).then(function(j){ IQC=j.cats||[]; return IQC; }).catch(function(){ IQC=[]; return IQC; }); }
function iqCatNm(code){ var p=String(code||"").split("."), t=(IQC||[]).filter(function(x){ return x.c===p[0]; })[0]; if(!t) return [code||"",""];
  var s=p[1]&&t.sub?t.sub.filter(function(x){ return x.c===p[1]; })[0]:null; return [t.ko, s?s.ko:""]; }
function inqLoad(){ var P=$("pane"); P.innerHTML='<div class="card"><div class="row"><b style="flex:1">입점·광고 문의</b><button class="g" onclick="xlsInq()">엑셀 받기</button></div><div class="msg">메일로도 갑니다. 이메일·전화는 「연락처 보기」를 눌러야 보입니다. 1년 지나면 지워집니다.</div>'
  +'<div class="row" style="margin-top:8px"><select id="iqA" onchange="IQF.a=this.value;IQF.b=\'\';iqDraw()"></select><select id="iqB" onchange="IQF.b=this.value;iqDraw()"></select></div><div id="iqCnt" class="msg"></div><div id="iql"><div class="msg">불러오는 중…</div></div></div>';
  Promise.all([iqCats(),api("/ninq/admin")]).then(function(a){ IQD=a[1]; iqDraw(); }).catch(function(e){ $("iql").innerHTML='<div class="msg err">불러오지 못했습니다</div>'; }); }
function iqDraw(){ if(!IQD) return; var all=IQD.items, cnt={}, cntB={};
  all.forEach(function(x){ var p=String(x.cat||"").split("."); cnt[p[0]]=(cnt[p[0]]||0)+1; if(p[1]) cntB[x.cat]=(cntB[x.cat]||0)+1; });
  $("iqA").innerHTML='<option value="">대분류 전체 ('+all.length+')</option>'+IQC.map(function(c){ return '<option value="'+c.c+'"'+(IQF.a===c.c?" selected":"")+'>'+esc(c.ko)+' ('+(cnt[c.c]||0)+')</option>'; }).join("");
  var top=IQC.filter(function(c){ return c.c===IQF.a; })[0];
  $("iqB").hidden=!(top&&top.sub); $("iqB").innerHTML=top&&top.sub?'<option value="">소분류 전체</option>'+top.sub.map(function(s){ var k=top.c+"."+s.c; return '<option value="'+k+'"'+(IQF.b===k?" selected":"")+'>'+esc(s.ko)+' ('+(cntB[k]||0)+')</option>'; }).join(""):"";
  $("iqCnt").textContent="업종별: "+IQC.filter(function(c){ return cnt[c.c]; }).map(function(c){ return c.ko+" "+cnt[c.c]; }).join(" · ");
  var R=all.filter(function(x){ var c=String(x.cat||""); return (!IQF.a||c.split(".")[0]===IQF.a)&&(!IQF.b||c===IQF.b); });
  if(!R.length){ $("iql").innerHTML='<div class="msg">해당 문의가 없습니다.</div>'; return; }
  $("iql").innerHTML=R.map(function(x){ var cn=iqCatNm(x.cat); return '<div class="inv" style="'+(x.read?'opacity:.65':'border-left:4px solid var(--acc)')+'"><div class="sub">'+esc(x.at)+' · '+(x.lang==="en"?"영어":"한국어")+(x.read?' · 읽음':' · 새 문의')+(x.mailFail?' · <span class="err">메일 실패</span>':'')+'</div>'

function misAdd(){ var m=$("maMsg"), gid=$("maG").value, lang=$("maL").value, date=$("maD").value, type=$("maT").value, status=$("maS").value, amount=$("maA").value.replace(/[^0-9]/g,"");
  if(!gid){ m.innerHTML='<span class="err">가이드를 고르세요 (승인된 가이드가 있어야 합니다).</span>'; return; }
  if(!date){ m.innerHTML='<span class="err">날짜를 넣으세요.</span>'; return; }
  m.textContent="넣는 중…";
  api("/guide/booking",{method:"POST",body:JSON.stringify({guideId:gid,lang:lang,date:date,type:type,status:status,amount:amount})}).then(function(j){
    if(!j.ok){ m.innerHTML='<span class="err">넣지 못했습니다 ('+esc(j.err||"")+').</span>'; return; }
    m.innerHTML='<b>넣었습니다.</b> '+esc(j.booking.date)+' · '+esc(j.booking.gname)+' · '+won(j.booking.amount)+' (수수료 '+won(j.booking.fee)+' · 지급 '+won(j.booking.payout)+')'; misFetch();
  }).catch(function(e){ m.innerHTML='<span class="err">넣지 못했습니다 ('+esc(e.message)+').</span>'; }); }
function misDel(id){ if(!confirm("이 기록을 지울까요?")) return; api("/guide/admin/booking/del",{method:"POST",body:JSON.stringify({id:id})}).then(function(j){ if(j&&j.ok) misFetch(); else alert("지우지 못했습니다."); }).catch(function(){ alert("지우지 못했습니다."); }); }
function misClearTest(){ if(!confirm("시험(데모)으로 넣은 예약 기록을 모두 지울까요?")) return; api("/guide/admin/booking/cleartest",{method:"POST",body:JSON.stringify({})}).then(function(j){ if(j&&j.ok){ alert((j.removed||0)+"건을 지웠습니다."); misFetch(); } else alert("지우지 못했습니다."); }).catch(function(){ alert("지우지 못했습니다."); }); }
// ── 엑셀: 요약 · 날짜별 · 가이드별 합계 ──
function xlsMis(){ if(!window.XLSX){ alert("엑셀 도구를 아직 못 불렀습니다."); return; } var it=MIS.items, paid=it.filter(misPaid);
  var sum={amount:0,fee:0,payout:0,hours:0}; paid.forEach(function(x){ sum.amount+=x.amount||0; sum.fee+=x.fee||0; sum.payout+=x.payout||0; sum.hours+=x.hours||0; });
  var s1=[[CO],["가이드 예약·결제 장부 (MIS)"],["기간",MIS.from+" ~ "+MIS.to+" (한국 시간)"],["만든 날",kday(0)],[],["총 건수(결제완료·완료)",paid.length],["총 결제금액(원)",sum.amount],["우리 수수료 합계(20%)",sum.fee],["가이드 지급 합계(80%)",sum.payout],["총 근무시간",sum.hours+"시간"],[],["※ 요금은 가정값(시장조사 후 교체) · 요청·취소 건은 금액 합계에서 제외"]];
  var s2=[["날짜","가이드","언어","반일/종일","근무시간","결제금액(원)","수수료(20%)","가이드 지급액(80%)","상태","시험"]].concat(it.map(function(x){ return [x.date,x.gname||"",gLangNm(x.lang),BKT[x.type]||x.type,(x.hours||0)+"시간",x.amount||0,x.fee||0,x.payout||0,BKS[x.status]||x.status,x.test?"시험":""]; }));
  var byG={}; paid.forEach(function(x){ var k=x.gid||('nm:'+x.gname); var g=byG[k]||(byG[k]={name:x.gname||'(이름없음)',langs:{},n:0,hours:0,amount:0,fee:0,payout:0}); g.langs[x.lang]=1; g.n++; g.hours+=x.hours||0; g.amount+=x.amount||0; g.fee+=x.fee||0; g.payout+=x.payout||0; });
  var s3=[["가이드","언어","건수","총 근무시간","총 결제금액(원)","총 수수료(우리)","총 지급액(가이드)"]].concat(Object.keys(byG).map(function(k){ return byG[k]; }).sort(function(a,b){ return b.amount-a.amount; }).map(function(g){ return [g.name,Object.keys(g.langs).map(gLangNm).join(", "),g.n,g.hours+"시간",g.amount,g.fee,g.payout]; }));
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,sheet(s1,[26,22]),"요약"); XLSX.utils.book_append_sheet(wb,sheet(s2,[12,14,12,10,9,14,13,15,9,6]),"날짜별"); XLSX.utils.book_append_sheet(wb,sheet(s3,[14,14,7,12,15,15,15]),"가이드별 합계");
  save(wb,"머니퍼즐_가이드장부_"+MIS.from+"_"+MIS.to+".xlsx"); }
