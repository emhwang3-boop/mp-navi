<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>머니퍼즐 통계청</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2230;--sub:#667085;--line:#e3e7ee;--acc:#2f5bd3;--bar:#5b8def;--bar2:#f59f00;--ok:#2b8a3e;--bad:#c92a2a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171d2b;--ink:#e8ecf2;--sub:#9aa4b2;--line:#263044;--acc:#7aa2ff;--bar:#5b8def;--bar2:#f5b33b;--ok:#69db7c;--bad:#ff8787}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--sub);font-size:13px}
#hero{display:none;width:100%;max-height:220px;object-fit:contain;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
input,select,button{font:inherit;color:inherit}
input[type=password],input[type=text],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.menu button{background:var(--card);color:var(--ink);border:1px solid var(--line);text-align:left;padding:12px;border-radius:12px}
.menu button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.menu small{display:block;color:var(--sub);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0}
.tile{background:var(--bg);border-radius:12px;padding:10px}
.tile b{display:block;font-size:24px}
.tile span{color:var(--sub);font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{color:var(--sub);font-weight:600;font-size:12px}
td.l,th.l{text-align:left;white-space:normal;min-width:120px}
.barc{width:140px}
.bar{height:10px;border-radius:5px;background:var(--bar)}
.bar.u{background:var(--bar2);height:6px;margin-top:2px}
.msg{color:var(--sub);font-size:13px;margin-top:6px}
.err{color:var(--bad)}
.prep{color:var(--sub);padding:20px 4px}
.inv{word-break:break-all;background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 머리 그림 자리 — 「머니퍼즐 통계청」 그림을 admin/hero.png 로 두면 나온다 (없으면 안 보임) -->
  <img id="hero" src="hero.png" alt="" onload="this.style.display='block'" onerror="this.remove()">
  <h1>머니퍼즐 통계청 · 관리자 메뉴판</h1>
  <div class="sub">주식회사 부만 · 머니퍼즐 내비</div>

  <div class="card" id="gate">
    <div class="row">
      <input type="password" id="tok" placeholder="관리 비밀번호" autocomplete="off" style="flex:1;min-width:200px">
      <button onclick="login()">들어가기</button>
      <button class="g" onclick="logout()">이 기기에서 지우기</button>
      <button class="g" onclick="location.href='../'">← 지도로 나가기</button>
    </div>
    <div class="msg" id="gmsg">비밀번호는 이 기기 브라우저에만 저장됩니다. 5번 틀리면 15분 동안 잠깁니다.</div>
  </div>

  <div id="app" hidden>
    <div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="g" onclick="location.href='../'">← 지도로 나가기</button><button class="g" onclick="show('pw')" title="비밀번호 변경">⚙ 비밀번호 변경</button><button class="g" onclick="TOK='';try{localStorage.removeItem('mpadm_tok')}catch(e){}location.href='../'" title="이 기기에서 비밀번호를 지우고 지도로">🔒 잠그고 나가기</button></div>
    <div class="menu" id="menu"></div>
    <div id="pane"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var HUB="https://brief-live-hub.emhwang3.workers.dev", CO="주식회사 부만 · 머니퍼즐 내비";
var TOK=""; try{ TOK=localStorage.getItem("mpadm_tok")||""; }catch(e){}
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function kday(add){ return new Date(Date.now()+9*3600e3+(add||0)*864e5).toISOString().slice(0,10); }
function api(path,opt){ opt=opt||{}; opt.headers={"x-admin":encodeURIComponent(TOK)};   /* 한글 비밀번호도 머리줄에 실리게 */ opt.cache="no-store";
  return fetch(HUB+path,opt).then(function(r){ if(r.status===403) throw new Error("admin"); if(r.status===429) throw new Error("locked"); return r.json(); }); }

// ── 들어가기 — 허브가 토큰을 확인해야만 메뉴가 열린다 ──
function login(){ var v=$("tok").value.trim(); if(v) TOK=v; if(!TOK){ $("gmsg").textContent="토큰을 넣어 주세요."; return; }
  $("gmsg").textContent="확인 중…";
  api("/ntapstats?from="+kday(0)+"&to="+kday(0)).then(function(j){ if(!j.ok) throw new Error("x");
    try{ localStorage.setItem("mpadm_tok",TOK); }catch(e){} $("tok").value=""; $("gate").hidden=true; $("app").hidden=false; menu(); show("home");
  }).catch(function(e){ TOK=""; try{ localStorage.removeItem("mpadm_tok"); }catch(x){} $("gmsg").innerHTML='<span class="err">'+(e.message==="admin"?"비밀번호가 맞지 않습니다.":e.message==="locked"?"5번 틀려 15분 동안 잠겼습니다. 잠시 뒤 다시 넣어 주세요.":"허브에 닿지 못했습니다.")+'</span>'; });
}
function logout(){ TOK=""; try{ localStorage.removeItem("mpadm_tok"); }catch(e){} location.reload(); }

var MENU=[["home","계기판","오늘 요약"],["lbs","위치 확인자료","위치정보법 16조 · 6개월 보관 · 엑셀 받기"],["tap","그림별 누름 통계","누름·사람 수 · 엑셀 받기"],["paid","유료 콘텐츠","PC방·노래방·넷플릭스·유튜브 · 누름·사용 시간"],["visit","방문 통계","내비 방문 · 허브 화면"],["voice","고객의 소리","내비에서 온 글"],["inq","입점 문의","업체 문의 · 엑셀 받기"],["guide","가이드 승인","통역·길안내 가이드 등록·요청"],["greview","가이드 후기 관리","손님 후기 · 악성 숨김·삭제"],["mis","가이드 장부(MIS)","날짜별 가이드·결제·수수료 · 엑셀"],["inv","초대 링크 발급","7일짜리 초대 링크"],["ptn","제휴 가게","식당 추천 광고 · 추가·수정"],["pay","이용권 (무료)","무료 확정 · 결제 미연결"],["pg","퍼즐골드","지갑·상 지급·사용 내역 · 엑셀"],["bingo","이벤트","종류 고르기·시작·닫기 · 빙고 문제 · 보물상자·명소·사진 설정"],["pw","비밀번호 변경","관리 비밀번호 바꾸기"]];
// 홈페이지(moneypuzzle.co.kr) 방문 수 — 허브 /hc (방문 안 늘림). sum=1 이면 최근 7·30일 합계도 (2026-10-24)
function hc(q){ return fetch(HUB+"/hc"+(q||""),{cache:"no-store"}).then(function(r){ return r.json(); }); }
function won(n){ return Math.round(n||0).toLocaleString()+"원"; }
function usd(n){ return "$"+(Math.round((n||0)*100)/100).toLocaleString(); }
function tile(v,l){ return '<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>'; }
// ── 나라·들어온 경로 (사장님 10-27) — 허브 /ntapstats 의 days[].cc·rf (합계 수만). 10-27 전 날은 기록 없음 ──
var CCN={US:"미국",KR:"한국",JP:"일본",CN:"중국",TW:"대만",HK:"홍콩",MO:"마카오",GB:"영국",DE:"독일",FR:"프랑스",ES:"스페인",IT:"이탈리아",NL:"네덜란드",CA:"캐나다",AU:"호주",NZ:"뉴질랜드",SG:"싱가포르",VN:"베트남",TH:"태국",PH:"필리핀",ID:"인도네시아",MY:"말레이시아",IN:"인도",MX:"멕시코",BR:"브라질",AR:"아르헨티나",CL:"칠레",CO:"콜롬비아",PE:"페루",RU:"러시아",MN:"몽골",KZ:"카자흐스탄",UZ:"우즈베키스탄",TR:"튀르키예",AE:"아랍에미리트",SA:"사우디",IL:"이스라엘",PL:"폴란드",SE:"스웨덴",NO:"노르웨이",FI:"핀란드",DK:"덴마크",IE:"아일랜드",PT:"포르투갈",CH:"스위스",AT:"오스트리아",BE:"벨기에",UA:"우크라이나",ZA:"남아공",EG:"이집트",NG:"나이지리아",BD:"방글라데시",PK:"파키스탄",XX:"알 수 없음",T1:"토르"};
var RFN={facebook:"페이스북",instagram:"인스타그램",x:"X",kakao:"카카오톡",line:"라인",whatsapp:"왓츠앱",tiktok:"틱톡",wechat:"위챗",linkedin:"링크드인",google:"구글",naver:"네이버",daum:"다음",bing:"빙",yahoo:"야후",home:"홈페이지",bingo_share:"빙고 공유",pwa:"설치 앱",internal:"앱 안 이동",direct:"직접",other_ref:"기타 링크",other:"기타"};
function topN(o,N){ if(!o) return null; var a=Object.keys(o).map(function(k){ return [k,o[k]||0]; }).sort(function(x,y){ return y[1]-x[1]||(x[0]<y[0]?-1:1); }); if(!a.length) return null;
  return a.slice(0,5).map(function(x){ return esc(N[x[0]]||x[0])+" "+x[1]; }).join(" · ")+(a.length>5?" …":""); }
function srcRows(days){ var h='<tr><th class="l">날짜</th><th class="l">나라 상위</th><th class="l">경로 상위</th></tr>';
  days.slice().reverse().forEach(function(d){ var c=topN(d.cc,CCN), r=topN(d.rf,RFN);
    h+='<tr><td class="l">'+d.d+'</td>'+(c||r?'<td class="l">'+(c||"-")+'</td><td class="l">'+(r||"-")+'</td>':'<td class="l" colspan="2" style="color:var(--sub)">기록 시작 전</td>')+'</tr>'; });
  return h; }
// ── 계기판 — 건물에 들어오면 바로 보이는 장부 ──
function homeLoad(){ var P=$("pane"), td=kday(0);
  P.innerHTML='<div class="card"><b>오늘 '+td+'</b><div id="hsum"><div class="msg">불러오는 중…</div></div></div><div class="card"><b>새 고객의 소리</b><div id="hvc"></div></div><div class="card"><b>최근 7일 (투어앱)</b><div class="tw"><table id="h7"></table></div><div class="msg" style="margin-top:10px">나라·들어온 경로 (방문 합계 수만 · 10-27부터)</div><div class="tw"><table id="h7s"></table></div></div>';
  Promise.all([api("/ntapstats?from="+kday(-6)+"&to="+td),api("/nvoice").catch(function(){ return {ok:false}; }),api("/ninq/admin").catch(function(){ return {ok:false}; }),hc("?sum=1").catch(function(){ return null; })]).then(function(a){
    var w=a[0], tdy=(w.days||[]).filter(function(d){ return d.d===td; })[0]||{}, V=a[1], IQ=a[2], H=a[3];
    $("hsum").innerHTML='<div class="tiles">'
      +tile((tdy.vis||0).toLocaleString(),"오늘 앱 방문")+tile((tdy.visU||0).toLocaleString(),"오늘 앱 기기 수")
      +tile(H?(H.today||0).toLocaleString():"-","오늘 홈피 방문")
      +tile((tdy.t||0).toLocaleString(),"오늘 그림 누름")+tile((tdy.u||0).toLocaleString(),"오늘 사람 수")
      +tile(V.ok?V.unread+"건":"-","새 고객의 소리")+tile(IQ.ok?IQ.unread+"건":"-","새 입점 문의")+'</div>'
      +'<div class="msg">앱 = 투어앱(navi.moneypuzzle.co.kr) · 홈피 = moneypuzzle.co.kr (서로 다른 방문). 자세히는 「방문 통계」</div>'
      +'<div class="msg">이용권은 <b>무료</b>(결제 미연결) — 수익모델: 가이드 수수료 · 식당 광고 · 제휴 커미션</div>';
    var it=V.ok?V.items.filter(function(x){ return !x.read; }).slice(0,3):[];
    $("hvc").innerHTML=it.length?it.map(function(x){ return '<div class="inv"><div class="sub">'+esc(x.at)+(x.lang?' · '+esc(x.lang):'')+'</div>'+esc(x.text)+'</div>'; }).join("")+'<div class="row" style="margin-top:8px"><button class="g" onclick="show(\'voice\')">모두 보기</button></div>':'<div class="msg">새 글 없음</div>';
    var h='<tr><th class="l">날짜</th><th>방문</th><th>기기</th><th>누름</th><th>사람 수</th><th>길찾기</th></tr>';
    (w.days||[]).slice().reverse().forEach(function(d){ h+='<tr><td class="l">'+d.d+'</td><td>'+(d.vis||0)+'</td><td>'+(d.visU||0)+'</td><td>'+d.t+'</td><td>'+d.u+'</td><td>'+d.r+'</td></tr>'; });
    $("h7").innerHTML=h;
    $("h7s").innerHTML=srcRows(w.days||[]);
  }).catch(function(e){ $("hsum").innerHTML='<div class="msg err">불러오지 못했습니다 ('+esc(e.message)+')</div>'; }); }
// ── 방문 — 내비 숫자는 토큰 경로(/ntapstats)에서, 허브 공개 화면은 단추로 ──
function visitLoad(){ var P=$("pane"), td=kday(0);
  P.innerHTML='<div class="card"><b>방문 요약 — 앱 vs 홈피</b><div class="msg">앱 = 투어앱(navi.moneypuzzle.co.kr), 열릴 때 1번 · 홈피 = moneypuzzle.co.kr. 서로 다른 방문입니다 (로봇·사장님 기기 뺌).</div><div id="vsplit"><div class="msg">불러오는 중…</div></div></div>'
    +'<div class="card"><b>투어앱 방문 (최근 30일)</b><div class="msg">앱이 열릴 때 1번 셉니다. 기기 수 = 그날 처음 연 기기 (사장님 기기 제외)</div><div class="tw"><table id="vt"></table></div></div>'
    +'<div class="card"><b>허브 방문 통계 화면 (자세히)</b><div class="row" style="margin-top:8px"><a href="'+HUB+'/hstats" target="_blank" rel="noopener"><button class="g">홈페이지 방문 (/hstats)</button></a><a href="'+HUB+'/stats" target="_blank" rel="noopener"><button class="g">투자앱 방문 (/stats)</button></a></div><div class="msg">※ /stats 는 투자앱(브리핑·주식·코인) 통계 — 투어앱과 다른 서비스입니다.</div></div>';
  Promise.all([api("/ntapstats?from="+kday(-29)+"&to="+td),hc("?sum=1").catch(function(){ return null; })]).then(function(a){
    var j=a[0], H=a[1], appTd=(j.days.filter(function(d){ return d.d===td; })[0]||{}).vis||0;
    $("vsplit").innerHTML='<div class="tiles">'
      +tile(appTd.toLocaleString(),"앱 방문 · 오늘")+tile((j.total.vis||0).toLocaleString(),"앱 방문 · 최근 30일")
      +tile(H?(H.today||0).toLocaleString():"-","홈피 방문 · 오늘")+tile(H?(H.d30||0).toLocaleString():"-","홈피 방문 · 최근 30일")
      +tile(H?(H.total||0).toLocaleString():"-","홈피 누적")+tile(H?(H.uniq||0).toLocaleString():"-","홈피 순 방문자")+'</div>'
      +(H?'':'<div class="msg err">홈피 방문 수를 불러오지 못했습니다 (허브 /hc).</div>');
    var h='<tr><th class="l">날짜</th><th>방문</th><th>기기 수</th><th>누른 기기</th></tr>';
    j.days.slice().reverse().forEach(function(d){ h+='<tr><td class="l">'+d.d+'</td><td>'+(d.vis||0)+'</td><td>'+(d.visU||0)+'</td><td>'+(d.dev||0)+'</td></tr>'; });
    h+='<tr><td class="l"><b>합계</b></td><td><b>'+j.total.vis+'</b></td><td><b>'+j.total.visU+'</b></td><td><b>'+j.total.dev+'</b></td></tr>'; $("vt").innerHTML=h; })
  .catch(function(e){ $("vsplit").innerHTML='<div class="msg err">불러오지 못했습니다</div>'; $("vt").innerHTML='<tr><td class="l err">불러오지 못했습니다</td></tr>'; }); }
// ── 고객의 소리 — 허브에 저장된 내비 글. 연락처는 가려 두고 단추로 하나씩 ──
function voiceLoad(){ var P=$("pane"); P.innerHTML='<div class="card"><b>고객의 소리 (내비)</b><div class="msg">메일로도 갑니다. 연락처는 「연락처 보기」를 눌러야 보입니다.</div><div id="vl"><div class="msg">불러오는 중…</div></div></div>';
  api("/nvoice").then(function(j){ if(!j.items.length){ $("vl").innerHTML='<div class="msg">아직 글이 없습니다.</div>'; return; }
    $("vl").innerHTML=j.items.map(function(x){ return '<div class="inv" style="'+(x.read?'opacity:.65':'border-left:4px solid var(--acc)')+'"><div class="sub">'+esc(x.at)+(x.lang?' · '+(x.lang==="en"?"영어":"한국어"):'')+(x.read?' · 읽음':' · 새 글')+'</div>'
      +'<div style="white-space:pre-wrap;margin:4px 0">'+esc(x.text)+'</div><div class="row">'
      +(x.read?'':'<button class="g" data-id="'+esc(x.id)+'" onclick="vRead(this.dataset.id)">읽음</button>')
      +(x.hasContact?'<button class="g" data-id="'+esc(x.id)+'" onclick="vContact(this)">연락처 보기</button>':'')
      +'<button class="g" data-id="'+esc(x.id)+'" onclick="vDel(this.dataset.id)">지우기</button></div></div>'; }).join("");
  }).catch(function(e){ $("vl").innerHTML='<div class="msg err">불러오지 못했습니다</div>'; }); }
function vRead(id){ api("/nvoice?read="+encodeURIComponent(id),{method:"POST"}).then(voiceLoad); }

function bdOn(m){ if(!confirm(m==="live"?"매일 빙고를 「실전」으로 켤까요?\n오늘 판을 새로 만들고(오늘 진행 기록은 지워짐) 이번 주 점수 합계 20·50·70점에 20·50·100 PG가 월요일 0시에 자동 지급됩니다. 동의·한국 제외가 켜집니다.":"매일 빙고를 「시험」으로 켤까요? 상금 없이 순위·점수·별만 기록합니다. (모드를 바꾸면 오늘 판을 새로 만듭니다)")) return;

function bdOff(){ if(!confirm("매일 빙고를 끌까요? 오늘 판은 점수 정산 없이 닫힙니다(지난 날 점수·주간 지급은 그대로).")) return; api("/npg/admin/ev/daily",{method:"POST",body:JSON.stringify({act:"dstop"})}).then(function(j){ alert(j.ok?"껐습니다":"끄지 못함 ("+(j.err||"")+")"); evLoad(); }); }
function bdCard(){ var d=EV.daily, k=EV.ko, on=!!(d&&d.st==="open"), lv=on&&d.mode==="live", bl=EV.bdlast, bp=EV.bdpaid;

   +'<div class="row" style="margin-top:8px"><button onclick="bdOn(\'test\')"'+(on&&!lv?' disabled':'')+'>매일 빙고 켜기(시험)</button><button onclick="bdOn(\'live\')"'+(lv?' disabled':'')+' style="background:#e8590c">매일 빙고 켜기(실전)</button><button class="g" onclick="bdOff()"'+(on?'':' disabled')+'>끄기</button></div>'
   +'<div class="msg" id="bdMsg">한국 시간 밤 12시마다 새 판. 그날 24칸 완성자 걸린 시간 순 → 점수 1등 10·2등 8·3등 6·4등 5·5등 4·6~10등 3·나머지 1 · 그날 1등 별. 실전이면 월요일 0시에 한 주 점수 합계 70↑ 100 PG · 50↑ 50 PG · 20↑ 20 PG (넘으면 누구나, 가장 높은 하나, 사장님 기기·졸업자 제외). 시험은 상금 없음.</div>'
   +'<div class="msg">한국인 판(한국어+한국 IP): '+(k&&k.st==="open"?'<b>켜짐</b> · '+esc(k.day||""):'꺼짐')+(bl?' · 지난 주간 점수('+esc(bl.wk)+') '+(bl.n||0)+'명'+((bl.res||[]).filter(function(r){ return r.pg; }).length?', PG 받은 사람 '+(bl.res||[]).filter(function(r){ return r.pg; }).length+'명':''):'')+(bp&&bp.res?' · 지난주 지급 '+bp.res.filter(function(r){ return r.pg; }).map(function(r){ return esc(r.nm)+' '+r.p+'점 '+r.pg+'PG(메일 '+({sent:"보냄",fail:"실패",none:"없음"}[r.mail]||"-")+')'; }).join(", "):'')+'</div></div>'; }
var EVS=[["treasure","지도 속 보물상자"],["spot","명소 맞히기"],["photo","이번 주 사진"]];   // 이번 주 이벤트 (빙고는 위 매일 빙고로)

   +'<button onclick="evStart()"'+(ok?' disabled':'')+'>이번 주 이벤트 시작</button><button class="g" onclick="evStop()"'+(ok?'':' disabled')+'>지금 닫기</button></div>'
   +'<div class="msg">자동으로 열리지 않습니다. 한 주에 한 종류, 매일 빙고와는 같이 열립니다. 시작한 때부터 그 주 일요일 24:00(한국 시간)까지 열리고, 보물상자·명소 맞히기는 마감 뒤 1·2·3등에게 100/50/20 PG를 자동 지급(당첨 메일)·1등 별. 한국인(한국어+한국 IP)은 같은 판을 「한국인 판」으로 따로 풀고(상금 없음, 1등 별만). 사진은 마감 뒤 아래에서 1·2·3등을 고르면 지급됩니다. 「지금 닫기」는 지급 없이 닫습니다. 사장님 기기·졸업자(3회)는 순위에서 빠집니다.</div></div>';
  h+='<div class="card"><div class="row">'+EVK.map(function(k){ return '<button class="'+(EVTAB===k[0]?"":"g")+'" onclick="EVTAB=\''+k[0]+'\';evPaintA()">'+k[1]+' 설정</button>'; }).join("")+'</div></div>';
  P.innerHTML=h+'<div id="evTab"></div>';
  if(EVTAB==="bingo"){ $("evTab").innerHTML='<div class="msg">빙고 문제를 불러오는 중…</div>'; api("/npg/admin/bingo").then(function(j){ if(!j.ok) throw 0; BG=j; bgPaint("evTab"); }).catch(function(){ $("evTab").innerHTML='<div class="card"><div class="msg err">빙고 문제를 못 불렀습니다</div></div>'; }); }
  if(EVTAB==="treasure") evTre(); if(EVTAB==="spot") evSpot(); if(EVTAB==="photo") evPho(); }
function evStart(){ var k=$("evKind").value; if(!confirm("「"+evNm(k)+"」을(를) 지금 시작할까요? 일요일 24:00(한국 시간)에 마감됩니다.")) return;
  api("/npg/admin/ev/start",{method:"POST",body:JSON.stringify({kind:k})}).then(function(j){ alert(j.ok?(j.already?"이미 진행 중입니다":"시작했습니다"):(j.err==="cfg"?"먼저 아래 「"+evNm(k)+" 설정」을 채워 저장해 주세요":j.err==="already-open"?"이미 「"+evNm(j.kind)+"」이(가) 열려 있습니다":"시작 못 함 ("+(j.err||"")+")")); evLoad(); }); }
function evStop(){ if(!confirm("지금 열린 이벤트를 닫을까요? 순위·상금 지급 없이 닫힙니다(기록 보관).")) return; api("/npg/admin/ev/stop",{method:"POST"}).then(function(j){ alert(j.ok?"닫았습니다":"닫지 못함 ("+(j.err||"")+")"); evLoad(); }); }
function evSave(kind,cfg){ return api("/npg/admin/ev/cfg",{method:"POST",body:JSON.stringify({kind:kind,cfg:cfg})}).then(function(j){ alert(j.ok?"저장했습니다":"저장 못 함 ("+(j.err||"")+")"); if(j.ok) evLoad(); }); }
function ml(id,o){ return EVL.map(function(l){ return '<div class="row" style="margin-top:3px"><span class="sub" style="width:34px">'+l+'</span><input id="'+id+'_'+l+'" value="'+esc((o&&o[l])||"")+'" style="flex:1;min-width:200px"></div>'; }).join(""); }

function evTre(){ var c=EV.cfg.treasure||{hints:[]}, h='<div class="card"><b>지도 속 보물상자 설정</b><div class="msg">상자 자리 = 서울 안 위도·경도(구글 지도에서 그 자리를 길게 눌러 복사) + 정답 반경(m). 손님은 서울 지도(구 화면)를 눌러 엽니다. 힌트 7개는 월~일 매일 12시에 하나씩 공개(주중에 시작하면 지난 날 힌트는 바로).</div>'
  +'<div class="row"><input id="trLat" placeholder="위도 37.xxxx" value="'+esc(c.lat||"")+'" style="width:140px"><input id="trLng" placeholder="경도 126.xxxx" value="'+esc(c.lng||"")+'" style="width:140px"><input id="trR" placeholder="반경 m" value="'+esc(c.r||150)+'" style="width:90px"></div>'
  +'<div class="msg" style="margin-top:8px">장소 이름 (3등이 나오면 손님에게 공개)</div>'+ml("trP",c.place)
  +'<div class="row" style="margin-top:8px"><b style="flex:1">힌트 7개</b><button class="g" onclick="evHintAi()">AI 초안 만들기</button></div>';

  $("evTab").innerHTML=h+'<button onclick="evTreSave()" style="margin-top:10px">저장</button></div>'; }

function evTreSave(){ var c=evTreGet(); if(!(c.lat>37&&c.lat<38&&c.lng>126&&c.lng<128)){ alert("서울 안 위도·경도를 넣어 주세요"); return; } if(!c.hints.length){ alert("힌트를 넣어 주세요"); return; } evSave("treasure",c); }

  api("/npg/admin/ev/hints-ai",{method:"POST",body:JSON.stringify({lat:c.lat,lng:c.lng,place:(c.place.ko||"")+" / "+(c.place.en||"")})}).then(function(j){ var m=$("aiMsg"); if(m) m.remove(); if(!j.hints){ alert("못 만들었습니다 ("+(j.err||"")+")"); return; }
    j.hints.forEach(function(hh,i){ EVL.forEach(function(l){ var e=$("trH"+i+"_"+l); if(e&&hh[l]) e.value=hh[l]; }); }); alert("초안을 넣었습니다. 고친 뒤 「저장」을 누르세요."); }); }
var SPN=null;
function spotNames(){ if(SPN) return Promise.resolve(SPN); SPN={P:{},nm:{},gu:{},rg:{},ord:{}};   // 10-27 전국: 서울 구 화면 + 앱의 모든 약도(수도권·강원·충청·전라·경상·경주·부산·제주·서울 약도)
  var J=function(u){ return fetch(u,{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); };
  return Promise.all([J("../data/gu_seoul.json"),J("../data/regions.json")]).then(function(a){ var d=a[0]||{P:{},gus:[]}, R=(a[1]||{}).maps||{}, ids=Object.keys(R).filter(function(i){ return i!=="kr"; });
    for(var k in d.P){ if(/@/.test(k)) continue; SPN.P[k]=d.P[k].i.split("?")[0]; }
    (d.gus||[]).forEach(function(o){ (o.keys||[]).forEach(function(k){ SPN.gu[k]={ko:o.n[0],en:o.n[1],ja:o.n[2],zhs:o.n[3],zht:o.n[4]}; SPN.rg[k]="서울 · "+o.n[0]; SPN.ord[k]=0; }); });
    var top=function(i){ var t=i; while(R[t]&&R[t].parent&&R[t].parent!=="kr") t=R[t].parent; return t; };
    return Promise.all(ids.map(function(i){ return J("../data/maps/"+i+".json"); })).then(function(ms){ ms.forEach(function(m,j){ if(!m) return; var id=ids[j], c=R[id]||{};
      for(var k in (m.places||{})) if(!SPN.nm[k]) SPN.nm[k]=m.places[k].ko;
      for(var s in (m.spots||{})){ if(/@/.test(s)||s==="adinq"||s==="mpstat"||SPN.gu[s]) continue;   // 문의·통계청 단추는 명소 아님
        SPN.gu[s]={ko:c.ko,en:c.en,ja:c.ja,zhs:c.zhs,zht:c.zht,es:c.es}; SPN.rg[s]=(top(id)==="seoulall"&&id!=="seoulall"?"서울 · ":"")+c.ko; SPN.ord[s]=j+1; if(!SPN.P[s]) SPN.P[s]="img/spotq/"+s+".jpg"; } }); }); }).then(function(){ return SPN; }); }
function evSpot(){ $("evTab").innerHTML='<div class="card"><div class="msg">명소 목록을 불러오는 중…</div></div>';

function spCount(){ $("spN").textContent=document.querySelectorAll(".spk:checked").length; }
function spRand(){ var a=[].slice.call(document.querySelectorAll(".spk")); a.forEach(function(x){ x.checked=false; }); for(var i=0;i<10&&a.length;i++){ var k=Math.floor(Math.random()*a.length); a.splice(k,1)[0].checked=true; } spCount(); }

    +'<button class="g" onclick="phView(\''+x.uid+'\')">보기</button><select id="phR_'+x.uid+'"><option value="">순위 없음</option><option value="1">1등</option><option value="2">2등</option><option value="3">3등</option></select><button class="g" onclick="phDel(\''+x.uid+'\')">삭제</button></div><div id="phI_'+x.uid+'"></div></div>'; });

  P.innerHTML='<div class="card" style="border-color:var(--bar2);background:rgba(245,159,0,.10)"><b>⚠ 아래 요금은 가정값입니다 — 실제 요금 미확정 (결제 전)</b>'
    +'<div class="msg">요금표(허브 GUIDE_PRICES: 영어 반일 20만·종일 35만 등)는 <b>시장조사 전 가정값</b>입니다. 결제금액·수수료·지급액은 모두 참고용이며 실제 시장요금이 아닙니다.</div></div>'
    +'<div class="card"><div class="row"><b style="flex:1">가이드 예약·결제 장부 (MIS)</b></div>'
    +'<div class="msg">통역·길안내 가이드가 날짜별로 얼마나 일했고 결제·수수료·지급액이 얼마인지 보는 장부입니다. '
    +'<b>요금은 가정값</b>이며 시장조사 후 바뀝니다. 지금은 손수 입력, 나중에 결제(PG)가 붙으면 자동으로 쌓입니다.</div>'
    +'<div class="row" style="margin-top:8px"><button class="g" id="misP_this" onclick="misSetMode(\'this\')">이번 달</button>'
    +'<button class="g" id="misP_last" onclick="misSetMode(\'last\')">지난 달</button>'
    +'<button class="g" id="misP_custom" onclick="misSetMode(\'custom\')">직접 범위</button>'
    +'<input type="date" id="misF" value="'+MIS.from+'" onchange="MIS.mode=\'custom\';MIS.from=this.value;misFetch()"> ~ '
    +'<input type="date" id="misT" value="'+MIS.to+'" onchange="MIS.mode=\'custom\';MIS.to=this.value;misFetch()">'
    +'<button onclick="misFetch()">보기</button><button class="g" onclick="xlsMis()">엑셀 받기</button>'
    +'<button class="g" onclick="misClearTest()">데모 데이터 지우기</button></div>'
    +'<div id="misSum"></div></div>'
    +'<div class="card"><b>＋ 예약·결제 기록 추가</b><div class="msg">결제 연결 전, 끝난 투어를 손수 적어 둘 때 씁니다. 금액은 요금표에서 자동으로 채워지며 고칠 수 있습니다.</div><div id="misAdd"></div></div>'
    +'<div class="card"><div class="row"><b style="flex:1">날짜별</b></div><div class="tw"><table id="misTab"></table></div></div>'
    +'<div class="card"><b>가이드별 합계 (고른 기간 · 결제완료·완료 건)</b><div class="tw"><table id="misG"></table></div></div>';
  $("misP_this").classList.add("on");
  misAddForm(); misFetch(); }
function misFetch(){ var S=$("misSum"); if(S) S.innerHTML='<div class="msg">불러오는 중…</div>';
  api("/guide/admin/bookings?from="+MIS.from+"&to="+MIS.to).then(function(j){ if(!j.ok) throw new Error("x");
    MIS.items=j.items||[]; MIS.prices=j.prices||null; misDraw();
  }).catch(function(e){ if(S) S.innerHTML='<div class="msg err">불러오지 못했습니다 ('+esc(e.message)+')</div>'; }); }
function misDraw(){ var it=MIS.items, paid=it.filter(misPaid);
  var sum={n:paid.length,amount:0,fee:0,payout:0,hours:0}; paid.forEach(function(x){ sum.amount+=x.amount||0; sum.fee+=x.fee||0; sum.payout+=x.payout||0; sum.hours+=x.hours||0; });
  $("misSum").innerHTML='<div class="tiles">'+tile(sum.n.toLocaleString()+"건","총 건수 (결제완료·완료)")+tile(won(sum.amount),"총 결제금액")+tile(won(sum.fee),"우리 수수료 합계 (20%)")+tile(won(sum.payout),"가이드 지급 합계 (80%)")+'</div>'
    +'<div class="msg">'+esc(MIS.from)+' ~ '+esc(MIS.to)+' · 날짜는 한국 시간 · 요청·취소 건은 금액 합계에서 뺍니다'+(it.some(function(x){return x.test;})?' · <b>시험(데모) 건 포함</b>':'')+'</div>';
  // 날짜별 표
  var h='<tr><th class="l">날짜</th><th class="l">가이드</th><th class="l">언어</th><th>반일/종일</th><th>근무시간</th><th>결제금액</th><th>수수료(20%)</th><th>가이드 지급액</th><th class="l">상태</th><th></th></tr>';
  it.forEach(function(x){ h+='<tr'+(x.test?' style="opacity:.7"':'')+'><td class="l">'+esc(x.date)+'</td><td class="l">'+esc(x.gname||'')+(x.test?' <span class="sub">[시험]</span>':'')+'</td><td class="l">'+esc(gLangNm(x.lang))+'</td><td>'+esc(BKT[x.type]||x.type)+'</td><td>'+(x.hours||BKH[x.type]||0)+'시간</td><td>'+won(x.amount)+'</td><td>'+won(x.fee)+'</td><td>'+won(x.payout)+'</td><td class="l">'+esc(BKS[x.status]||x.status)+'</td><td><button class="g" data-id="'+esc(x.id)+'" onclick="misDel(this.dataset.id)" title="이 기록 지우기">✕</button></td></tr>'; });
  if(!it.length) h+='<tr><td class="l" colspan="10">이 기간에 예약·결제 기록이 없습니다.</td></tr>';
  $("misTab").innerHTML=h;
  // 가이드별 합계 (결제완료·완료 건)
  var byG={}; paid.forEach(function(x){ var k=x.gid||('nm:'+x.gname); var g=byG[k]||(byG[k]={name:x.gname||'(이름없음)',langs:{},n:0,hours:0,amount:0,fee:0,payout:0}); g.langs[x.lang]=1; g.n++; g.hours+=x.hours||0; g.amount+=x.amount||0; g.fee+=x.fee||0; g.payout+=x.payout||0; });
  var gs=Object.keys(byG).map(function(k){ return byG[k]; }).sort(function(a,b){ return b.amount-a.amount; });
  var gh='<tr><th class="l">가이드</th><th class="l">언어</th><th>건수</th><th>총 근무시간</th><th>총 결제금액</th><th>총 수수료(우리)</th><th>총 지급액(가이드)</th></tr>';
  gs.forEach(function(g){ gh+='<tr><td class="l">'+esc(g.name)+'</td><td class="l">'+esc(Object.keys(g.langs).map(gLangNm).join(", "))+'</td><td>'+g.n+'</td><td>'+g.hours+'시간</td><td>'+won(g.amount)+'</td><td>'+won(g.fee)+'</td><td>'+won(g.payout)+'</td></tr>'; });
  if(gs.length) gh+='<tr><td class="l"><b>합계</b></td><td></td><td><b>'+paid.length+'</b></td><td><b>'+gs.reduce(function(s,g){return s+g.hours;},0)+'시간</b></td><td><b>'+won(sum.amount)+'</b></td><td><b>'+won(sum.fee)+'</b></td><td><b>'+won(sum.payout)+'</b></td></tr>';
  else gh+='<tr><td class="l" colspan="7">없음</td></tr>';
  $("misG").innerHTML=gh; }
// ── 예약·결제 기록 추가 폼 — 가이드 선택·날짜·반일/종일·언어·상태·금액(요금표 자동, 수정 가능) ──
function misAddForm(){ api("/guide/admin/all").then(function(j){ MIS.guides=(j&&j.approved)||[]; misAddDraw(); }).catch(function(){ MIS.guides=[]; misAddDraw(); }); }
function misAddDraw(){ var gopt=MIS.guides.length?MIS.guides.map(function(g){ return '<option value="'+esc(g.id)+'" data-langs="'+esc((g.langs||[]).join(","))+'">'+esc(g.name)+' ('+(g.langs||[]).map(gLangNm).join(",")+')</option>'; }).join(""):'<option value="">승인된 가이드가 없습니다</option>';
  $("misAdd").innerHTML='<div class="row" style="margin-top:8px;align-items:flex-end">'
    +'<label>가이드<br><select id="maG" onchange="maLangs();maAmt()">'+gopt+'</select></label>'
    +'<label>언어<br><select id="maL" onchange="maAmt()"></select></label>'
    +'<label>날짜<br><input type="date" id="maD" value="'+kday(0)+'"></label>'
    +'<label>종류<br><select id="maT" onchange="maAmt()"><option value="half">반일 (4시간)</option><option value="full">종일 (8시간)</option></select></label>'
    +'<label>상태<br><select id="maS"><option value="completed">완료</option><option value="paid">결제완료</option><option value="requested">요청</option><option value="cancelled">취소</option></select></label>'
    +'<label>결제금액(원)<br><input type="text" id="maA" style="width:110px" inputmode="numeric"></label>'
    +'<button onclick="misAdd()">넣기</button></div><div id="maMsg" class="msg"></div>';
  maLangs(); maAmt(); }
function maLangs(){ var sel=$("maG"), o=sel&&sel.selectedOptions[0], ls=(o&&o.dataset.langs||"").split(",").filter(Boolean);
  $("maL").innerHTML=(ls.length?ls:["en"]).map(function(l){ return '<option value="'+esc(l)+'">'+esc(gLangNm(l))+'</option>'; }).join(""); }
function maAmt(){ var l=$("maL").value, t=$("maT").value, p=MIS.prices&&MIS.prices[l]; if(p&&p[t]!=null) $("maA").value=p[t]; }
function misAdd(){ var m=$("maMsg"), gid=$("maG").value, lang=$("maL").value, date=$("maD").value, type=$("maT").value, status=$("maS").value, amount=$("maA").value.replace(/[^0-9]/g,"");
  if(!gid){ m.innerHTML='<span class="err">가이드를 고르세요 (승인된 가이드가 있어야 합니다).</span>'; return; }
  if(!date){ m.innerHTML='<span class="err">날짜를 넣으세요.</span>'; return; }
  m.textContent="넣는 중…";
  api("/guide/booking",{method:"POST",body:JSON.stringify({guideId:gid,lang:lang,date:date,type:type,status:status,amount:amount})}).then(function(j){
    if(!j.ok){ m.innerHTML='<span class="err">넣지 못했습니다 ('+esc(j.err||"")+').</span>'; return; }
    m.innerHTML='<b>넣었습니다.</b> '+esc(j.booking.date)+' · '+esc(j.booking.gname)+' · '+won(j.booking.amount)+' (수수료 '+won(j.booking.fee)+' · 지급 '+won(j.booking.payout)+')'; misFetch();
  }).catch(function(e){ m.innerHTML='<span class="err">넣지 못했습니다 ('+esc(e.message)+').</span>'; }); }
function misDel(id){ if(!confirm("이 기록을 지울까요?")) return; api("/guide/admin/booking/del",{method:"POST",body:JSON.stringify({id:id})}).then(function(j){ if(j&&j.ok) misFetch(); else alert("지우지 못했습니다."); }).catch(function(){ alert("지우지 못했습니다."); }); }
function misClearTest(){ if(!confirm("시험(데모)으로 넣은 예약 기록을 모두 지울까요?")) return; api("/guide/admin/booking/cleartest",{method:"POST",body:JSON.stringify({})}).then(function(j){ if(j&&j.ok){ alert((j.removed||0)+"건을 지웠습니다."); misFetch(); } else alert("지우지 못했습니다."); }).catch(function(){ alert("지우지 못했습니다."); }); }
// ── 엑셀: 요약 · 날짜별 · 가이드별 합계 ──
function xlsMis(){ if(!window.XLSX){ alert("엑셀 도구를 아직 못 불렀습니다."); return; } var it=MIS.items, paid=it.filter(misPaid);
  var sum={amount:0,fee:0,payout:0,hours:0}; paid.forEach(function(x){ sum.amount+=x.amount||0; sum.fee+=x.fee||0; sum.payout+=x.payout||0; sum.hours+=x.hours||0; });
  var s1=[[CO],["가이드 예약·결제 장부 (MIS)"],["기간",MIS.from+" ~ "+MIS.to+" (한국 시간)"],["만든 날",kday(0)],[],["총 건수(결제완료·완료)",paid.length],["총 결제금액(원)",sum.amount],["우리 수수료 합계(20%)",sum.fee],["가이드 지급 합계(80%)",sum.payout],["총 근무시간",sum.hours+"시간"],[],["※ 요금은 가정값(시장조사 후 교체) · 요청·취소 건은 금액 합계에서 제외"]];
  var s2=[["날짜","가이드","언어","반일/종일","근무시간","결제금액(원)","수수료(20%)","가이드 지급액(80%)","상태","시험"]].concat(it.map(function(x){ return [x.date,x.gname||"",gLangNm(x.lang),BKT[x.type]||x.type,(x.hours||0)+"시간",x.amount||0,x.fee||0,x.payout||0,BKS[x.status]||x.status,x.test?"시험":""]; }));
  var byG={}; paid.forEach(function(x){ var k=x.gid||('nm:'+x.gname); var g=byG[k]||(byG[k]={name:x.gname||'(이름없음)',langs:{},n:0,hours:0,amount:0,fee:0,payout:0}); g.langs[x.lang]=1; g.n++; g.hours+=x.hours||0; g.amount+=x.amount||0; g.fee+=x.fee||0; g.payout+=x.payout||0; });
  var s3=[["가이드","언어","건수","총 근무시간","총 결제금액(원)","총 수수료(우리)","총 지급액(가이드)"]].concat(Object.keys(byG).map(function(k){ return byG[k]; }).sort(function(a,b){ return b.amount-a.amount; }).map(function(g){ return [g.name,Object.keys(g.langs).map(gLangNm).join(", "),g.n,g.hours+"시간",g.amount,g.fee,g.payout]; }));
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,sheet(s1,[26,22]),"요약"); XLSX.utils.book_append_sheet(wb,sheet(s2,[12,14,12,10,9,14,13,15,9,6]),"날짜별"); XLSX.utils.book_append_sheet(wb,sheet(s3,[14,14,7,12,15,15,15]),"가이드별 합계");
  save(wb,"머니퍼즐_가이드장부_"+MIS.from+"_"+MIS.to+".xlsx"); }
